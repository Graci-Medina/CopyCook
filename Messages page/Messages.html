<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5EFE7;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 75px;
            background-color: #F5EFE7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 2px solid #E8B4B4;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo { margin-bottom: 40px; }
        .logo img { height: 50px; width: auto; cursor: pointer; }

        .nav-icons {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
            margin-top: 150px;
        }

        .nav-icon {
            position: relative;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon img { width: 100%; height: 100%; border-radius: 50%; }
        .nav-icon.active { box-shadow: 0 0 0 3px #E8B4B4; }

        .messages-unread-dot {
            position: absolute; top: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: #F06292; border: 2px solid #F5EFE7; box-sizing: border-box;
            display: none; pointer-events: none;
        }
        .messages-unread-dot.is-visible { display: block; }

        .nav-bottom { margin-top: auto; padding-bottom: 20px; }

        /* ── Left Panel (Messages List) ── */
        .messages-panel {
            width: 340px;
            flex-shrink: 0;
            background-color: #FDFBF7;
            border-right: 2px solid #E8B4B4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-header {
            padding: 28px 24px 16px;
            flex-shrink: 0;
        }

        .messages-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #2A2A2A;
            margin-bottom: 16px;
        }

        /* New Message button */
        .new-message-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .new-message-btn:hover { background: #F0EBE3; }

        .new-msg-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #E8B4B4, #D4A5A5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .new-msg-icon svg { width: 22px; height: 22px; }

        .new-msg-label {
            font-size: 15px;
            font-weight: 600;
            color: #2A2A2A;
        }

        /* Search inside panel */
        .msg-search {
            margin: 0 16px 12px;
            display: flex;
            align-items: center;
            background: #F0EBE3;
            border-radius: 12px;
            padding: 10px 14px;
            gap: 8px;
        }

        .msg-search input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #3A3A3A;
        }

        .msg-search input::placeholder { color: #9A9A9A; }

        /* Conversation list */
        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }

        .conv-list::-webkit-scrollbar { width: 6px; }
        .conv-list::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 6px; }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .conv-item:hover { background: #F0EBE3; }
        .conv-item.active { background: #F0EBE3; }

        .conv-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid #E8B4B4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .conv-info { flex: 1; min-width: 0; }

        .conv-name {
            font-size: 14px;
            font-weight: 600;
            color: #2A2A2A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-preview {
            font-size: 12px;
            color: #7A7A7A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .conv-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .conv-time {
            font-size: 11px;
            color: #9A9A9A;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #D4A5A5;
        }

        /* Section label */
        .conv-section-label {
            font-size: 11px;
            font-weight: 600;
            color: #9A9A9A;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 12px 12px 6px;
        }

        /* Empty conversations */
        .conv-empty {
            text-align: center;
            padding: 40px 20px;
            color: #9A9A9A;
            font-size: 13px;
        }

        .conv-empty svg { opacity: 0.3; margin-bottom: 10px; }

        /* ── Right Panel (Chat View) ── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #F5EFE7;
        }

        /* Chat top bar */
        .chat-topbar {
            display: flex;
            align-items: center;
            padding: 18px 28px;
            gap: 14px;
            background: #FDFBF7;
            border-bottom: 2px solid #E8B4B4;
            flex-shrink: 0;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #E8B4B4;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-contact-info { flex: 1; }

        .chat-contact-name {
            font-size: 16px;
            font-weight: 700;
            color: #2A2A2A;
        }

        .chat-contact-status {
            font-size: 12px;
            color: #9FB19F;
            font-weight: 500;
        }

        .chat-actions { display: flex; gap: 10px; }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #F0EBE3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }

        .icon-btn:hover { background: #E8B4B4; transform: scale(1.05); }
        .icon-btn svg { width: 18px; height: 18px; }

        /* ── Messages area ── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 6px; }

        /* Date divider */
        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #9A9A9A;
            font-weight: 500;
            position: relative;
            margin: 4px 0;
        }

        .date-divider::before, .date-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: #E8B4B4;
        }

        .date-divider::before { left: 0; }
        .date-divider::after { right: 0; }

        /* Message bubbles */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: fadeInUp 0.3s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-row.sent { flex-direction: row-reverse; }

        .msg-row-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        .msg-row-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .bubble-wrap { display: flex; flex-direction: column; gap: 2px; max-width: 60%; }
        .msg-row.sent .bubble-wrap { align-items: flex-end; }

        .bubble {
            padding: 11px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            color: #2A2A2A;
            word-break: break-word;
        }

        .bubble.received {
            background: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .bubble.sent {
            background: #9FB19F;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(159,177,159,0.3);
        }

        /* Recipe share bubble */
        .recipe-bubble {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            max-width: 240px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            border-bottom-left-radius: 4px;
        }

        .recipe-bubble:hover { transform: scale(1.02); }

        .recipe-bubble img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
        }

        .recipe-bubble-info {
            padding: 10px 14px 12px;
        }

        .recipe-bubble-label {
            font-size: 10px;
            font-weight: 600;
            color: #D4A5A5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .recipe-bubble-name {
            font-size: 13px;
            font-weight: 600;
            color: #2A2A2A;
        }

        .msg-time {
            font-size: 10px;
            color: #9A9A9A;
            padding: 0 4px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .typing-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #D4A5A5;
            animation: typingBounce 1.2s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ── Input area ── */
        .chat-input-area {
            padding: 16px 28px 20px;
            background: #FDFBF7;
            border-top: 2px solid #E8B4B4;
            flex-shrink: 0;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #F0EBE3;
            border-radius: 20px;
            padding: 10px 14px;
        }

        .input-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .input-icon-btn:hover { background: #E8B4B4; }
        .input-icon-btn svg { width: 18px; height: 18px; }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #3A3A3A;
            resize: none;
            line-height: 1.4;
        }

        .chat-input::placeholder { color: #9A9A9A; }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #9FB19F;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: #8AA08A; transform: scale(1.08); }
        .send-btn svg { width: 16px; height: 16px; }

        /* ── Logout popup ── */
        .logout-popup {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center; justify-content: center;
        }
        .logout-popup.active { display: flex; }
        .logout-content {
            background: #FDFBF7;
            border: 3px solid #E8B4B4;
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
        }
        .logout-content h3 { color: #3A3A3A; font-size: 22px; margin-bottom: 24px; font-weight: 500; }
        .logout-btn, .cancel-btn {
            width: 100%; padding: 14px 30px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; margin: 6px 0; transition: all 0.2s;
        }
        .logout-btn { background: #D4A5A5; color: white; }
        .logout-btn:hover { background: #C49595; }
        .delete-account-btn {
            width: 100%; padding: 12px 30px; margin: 8px 0;
            border: 1.5px solid #D4A5A5; border-radius: 12px;
            font-size: 14px; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: pointer; background: transparent; color: #9a6060;
            transition: background 0.2s, color 0.2s;
        }
        .delete-account-btn:hover {
            background: rgba(212, 165, 165, 0.15); color: #7a4040;
        }
        .cancel-btn { background: #9FB19F; color: white; }
        .cancel-btn:hover { background: #8AA08A; }

        /* ── Empty / No chat selected state ── */
        .no-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #9A9A9A;
        }

        .no-chat svg { opacity: 0.3; }

        .no-chat p {
            font-size: 15px;
            font-weight: 500;
        }

        /* ── New Message Modal ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #FDFBF7;
            border: 2px solid #E8B4B4;
            border-radius: 24px;
            padding: 32px;
            width: 420px;
            max-width: 92vw;
        }

        .modal-box h3 {
            font-size: 20px;
            font-weight: 700;
            color: #2A2A2A;
            margin-bottom: 20px;
        }

        .modal-search {
            display: flex;
            align-items: center;
            background: #F0EBE3;
            border-radius: 12px;
            padding: 10px 14px;
            gap: 8px;
            margin-bottom: 16px;
        }

        .modal-search input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #3A3A3A;
        }

        .modal-search input::placeholder { color: #9A9A9A; }

        .user-results {
            max-height: 240px;
            overflow-y: auto;
        }

        .user-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-result-item:hover { background: #F0EBE3; }

        .user-result-name {
            font-size: 14px;
            font-weight: 600;
            color: #2A2A2A;
        }

        .user-result-email {
            font-size: 12px;
            color: #9A9A9A;
        }

        .modal-close-btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #F0EBE3;
            color: #5A5A5A;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close-btn:hover { background: #E8B4B4; color: white; }

        .modal-hint {
            text-align: center;
            color: #9A9A9A;
            font-size: 13px;
            padding: 20px 0;
        }

        /* ── Recipe Picker Modal ── */
        .recipe-picker-list {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .recipe-picker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .recipe-picker-item:hover { background: #F0EBE3; }

        .recipe-picker-item img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .recipe-picker-name {
            font-size: 13px;
            font-weight: 600;
            color: #2A2A2A;
        }

        .recipe-picker-folder {
            font-size: 11px;
            color: #9A9A9A;
            margin-top: 2px;
        }

        /* Loading spinner */
        .spinner {
            text-align: center;
            padding: 30px;
            color: #9A9A9A;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .messages-panel { width: 260px; }
        }

        @media (max-width: 680px) {
            .messages-panel { display: none; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="CopyCook Logo">
        </div>
        <nav class="nav-icons">
            <a href="../Home page/home.html" class="nav-icon">
                <img src="home-icon.png" alt="Home">
            </a>
            <a href="../Explore/explore.html" class="nav-icon">
                <img src="explore-icon.png" alt="Explore">
            </a>
            <a href="../post page/post.html" class="nav-icon">
                <img src="plus-icon.png" alt="Add">
            </a>
            <a href="../Saved page/saved.html" class="nav-icon">
                <img src="save-icon.png" alt="Saved">
            </a>
            <a href="Messages.html" class="nav-icon active" aria-label="Messages">
                <img src="message.png" alt="">
                <span class="messages-unread-dot" aria-hidden="true"></span>
            </a>
        </nav>
        <div class="nav-bottom">
            <a href="#" class="nav-icon" onclick="toggleLogoutPopup(event)">
                <img src="settings-icon.png" alt="Settings">
            </a>
        </div>
    </aside>

    <!-- Messages List Panel -->
    <div class="messages-panel">
        <div class="messages-header">
            <h2>Messages</h2>
            <div class="new-message-btn" onclick="openNewMessageModal()">
                <div class="new-msg-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
                <span class="new-msg-label">New Message</span>
            </div>
        </div>

        <!-- Search -->
        <div class="msg-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="#9A9A9A" stroke-width="2"/>
                <path d="M16 16L20 20" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Search messages" id="msgSearchInput" oninput="filterConversations(this.value)">
        </div>

        <!-- Conversation list -->
        <div class="conv-list" id="convList">
            <div class="spinner">Loading conversations…</div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel" id="chatPanel">

        <!-- No chat selected -->
        <div class="no-chat" id="noChatState">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#D4A5A5" stroke-width="1.5" fill="none"/>
            </svg>
            <p>Select a conversation to start chatting</p>
        </div>

        <!-- Active chat -->
        <div id="activeChatState" style="display:none;flex:1;flex-direction:column;overflow:hidden;">

            <!-- Chat top bar -->
            <div class="chat-topbar">
                <div class="chat-avatar" id="chatAvatar"></div>
                <div class="chat-contact-info">
                    <div class="chat-contact-name" id="chatName" onclick="openOtherProfile()" style="cursor:pointer;transition:color 0.2s;" onmouseover="this.style.color='#D4A5A5'" onmouseout="this.style.color='#2A2A2A'"></div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" title="Voice call" onclick="showToast('Voice calls coming soon!')">

<div id="toast" style="

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, deleteUser as firebaseAuthDeleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
    deleteUserFirestoreData,
    pruneConversationsWithDeletedParticipants,
    dedupeUsersByEmail
} from '../firebase-functions.js';
import {
    getFirestore, doc, setDoc, getDoc, getDocs, addDoc, updateDoc,
    collection, query, orderBy, onSnapshot, serverTimestamp,
    where
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ── Firebase init ──
const firebaseConfig = {
    apiKey: "AIzaSyACkR3_vUNa7dzD-Y3pWmLeM4Iu-UlxuDw",
    authDomain: "copycook-f596a.firebaseapp.com",
    projectId: "copycook-f596a",
    storageBucket: "copycook-f596a.firebasestorage.app",
    messagingSenderId: "366122548728",
    appId: "1:366122548728:web:b4300be3464e7e07822a0d",
    measurementId: "G-P41J5BYDR0"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const navParams = new URLSearchParams(window.location.search);
const openConvParam = navParams.get('openConv') || '';
const openOtherUidParam = navParams.get('otherUid') || '';
const openOtherNameParam = navParams.get('otherName') || '';
let pendingConversationRestore = !!(openConvParam || openOtherUidParam);

window.deleteAccount = async function () {
    if (!confirm(
        'Delete your account permanently? This removes your profile, saved folders, likes, and all conversations (for you and people you chatted with). This cannot be undone.'
    )) return;
    const user = auth.currentUser;
    if (!user) {
        alert('You are not signed in.');
        return;
    }
    try {
        await deleteUserFirestoreData(user.uid);
        await firebaseAuthDeleteUser(user);
        localStorage.clear();
        sessionStorage.clear();
        closeLogoutPopup();
        window.location.href = '../login.html';
    } catch (e) {
        console.error('deleteAccount:', e);
        const code = e && e.code ? e.code : '';
        const msg = code === 'auth/requires-recent-login'
            ? 'For security, log out, sign in again, then delete your account.'
            : (e.message || 'Could not delete account. Try again.');
        alert(msg);
    }
};

// ── State ──
let currentUser    = null;
let activeConvId   = null;
let messagesUnsub  = null;   // active onSnapshot unsubscriber for messages
let convsUnsub     = null;   // active onSnapshot for conversation list
let allConversations = [];   // raw data for filter
let userSearchTimeout = null;

// ── Avatar colors ──
const AVATAR_COLORS = ['#D4A5A5','#9FB19F','#A5B4D4','#D4C4A5','#B4A5D4','#A5D4C4','#D4A5B4','#C4D4A5'];

function colorFor(str) {
    let h = 0;
    for (const c of (str || 'X')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function makeInitial(name) {
    return (name || '?').charAt(0).toUpperCase();
}

function avatarStyle(name, size = 48) {
    return `width:${size}px;height:${size}px;border-radius:50%;background:${colorFor(name)};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.38)}px;font-weight:700;color:white;flex-shrink:0;`;
}

function timeLabel(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    const diffH   = Math.floor(diffMs / 3600000);
    const diffD   = Math.floor(diffMs / 86400000);
    if (diffMin < 1)  return 'Just now';
    if (diffMin < 60) return `${diffMin}m`;
    if (diffH < 24)   return `${diffH}h`;
    if (diffD < 7)    return `${diffD}d`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function msgTimeLabel(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// ── Toast ──
window.showToast = function(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 2500);
};

// ── Auth guard ──
onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location.href = '../login.html';
        return;
    }
    currentUser = user;

    // Derive name + color from Auth (signup.js only writes to Auth, not Firestore)
    const displayName = user.displayName || localStorage.getItem('userDisplayName') || user.email;
    const initial     = makeInitial(displayName);
    const avatarColor = localStorage.getItem('userAvatarColor') || colorFor(user.uid);

    // Always upsert user doc so the users collection is populated for search
    try {
        await setDoc(doc(db, 'users', user.uid), {
            uid:         user.uid,
            displayName: displayName,
            email:       user.email || '',
            avatarColor: avatarColor,
            profileUpdatedAt: serverTimestamp()
        }, { merge: true });
    } catch(e) {
        console.warn('Could not upsert user doc:', e);
    }

    localStorage.setItem('userInitial',     initial);
    localStorage.setItem('userAvatarColor', avatarColor);
    localStorage.setItem('userName',        displayName);
    localStorage.setItem('userUID',         user.uid);

    // Bust the users cache so search picks up freshly written docs
    _usersCache = null;

    try {
        await pruneConversationsWithDeletedParticipants(user.uid);
    } catch (e) {
        console.warn('prune orphaned conversations:', e);
    }
    loadConversations();
});

// ══════════════════════════════════════════════
// CONVERSATION LIST
// ══════════════════════════════════════════════

/*
  Firestore schema:
  conversations/{convId}
    participants: [uid1, uid2]
    participantNames: { uid1: "Alice", uid2: "Bob" }
    lastMessage: "Hey!"
    lastMessageAt: Timestamp
    unreadCount: { uid1: 0, uid2: 2 }

  conversations/{convId}/messages/{msgId}
    senderId: uid
    senderName: string
    text: string (or null)
    recipe: { name, img, id } (or null)
    createdAt: Timestamp
*/

function loadConversations() {
    if (convsUnsub) convsUnsub();

    const q = query(
        collection(db, 'conversations'),
        where('participants', 'array-contains', currentUser.uid),
        orderBy('lastMessageAt', 'desc')
    );

    convsUnsub = onSnapshot(q, snapshot => {
        allConversations = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderConvList(allConversations);
        updateUnreadBadge(allConversations);
        tryRestoreConversationFromNav(allConversations);
    }, err => {
        console.error('Conversations listener error:', err);
        // If index not built yet, fall back to simple query
        const fallback = query(
            collection(db, 'conversations'),
            where('participants', 'array-contains', currentUser.uid)
        );
        convsUnsub = onSnapshot(fallback, snapshot => {
            allConversations = snapshot.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const ta = a.lastMessageAt?.toMillis?.() || 0;
                    const tb = b.lastMessageAt?.toMillis?.() || 0;
                    return tb - ta;
                });
            renderConvList(allConversations);
            updateUnreadBadge(allConversations);
            tryRestoreConversationFromNav(allConversations);
        });
    });
}

function tryRestoreConversationFromNav(convs) {
    if (!pendingConversationRestore || !Array.isArray(convs) || !convs.length) return;
    const match = convs.find((conv) => {
        if (openConvParam && conv.id === openConvParam) return true;
        if (openOtherUidParam && Array.isArray(conv.participants)) {
            return conv.participants.includes(openOtherUidParam);
        }
        return false;
    });
    if (!match) return;
    const otherUid = match.participants.find((p) => p !== currentUser.uid) || openOtherUidParam;
    const otherName = match.participantNames?.[otherUid] || openOtherNameParam || 'Unknown User';
    pendingConversationRestore = false;
    openConversation(match.id, otherName, otherUid);
}

function updateUnreadBadge(convs) {
    let total = 0;
    convs.forEach(c => {
        total += (c.unreadCount?.[currentUser.uid] || 0);
    });
    const visible = total > 0;
    document.querySelectorAll('.messages-unread-dot').forEach((el) => {
        el.classList.toggle('is-visible', visible);
        el.setAttribute('aria-hidden', visible ? 'false' : 'true');
    });
}

function renderConvList(convs) {
    const list = document.getElementById('convList');

    if (!convs.length) {
        list.innerHTML = `
            <div class="conv-empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#D4A5A5" stroke-width="1.5" fill="none"/>
                </svg>
                <p>No conversations yet.<br>Start one with the button above!</p>
            </div>`;
        return;
    }

    list.innerHTML = '<div class="conv-section-label">Recent</div>';

    convs.forEach(conv => {
        const otherUid  = conv.participants.find(p => p !== currentUser.uid);
        const otherName = conv.participantNames?.[otherUid] || 'Unknown User';
        const unread    = conv.unreadCount?.[currentUser.uid] || 0;
        const preview   = conv.lastMessage || 'Start a conversation';
        const timeStr   = conv.lastMessageAt ? timeLabel(conv.lastMessageAt) : '';
        const isActive  = conv.id === activeConvId;

        const item = document.createElement('div');
        item.className = 'conv-item' + (isActive ? ' active' : '');
        item.dataset.id = conv.id;
        item.onclick = () => openConversation(conv.id, otherName, otherUid);

        item.innerHTML = `
            <div class="conv-avatar" style="${avatarStyle(otherName, 48)}">${makeInitial(otherName)}</div>
            <div class="conv-info">
                <div class="conv-name">${escHtml(otherName)}</div>
                <div class="conv-preview">${escHtml(preview)}</div>
            </div>
            <div class="conv-meta">
                <span class="conv-time">${timeStr}</span>
                ${unread > 0 ? '<div class="unread-dot"></div>' : ''}
            </div>
        `;

        list.appendChild(item);
    });
}

function filterConversations(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
        renderConvList(allConversations);
        return;
    }
    const filtered = allConversations.filter(conv => {
        const otherUid  = conv.participants.find(p => p !== currentUser.uid);
        const otherName = (conv.participantNames?.[otherUid] || '').toLowerCase();
        const preview   = (conv.lastMessage || '').toLowerCase();
        return otherName.includes(q) || preview.includes(q);
    });
    renderConvList(filtered);
}

// Expose to inline handlers
window.filterConversations = filterConversations;

// ══════════════════════════════════════════════
// OPEN CONVERSATION
// ══════════════════════════════════════════════

async function openConversation(convId, otherName, otherUid) {
    activeConvId = convId;

    // Update sidebar active state
    document.querySelectorAll('.conv-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === convId);
    });

    // Show chat panel
    document.getElementById('noChatState').style.display = 'none';
    const chatState = document.getElementById('activeChatState');
    chatState.style.display = 'flex';

    // Set header
    const avatarEl = document.getElementById('chatAvatar');
    avatarEl.style.cssText = `${avatarStyle(otherName, 44)}border:2px solid #E8B4B4;`;
    avatarEl.textContent = makeInitial(otherName);
    document.getElementById('chatName').textContent = otherName;


    // Store for send
    chatState.dataset.convId   = convId;
    chatState.dataset.otherUid  = otherUid || '';
    chatState.dataset.otherName = otherName;

    // Mark unread as 0
    await markAsRead(convId);

    // Subscribe to messages
    subscribeMessages(convId, otherName);
}

async function markAsRead(convId) {
    try {
        const convRef = doc(db, 'conversations', convId);
        await updateDoc(convRef, {
            [`unreadCount.${currentUser.uid}`]: 0
        });
    } catch (e) { /* ignore */ }
}

function subscribeMessages(convId, otherName) {
    if (messagesUnsub) messagesUnsub();

    const msgsRef = query(
        collection(db, 'conversations', convId, 'messages'),
        orderBy('createdAt', 'asc')
    );

    messagesUnsub = onSnapshot(msgsRef, snapshot => {
        if (activeConvId !== convId) return;
        renderMessages(snapshot.docs.map(d => ({ id: d.id, ...d.data() })), otherName);
    });
}

// ══════════════════════════════════════════════
// RENDER MESSAGES
// ══════════════════════════════════════════════

function renderMessages(messages, otherName) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';

    if (!messages.length) {
        const hint = document.createElement('div');
        hint.style.cssText = 'text-align:center;color:#9A9A9A;font-size:13px;padding:40px 20px;';
        hint.textContent = `Say hi to ${otherName}! 👋`;
        container.appendChild(hint);
        return;
    }

    const myInitial = localStorage.getItem('userInitial') || makeInitial(currentUser.displayName);
    const myColor   = localStorage.getItem('userAvatarColor') || colorFor(currentUser.uid);

    let lastDateStr = null;

    messages.forEach(msg => {
        const isSent = msg.senderId === currentUser.uid;
        const ts = msg.createdAt;

        // Date divider
        if (ts) {
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            const dateStr = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            if (dateStr !== lastDateStr) {
                lastDateStr = dateStr;
                const divider = document.createElement('div');
                divider.className = 'date-divider';
                divider.textContent = dateStr;
                container.appendChild(divider);
            }
        }

        const row = document.createElement('div');
        row.className = 'msg-row ' + (isSent ? 'sent' : 'received');

        // Avatar (other person only)
        if (!isSent) {
            const avDiv = document.createElement('div');
            avDiv.className = 'msg-row-avatar';
            avDiv.style.cssText = `background:${colorFor(msg.senderName || otherName)};`;
            avDiv.textContent = makeInitial(msg.senderName || otherName);
            row.appendChild(avDiv);
        }

        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap';

        if (msg.recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-bubble';
            card.innerHTML = `
                <img src="${escHtml(msg.recipe.img)}" alt="${escHtml(msg.recipe.name)}"
                    onerror="this.src='https://www.themealdb.com/images/media/meals/sytuqu1511553755.jpg'">
                <div class="recipe-bubble-info">
                    <div class="recipe-bubble-label">Shared Recipe ↗</div>
                    <div class="recipe-bubble-name">${escHtml(msg.recipe.name)}</div>
                </div>
            `;
            // Click opens the recipe page if we have an id, otherwise search by name
            card.addEventListener('click', () => {
                const id = msg.recipe.id;
                if (id) {
                    const rawId = String(id);
                    if (rawId.startsWith('post-')) {
                        const postId = rawId.replace(/^post-/, '');
                        window.location.href = `../Home page/community-recipe.html?id=${encodeURIComponent(postId)}`;
                    } else {
                        window.location.href = `../Home page/recipe.html?id=${encodeURIComponent(rawId)}`;
                    }
                } else {
                    // fallback: search MealDB by name and go to first result
                    fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(msg.recipe.name)}`)
                        .then(r => r.json())
                        .then(data => {
                            const meal = data.meals?.[0];
                            if (meal) {
                                window.location.href = `../Home page/recipe.html?id=${meal.idMeal}`;
                            } else {
                                showToast('Recipe not found.');
                            }
                        })
                        .catch(() => showToast('Could not open recipe.'));
                }
            });
            wrap.appendChild(card);
        } else {
            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + (isSent ? 'sent' : 'received');
            bubble.textContent = msg.text || '';
            wrap.appendChild(bubble);
        }

        const timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        timeEl.textContent = ts ? msgTimeLabel(ts) : '';
        wrap.appendChild(timeEl);

        row.appendChild(wrap);

        // My avatar
        if (isSent) {
            const avDiv = document.createElement('div');
            avDiv.className = 'msg-row-avatar';
            avDiv.style.cssText = `background:${myColor};`;
            avDiv.textContent = myInitial;
            row.appendChild(avDiv);
        }

        container.appendChild(row);
    });

    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}

// ══════════════════════════════════════════════
// SEND MESSAGE
// ══════════════════════════════════════════════

async function sendMessage(recipePayload = null) {
    if (!activeConvId || !currentUser) return;

    const input = document.getElementById('chatInput');
    const text  = input.value.trim();
    if (!text && !recipePayload) return;

    const chatState = document.getElementById('activeChatState');
    const otherUid  = chatState.dataset.otherUid;
    const otherName = chatState.dataset.otherName;
    const myName    = localStorage.getItem('userName') || currentUser.displayName || currentUser.email;

    const msgData = {
        senderId:   currentUser.uid,
        senderName: myName,
        text:       recipePayload ? null : text,
        recipe:     recipePayload || null,
        createdAt:  serverTimestamp()
    };

    try {
        // Add message doc
        await addDoc(collection(db, 'conversations', activeConvId, 'messages'), msgData);

        // Update conversation metadata
        const convRef = doc(db, 'conversations', activeConvId);
        await updateDoc(convRef, {
            lastMessage:    recipePayload ? `📷 Shared: ${recipePayload.name}` : text,
            lastMessageAt:  serverTimestamp(),
            [`unreadCount.${otherUid}`]: (await getDoc(convRef)).data()?.unreadCount?.[otherUid] + 1 || 1
        });

        // Clear input
        if (!recipePayload) {
            input.value = '';
            input.style.height = 'auto';
        }
    } catch (e) {
        console.error('Send error:', e);
        showToast('Failed to send message.');
    }
}

window.sendMessage = sendMessage;

window.handleInputKey = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
};

window.autoResize = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};

// ══════════════════════════════════════════════
// NEW MESSAGE MODAL — find user by name
// ══════════════════════════════════════════════

window.openNewMessageModal = function() {
    document.getElementById('userSearchInput').value = '';
    document.getElementById('userResults').innerHTML = '<div class="modal-hint">Start typing to find someone</div>';
    document.getElementById('newMsgModal').classList.add('active');
};

window.closeNewMessageModal = function() {
    document.getElementById('newMsgModal').classList.remove('active');
};

window.searchUsers = function(value) {
    clearTimeout(userSearchTimeout);
    const q = value.trim();
    if (!q || q.length < 2) {
        document.getElementById('userResults').innerHTML = '<div class="modal-hint">Start typing to find someone</div>';
        return;
    }
    userSearchTimeout = setTimeout(() => doUserSearch(q), 300);
};

// Cache all users once so repeated keystrokes don't re-fetch
let _usersCache = null;

async function doUserSearch(searchQ) {
    const resultsEl = document.getElementById('userResults');
    resultsEl.innerHTML = '<div class="spinner">Searching…</div>';

    try {
        // Fetch all users once and cache — avoids needing a Firestore index
        if (!_usersCache) {
            const snap = await getDocs(collection(db, 'users'));
            const raw = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
            _usersCache = dedupeUsersByEmail(raw);
        }

        const q = searchQ.toLowerCase();
        const matches = _usersCache.filter(u => {
            if (u.uid === currentUser.uid) return false;
            const name  = (u.displayName || '').toLowerCase();
            const email = (u.email || '').toLowerCase();
            return name.includes(q) || email.includes(q);
        }).slice(0, 10);

        if (!matches.length) {
            resultsEl.innerHTML = '<div class="modal-hint">No users found</div>';
            return;
        }

        resultsEl.innerHTML = '';
        matches.forEach(u => {
            const item = document.createElement('div');
            item.className = 'user-result-item';
            item.innerHTML = `
                <div style="${avatarStyle(u.displayName, 40)}">${makeInitial(u.displayName)}</div>
                <div>
                    <div class="user-result-name">${escHtml(u.displayName || 'Unknown')}</div>
                    <div class="user-result-email">${escHtml(u.email || '')}</div>
                </div>
            `;
            item.onclick = () => startConversationWith(u);
            resultsEl.appendChild(item);
        });
    } catch (e) {
        console.error('User search error:', e.code, e.message, e);
        resultsEl.innerHTML = `<div class="modal-hint">Search failed: ${e.code || e.message || 'unknown error'}</div>`;
    }
}

async function startConversationWith(otherUser) {
    closeNewMessageModal();

    try {
        const myName    = localStorage.getItem('userName') || currentUser.displayName || currentUser.email;
        const otherName = otherUser.displayName || 'Unknown';

        const convId = [currentUser.uid, otherUser.uid].sort().join('_');
        const convRef = doc(db, 'conversations', convId);

        console.log('🔍 convId:', convId);
        console.log('🔍 currentUser.uid:', currentUser.uid);
        console.log('🔍 otherUser.uid:', otherUser.uid);

        // Try getDoc first
        let convSnap;
        try {
            convSnap = await getDoc(convRef);
            console.log('✅ getDoc succeeded, exists:', convSnap.exists());
        } catch(e) {
            console.error('❌ getDoc failed:', e.code, e.message);
            throw e;
        }

        if (!convSnap.exists()) {
            const convData = {
                participants: [currentUser.uid, otherUser.uid],
                participantNames: {
                    [currentUser.uid]: myName,
                    [otherUser.uid]:   otherName
                },
                lastMessage:   '',
                lastMessageAt: serverTimestamp(),
                unreadCount:   { [currentUser.uid]: 0, [otherUser.uid]: 0 },
                createdAt:     serverTimestamp()
            };
            console.log('📝 Creating conv doc with data:', JSON.stringify(convData));
            try {
                await setDoc(convRef, convData);
                console.log('✅ setDoc succeeded');
            } catch(e) {
                console.error('❌ setDoc failed:', e.code, e.message);
                throw e;
            }
            showToast(`Started a conversation with ${otherName}!`);
        }

        openConversation(convId, otherName, otherUser.uid);
    } catch (e) {
        console.error('Start conversation error:', e.code, e.message, e);
        showToast(`Error: ${e.code || e.message || 'unknown'}`);
    }
}

// ══════════════════════════════════════════════
// RECIPE PICKER
// ══════════════════════════════════════════════

window.openRecipePicker = async function() {
    if (!activeConvId) return;
    document.getElementById('recipePickerModal').classList.add('active');
    const listEl = document.getElementById('recipePickerList');
    listEl.innerHTML = '<div class="spinner">Loading your saved recipes…</div>';

    try {
        const foldersSnap = await getDocs(collection(db, 'users', currentUser.uid, 'folders'));
        const allRecipes = [];

        foldersSnap.docs.forEach(folderDoc => {
            const data = folderDoc.data();
            const saved = data.savedRecipes || [];
            saved.forEach(r => {
                allRecipes.push({
                    name:   r.strMeal || r.name || 'Unknown',
                    img:    r.strMealThumb || r.thumb || r.img || '',
                    id:     r.idMeal || r.id || '',
                    folder: data.name || folderDoc.id
                });
            });
        });

        if (!allRecipes.length) {
            listEl.innerHTML = '<div class="modal-hint">No saved recipes yet. Save some first!</div>';
            return;
        }

        listEl.innerHTML = '';
        allRecipes.forEach(r => {
            const item = document.createElement('div');
            item.className = 'recipe-picker-item';
            item.innerHTML = `
                <img src="${escHtml(r.img)}" alt="${escHtml(r.name)}"
                    onerror="this.src='https://www.themealdb.com/images/media/meals/sytuqu1511553755.jpg'">
                <div>
                    <div class="recipe-picker-name">${escHtml(r.name)}</div>
                    <div class="recipe-picker-folder">📁 ${escHtml(r.folder)}</div>
                </div>
            `;
            item.onclick = () => {
                closeRecipePicker();
                sendMessage({ name: r.name, img: r.img, id: r.id });
            };
            listEl.appendChild(item);
        });
    } catch (e) {
        console.error('Recipe picker error:', e);
        listEl.innerHTML = '<div class="modal-hint">Failed to load recipes.</div>';
    }
};

window.closeRecipePicker = function() {
    document.getElementById('recipePickerModal').classList.remove('active');
};

// ── View other user's profile ──
function openOtherProfile() {
    const chatState = document.getElementById('activeChatState');
    const otherUid  = chatState.dataset.otherUid;
    const otherName = chatState.dataset.otherName;
    const convId    = chatState.dataset.convId;
    if (!otherUid) return;
    // Store in sessionStorage so profile.html can read it
    sessionStorage.setItem('viewProfileUid',  otherUid);
    sessionStorage.setItem('viewProfileName', otherName);
    const q = new URLSearchParams({
        uid: otherUid,
        source: 'messages',
        openConv: convId || '',
        otherUid: otherUid,
        otherName: otherName || ''
    });
    window.location.href = '../Saved page/profile.html?' + q.toString();
}
window.openOtherProfile = openOtherProfile;

// ── Utility ──
function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

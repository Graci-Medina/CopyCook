<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
<!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="CopyCook Logo">
            </div>
            <nav class="nav-icons">
                <a href="home.html" class="nav-icon active">
                    <img src="home-icon.png" alt="Home">
                </a>
                <a href="../Explore/explore.html" class="nav-icon">
                    <img src="explore-icon.png" alt="Explore">
                </a>
                <a href="../post page/post.html" class="nav-icon">
                    <img src="plus-icon.png" alt="Add">
                </a>
                <a href="../Saved page/saved.html" class="nav-icon">
                    <img src="save-icon.png" alt="Saved">
                </a>
                <a href="../Messages page/Messages.html" class="nav-icon" aria-label="Messages">
                    <img src="message.png" alt="">
                    <span class="messages-unread-dot" aria-hidden="true"></span>
                </a>
            </nav>
            <div class="nav-bottom">
                <a href="#" class="nav-icon" onclick="toggleLogoutPopup(event)">
                    <img src="settings-icon.png" alt="Settings">
                </a>
            </div>
        </aside>
<!-- Main Content -->
        <main class="main-content">
<!-- Search Bar -->
            <div class="search-container">
                <div class="search-bar">
                    <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="7" stroke="#5A5A5A" stroke-width="2"/>
                        <path d="M16 16L20 20" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="mainSearchInput" placeholder="Search restaurants or dishes" oninput="searchRecipes(this.value)">
                    <svg class="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="10" y="5" width="4" height="10" rx="2" fill="#D4A5A5"/>
                        <path d="M7 12C7 14.7614 9.23858 17 12 17C14.7614 17 17 14.7614 17 12" stroke="#D4A5A5" stroke-width="2"/>
                        <line x1="12" y1="17" x2="12" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                        <line x1="9" y1="20" x2="15" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                    </svg>
                </div>
                <div class="profile-pic" id="profileAvatar">
                    <img src="drakepfp.png" alt="Profile">
                </div>
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar">
                <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">Home</button>
                <button class="tab-btn" id="tabCommunity" onclick="switchTab('community')">Community Posts</button>
            </div>

            <!-- Home Tab: Food Grid -->
            <div class="tab-content" id="tabContentHome">
                <div class="food-grid" id="foodGrid"></div>
            </div>

            <!-- Community Tab -->
            <div class="tab-content" id="tabContentCommunity" style="display:none;">
                <div class="community-grid" id="communityFeed">
                    <div class="community-empty">
                        <div class="empty-emoji">&#x1F373;</div>
                        <p>Loading recipes&#x2026;</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

<!-- Logout Popup -->
    <div id="logoutPopup" class="logout-popup">
        <div class="logout-content">
            <h3>Account Settings</h3>
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            <button type="button" class="delete-account-btn" onclick="deleteAccount()">Delete account</button>
            <button class="cancel-btn" onclick="closeLogoutPopup()">Cancel</button>
        </div>
    </div>

    <!-- Save to Folder Popup (single popup matching new design) -->
    <div id="savePopupOverlay" class="save-popup-overlay">
        <div class="save-popup">
            <div class="save-popup-header">
                <span class="save-popup-title">Save to folder</span>
                <button class="save-popup-close" onclick="closeSavePopup()">✕</button>
            </div>

            <div class="save-folders-list" id="saveFoldersList">
                <p style="font-size:13px;color:#9A9A9A;padding:4px 0;">Loading folders…</p>
            </div>

            <div class="new-folder-row">
                <input type="text" class="new-folder-input" id="newFolderNameInput" placeholder="New folder name…" maxlength="40">
                <button class="create-folder-btn" onclick="confirmCreateFolder()">+ Create</button>
            </div>

            <div class="privacy-row">
                <button class="privacy-btn active" id="privBtnPrivate" onclick="selectSavePrivacy('private')">Private</button>
                <button class="privacy-btn" id="privBtnPublic" onclick="selectSavePrivacy('public')">Public</button>
            </div>

            <div class="save-popup-actions">
                <button class="sp-cancel-btn" onclick="closeSavePopup()">Cancel</button>
                <button class="sp-save-btn" onclick="confirmSaveToFolder()">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="home-firebase.js"></script>
    <script type="module" src="../messages-unread-nav.js"></script>
    <script src="script.js"></script>
</body>
</html>

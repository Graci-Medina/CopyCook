<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Recipe</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5EFE7;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 75px; background-color: #f5efe7;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 0; border-right: 2px solid #E8B4B4; flex-shrink: 0;
        }
        .logo { margin-bottom: 40px; }
        .logo img { height: 50px; width: auto; cursor: pointer; }
        .nav-icons { display: flex; flex-direction: column; gap: 30px; flex: 1; margin-top: 150px; }
        .nav-icon {
            position: relative; width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.3s;
        }
        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon img { width: 100%; height: 100%; border-radius: 50%; }
        .nav-icon.active { box-shadow: 0 0 0 3px #E8B4B4; }
        .messages-unread-dot {
            position: absolute; top: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: #F06292; border: 2px solid #F5EFE7; box-sizing: border-box;
            display: none; pointer-events: none;
        }
        .messages-unread-dot.is-visible { display: block; }
        .nav-bottom { margin-top: auto; padding-bottom: 20px; }

        /* ── Main ── */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .search-container { display: flex; align-items: center; padding: 20px 30px; gap: 15px; flex-shrink: 0; }
        .search-bar {
            flex: 1; display: flex; align-items: center;
            background-color: #9FB19F; border-radius: 15px; padding: 15px 20px; gap: 12px;
        }
        .search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 16px; color: #3A3A3A; font-family: 'Poppins', sans-serif;
        }
        .search-bar input::placeholder { color: #5A5A5A; }
        .profile-pic {
            width: 50px; height: 50px; border-radius: 50%;
            border: 3px solid #E8B4B4; cursor: pointer; transition: transform 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-pic:hover { transform: scale(1.05); }

        .recipe-body { flex: 1; overflow: hidden; padding: 0 30px 30px; display: flex; gap: 25px; }

        .left-panel { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer;
            font-family: 'Poppins', sans-serif; font-size: 15px;
            color: #5A5A5A; padding: 0; transition: color 0.2s;
        }
        .back-btn:hover { color: #D4A5A5; }
        .action-row { display: flex; align-items: center; gap: 14px; }
        .action-btn {
            background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { background: rgba(212,165,165,0.15); transform: scale(1.1); }
        .like-btn .heart-path { transition: fill 0.2s, stroke 0.2s; }
        .like-btn.liked .heart-path { fill: #D4A5A5; stroke: #D4A5A5; }

        .save-action-btn {
            margin-left: auto; background-color: #9FB19F; color: white;
            border: none; padding: 10px 28px; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; transition: background 0.2s, transform 0.2s;
        }
        .save-action-btn:hover { background-color: #8AA08A; transform: scale(1.03); }

        .recipe-image-wrap {
            border-radius: 20px; overflow: hidden; aspect-ratio: 3/4;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .recipe-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; overflow-y: auto; padding-right: 4px; }
        .right-panel::-webkit-scrollbar { width: 8px; }
        .right-panel::-webkit-scrollbar-track { background: #F5EFE7; }
        .right-panel::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 8px; }
        .recipe-title { font-size: 32px; font-weight: 700; color: #2A2A2A; line-height: 1.2; }
        .category-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background-color: #E8B4B4; color: #5A3A3A;
            padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
        }
        .card { background: white; border-radius: 20px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card-title { font-size: 18px; font-weight: 700; color: #2A2A2A; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .ingredient-list { display: flex; flex-direction: column; gap: 10px; }
        .ingredient-row { display: flex; align-items: center; gap: 14px; font-size: 14px; }
        .ingredient-dot { width: 14px; height: 14px; border-radius: 50%; background-color: #E8B4B4; flex-shrink: 0; }
        .ingredient-measure { font-weight: 600; color: #3A3A3A; min-width: 80px; }
        .ingredient-name { color: #5A5A5A; }
        .instructions-list { display: flex; flex-direction: column; gap: 10px; }
        .instruction-step { background-color: #F8E8E8; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; color: #3A3A3A; line-height: 1.6; }
        .loading-state { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 16px; color: #9FB19F; }
        .cost-note { font-size: 12px; color: #8A7A7A; margin-top: 12px; line-height: 1.5; }
        .cost-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .cost-box {
            border-radius: 12px; padding: 12px 14px;
            background: #FDF5F5; border: 1px solid #F3DADA;
        }
        .cost-box.home { background: #F4FAF4; border-color: #D8E9D8; }
        .cost-label { font-size: 12px; color: #7C6A6A; margin-bottom: 4px; }
        .cost-value { font-size: 19px; font-weight: 700; color: #2A2A2A; }
        .cost-subvalue { font-size: 12px; color: #8E7E7E; margin-top: 3px; }
        .cost-savings {
            margin-top: 14px; border-radius: 12px; padding: 12px 14px;
            background: #FFF7EA; border: 1px solid #F2DEC2;
            font-size: 13px; color: #5A4A3A; line-height: 1.55;
        }

        /* ── Save popup ── */
        .save-popup-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 1100;
            align-items: center; justify-content: center;
        }
        .save-popup-overlay.active { display: flex; }

        .save-popup {
            background: #fff; border: 2px solid #E8B4B4;
            border-radius: 24px; padding: 28px 28px 24px;
            width: 420px; max-width: 95vw;
            max-height: 90vh;
            box-shadow: 0 16px 48px rgba(0,0,0,0.18);
            display: flex; flex-direction: column; gap: 18px;
            overflow: hidden;
            overflow-y: auto;
            animation: popIn 0.22s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .save-popup-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .save-popup-title { font-size: 20px; font-weight: 700; color: #2A2A2A; }
        .save-popup-close {
            background: none; border: none; cursor: pointer;
            font-size: 20px; color: #9A9A9A; line-height: 1;
            padding: 2px 6px; border-radius: 6px; transition: color 0.2s;
        }
        .save-popup-close:hover { color: #D4A5A5; }

        /* Folder list */
        .save-folders-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 260px; overflow-y: auto;
        }
        .save-folders-list::-webkit-scrollbar { width: 5px; }
        .save-folders-list::-webkit-scrollbar-thumb { background: #E8B4B4; border-radius: 5px; }

        .save-folder-item {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 12px; border-radius: 14px;
            border: 1.5px solid #F0E4E4;
            cursor: pointer; transition: background 0.18s, border-color 0.18s;
            background: #fff;
        }
        .save-folder-item:hover { background: #FDF5F5; border-color: #E8B4B4; }
        .save-folder-item.selected { background: #FDF5F5; border-color: #D4A5A5; }

        .save-folder-thumb {
            width: 46px; height: 46px; border-radius: 10px;
            overflow: hidden; flex-shrink: 0; background: #F0E4E4;
        }
        .save-folder-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .save-folder-info { flex: 1; }
        .save-folder-name { font-size: 14px; font-weight: 700; color: #2A2A2A; }
        .save-folder-count { font-size: 12px; color: #A08080; margin-top: 1px; }

        /* Radio circle */
        .save-folder-radio {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid #D4A5A5; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.18s;
        }
        .save-folder-item.selected .save-folder-radio {
            background: #D4A5A5;
        }
        .save-folder-item.selected .save-folder-radio::after {
            content: '';
            width: 8px; height: 8px; border-radius: 50%;
            background: white;
        }

        /* New folder row */
        .new-folder-row {
            display: flex; gap: 10px; align-items: center;
            flex-wrap: nowrap;
            width: 100%;
        }
        .new-folder-input {
            flex: 1; min-width: 0; border: 1.5px solid #E8B4B4; border-radius: 12px;
            padding: 11px 14px; font-size: 14px;
            font-family: 'Poppins', sans-serif; color: #2A2A2A;
            outline: none; background: white; transition: border-color 0.2s;
        }
        .new-folder-input:focus { border-color: #D4A5A5; }
        .new-folder-input::placeholder { color: #C4A8A8; }
        .create-folder-btn {
            background: #9FB19F; color: white;
            border: none; border-radius: 12px;
            padding: 11px 18px; font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer;
            white-space: nowrap; transition: background 0.2s;
        }
        .create-folder-btn:hover { background: #8AA08A; }

        /* Privacy toggle */
        .privacy-row { display: flex; gap: 10px; }
        .privacy-btn {
            flex: 1; padding: 10px; border-radius: 12px;
            border: 1.5px solid #E8B4B4; background: white;
            font-size: 13px; font-weight: 600;
            font-family: 'Poppins', sans-serif; color: #9A9A9A;
            cursor: pointer; transition: all 0.18s;
        }
        .privacy-btn.active { background: #9FB19F; border-color: #9FB19F; color: white; }

        /* Bottom actions */
        .save-popup-actions { display: flex; gap: 10px; }
        .sp-cancel-btn, .sp-save-btn {
            flex: 1; padding: 13px; border-radius: 14px; border: none;
            font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: all 0.18s;
        }
        .sp-cancel-btn { background: #F0EAE0; color: #5A5A5A; }
        .sp-cancel-btn:hover { background: #E8E0D4; }
        .sp-save-btn { background: #D4A5A5; color: white; }
        .sp-save-btn:hover { background: #c49090; }
        .sp-save-btn:disabled { background: #E0C8C8; cursor: not-allowed; }

        /* Share modal */
        .share-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 1200;
            align-items: center; justify-content: center;
        }
        .share-modal-overlay.active { display: flex; }
        .share-modal {
            width: 420px; max-width: 92vw;
            background: #FDFBF7; border: 2px solid #E8B4B4; border-radius: 22px;
            padding: 22px;
        }
        .share-title { font-size: 19px; font-weight: 700; color: #2A2A2A; margin-bottom: 12px; }
        .share-search {
            display: flex; align-items: center; gap: 8px;
            background: #F0EBE3; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
        }
        .share-search input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 14px; font-family: 'Poppins', sans-serif; color: #3A3A3A;
        }
        .share-results { max-height: 260px; overflow-y: auto; }
        .share-user {
            display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer;
            transition: background 0.2s;
        }
        .share-user:hover { background: #F0EBE3; }
        .share-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 14px; flex-shrink: 0;
        }
        .share-name { font-size: 14px; font-weight: 600; color: #2A2A2A; }
        .share-sub { font-size: 12px; color: #9A9A9A; }
        .share-empty { text-align: center; font-size: 13px; color: #9A9A9A; padding: 18px 10px; }
        .share-actions { margin-top: 12px; }
        .share-close-btn {
            width: 100%; border: none; border-radius: 12px; padding: 11px;
            background: #F0EBE3; color: #5A5A5A; font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer;
        }

        /* ── Comments drawer ── */
        .comments-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 500; }
        .comments-overlay.open { display: block; }
        .comments-drawer {
            position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
            background: #FDFBF7; border-left: 2px solid #E8B4B4;
            display: flex; flex-direction: column;
            transition: right 0.32s cubic-bezier(0.4,0,0.2,1);
            z-index: 501; box-shadow: -6px 0 28px rgba(0,0,0,0.1);
        }
        .comments-drawer.open { right: 0; }
        .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 18px; border-bottom: 1.5px solid #F0E4E4; flex-shrink: 0; }
        .drawer-title { font-size: 17px; font-weight: 700; color: #2A2A2A; }
        .drawer-close { background: none; border: none; cursor: pointer; color: #9A9A9A; font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 6px; transition: color 0.2s; }
        .drawer-close:hover { color: #D4A5A5; }
        .comments-list { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
        .comments-list::-webkit-scrollbar { width: 6px; }
        .comments-list::-webkit-scrollbar-thumb { background: #E8B4B4; border-radius: 6px; }
        .comment-item { display: flex; gap: 12px; align-items: flex-start; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-name { font-size: 12px; font-weight: 700; color: #3A3A3A; margin-bottom: 3px; }
        .comment-text { font-size: 13px; color: #5A5A5A; line-height: 1.5; word-break: break-word; }
        .comment-meta { font-size: 11px; color: #B0A0A0; margin-top: 4px; display: flex; align-items: center; gap: 10px; }
        .comment-delete { background: none; border: none; cursor: pointer; color: #D4A5A5; font-size: 11px; font-family: 'Poppins', sans-serif; padding: 0; transition: color 0.2s; }
        .comment-delete:hover { color: #b07070; }
        .comments-empty { text-align: center; padding: 48px 20px; color: #C4A0A0; }
        .comments-empty .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
        .comments-empty p { font-size: 14px; font-weight: 600; color: #9a7878; }
        .comment-input-area { padding: 16px 24px; border-top: 1.5px solid #F0E4E4; flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end; }
        .comment-input { flex: 1; border: 1.5px solid #E8B4B4; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-family: 'Poppins', sans-serif; color: #3A3A3A; background: white; resize: none; outline: none; min-height: 42px; max-height: 100px; line-height: 1.5; transition: border-color 0.2s; }
        .comment-input:focus { border-color: #D4A5A5; }
        .comment-input::placeholder { color: #B0A0A0; }
        .comment-send { background: #D4A5A5; border: none; border-radius: 12px; width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, transform 0.15s; }
        .comment-send:hover { background: #c49090; transform: scale(1.05); }
        .comment-send:disabled { background: #E0C8C8; cursor: not-allowed; transform: none; }

        /* ── Logout popup ── */
        .logout-popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .logout-popup.active { display: flex; }
        .logout-content { background: #FDFBF7; border: 3px solid #E8B4B4; border-radius: 20px; padding: 40px 50px; text-align: center; }
        .logout-content h3 { color: #3A3A3A; font-size: 24px; margin-bottom: 30px; font-weight: 500; }
        .logout-btn, .cancel-btn { width: 100%; padding: 15px 30px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; margin: 8px 0; }
        .logout-btn { background-color: #D4A5A5; color: white; }
        .cancel-btn { background-color: #9FB19F; color: white; }
    </style>
</head>
<body>
<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="CopyCook Logo" onclick="window.location.href='home.html'">
        </div>
        <nav class="nav-icons">
            <a href="home.html" class="nav-icon active"><img src="home-icon.png" alt="Home"></a>
            <a href="../Explore/explore.html" class="nav-icon"><img src="explore-icon.png" alt="Explore"></a>
            <a href="#" class="nav-icon"><img src="plus-icon.png" alt="Add"></a>
            <a href="../Saved page/saved.html" class="nav-icon"><img src="save-icon.png" alt="Saved"></a>
            <a href="../Messages page/Messages.html" class="nav-icon" aria-label="Messages">
                <img src="message.png" alt="">
                <span class="messages-unread-dot" aria-hidden="true"></span>
            </a>
        </nav>
        <div class="nav-bottom">
            <a href="#" class="nav-icon" onclick="toggleLogoutPopup(event)">
                <img src="settings-icon.png" alt="Settings">
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="search-container">
            <div class="search-bar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="7" stroke="#5A5A5A" stroke-width="2"/>
                    <path d="M16 16L20 20" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" placeholder="Search restaurants or dishes">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="10" y="5" width="4" height="10" rx="2" fill="#D4A5A5"/>
                    <path d="M7 12C7 14.7614 9.23858 17 12 17C14.7614 17 17 14.7614 17 12" stroke="#D4A5A5" stroke-width="2"/>
                    <line x1="12" y1="17" x2="12" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                    <line x1="9" y1="20" x2="15" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                </svg>
            </div>
            <div class="profile-pic" id="profileAvatar"></div>
        </div>

        <div class="recipe-body" id="recipeBody">
            <div class="loading-state">Loading recipe...</div>
        </div>
    </main>
</div>

<!-- Save to Folder Popup -->
<div id="savePopupOverlay" class="save-popup-overlay" onclick="closeSavePopup(event)">
    <div class="save-popup">
        <div class="save-popup-header">
            <span class="save-popup-title">Save to folder</span>
            <button class="save-popup-close" onclick="closeSavePopup()">✕</button>
        </div>

        <div class="save-folders-list" id="saveFoldersList">
            <p style="font-size:13px;color:#9A9A9A;padding:4px 0;">Loading folders…</p>
        </div>

        <div class="new-folder-row">
            <input type="text" class="new-folder-input" id="newFolderNameInput" placeholder="New folder name…" maxlength="40">
            <button class="create-folder-btn" onclick="confirmCreateFolder()">+ Create</button>
        </div>

        <div class="privacy-row">
            <button class="privacy-btn active" id="privBtnPrivate" onclick="selectSavePrivacy('private')">Private</button>
            <button class="privacy-btn" id="privBtnPublic" onclick="selectSavePrivacy('public')">Public</button>
        </div>

        <div class="save-popup-actions">
            <button class="sp-cancel-btn" onclick="closeSavePopup()">Cancel</button>
            <button class="sp-save-btn" id="spSaveBtn" onclick="confirmSaveToFolder()">Save</button>
        </div>
    </div>
</div>

<!-- Comments drawer -->
<div class="comments-overlay" id="commentsOverlay" onclick="closeComments()"></div>
<div class="comments-drawer" id="commentsDrawer">
    <div class="drawer-header">
        <span class="drawer-title"> Comments</span>
        <button class="drawer-close" onclick="closeComments()">✕</button>
    </div>
    <div class="comments-list" id="commentsList">
        <div class="comments-empty">
            <div class="empty-icon"></div>
            <p>No comments yet</p>
            <span>Be the first to comment!</span>
        </div>
    </div>
    <div class="comment-input-area">
        <textarea class="comment-input" id="commentInput" placeholder="Add a comment…" rows="1"

const firebaseConfig = {

// ── State ──────────────────────────────────────────────────────────────────
let currentUser     = null;

// ── Auth ───────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {

// ── Avatar ─────────────────────────────────────────────────────────────────
(function loadAvatar() {

// ── Like helpers ───────────────────────────────────────────────────────────
function likeRef(uid, mealId) { return doc(db, 'users', uid, 'likes', String(mealId)); }

async function likeRecipe(uid, meal) {
    await setDoc(likeRef(uid, meal.idMeal), {
        idMeal: meal.idMeal, strMeal: meal.strMeal, strMealThumb: meal.strMealThumb,
        likedAt: new Date().toISOString()
    });
}
async function unlikeRecipe(uid, mealId) { await deleteDoc(likeRef(uid, mealId)); }
async function isRecipeLiked(uid, mealId) { return (await getDoc(likeRef(uid, mealId))).exists(); }

window.toggleLike = async (btn) => {
    if (!currentUser || !currentMeal) return;
    const isNowLiked = btn.classList.toggle('liked');
    try {
        if (isNowLiked) await likeRecipe(currentUser.uid, currentMeal);
        else            await unlikeRecipe(currentUser.uid, currentMeal.idMeal);
    } catch (err) { btn.classList.toggle('liked'); console.error('Like failed:', err); }
};

async function applyLikeState(mealId) {
    if (!currentUser) return;
    try {
        if (await isRecipeLiked(currentUser.uid, mealId)) {
            const btn = document.getElementById('likeBtn');
            if (btn) btn.classList.add('liked');
        }
    } catch (err) { console.error('applyLikeState error:', err); }
}

// ── Save popup ─────────────────────────────────────────────────────────────
async function loadFolders() {
    if (!currentUser) return [];
    try {
        const snap = await getDocs(collection(db, 'users', currentUser.uid, 'folders'));
        return snap.docs.map(d => ({
            id:         d.id,
            name:       d.data().name,
            privacy:    d.data().privacy || 'private',
            recipes:    d.data().savedRecipes || [],
            coverImage: d.data().coverImage || null,
        }));
    } catch (err) { console.error('loadFolders:', err); return []; }
}

async function openSavePopup() {
    if (!currentMeal) return;
    selectedFolder = null;
    document.getElementById('newFolderNameInput').value = '';
    selectSavePrivacy('private');
    document.getElementById('savePopupOverlay').classList.add('active');
    await renderSaveFolders();
}

window.closeSavePopup = (e) => {
    if (!e || e.target === document.getElementById('savePopupOverlay') || typeof e === 'object' && e.target === e.currentTarget)
        document.getElementById('savePopupOverlay').classList.remove('active');
    if (!e) document.getElementById('savePopupOverlay').classList.remove('active');
};

async function renderSaveFolders() {
    const list    = document.getElementById('saveFoldersList');
    list.innerHTML = '<p style="font-size:13px;color:#9A9A9A;padding:4px 0;">Loading…</p>';
    const folders = await loadFolders();
    list.innerHTML = '';

    if (!folders.length) {
        list.innerHTML = '<p style="font-size:13px;color:#9A9A9A;padding:4px 0;">No folders yet — create one below!</p>';
        return;
    }

    folders.forEach((folder, idx) => {
        const thumb       = folder.coverImage || PLACEHOLDER_IMAGES[idx % PLACEHOLDER_IMAGES.length];
        const recipeCount = folder.recipes.length;
        const countLabel  = `${recipeCount} recipe${recipeCount !== 1 ? 's' : ''}`;
        const isSelected  = selectedFolder && selectedFolder.id === folder.id;

        const item = document.createElement('div');
        item.className = `save-folder-item${isSelected ? ' selected' : ''}`;
        item.innerHTML = `
            <div class="save-folder-thumb">
                <img src="${thumb}" alt="${folder.name}" loading="lazy"
                     onerror="this.src='${PLACEHOLDER_IMAGES[0]}'">
            </div>
            <div class="save-folder-info">
                <div class="save-folder-name">${folder.name}</div>
                <div class="save-folder-count">${countLabel}</div>
            </div>
            <div class="save-folder-radio"></div>`;

        item.addEventListener('click', () => {
            selectedFolder = folder;
            // Re-render to update selection visuals
            renderSaveFolders();
        });
        list.appendChild(item);
    });
}

window.selectSavePrivacy = (p) => {
    savePrivacy = p;
    document.getElementById('privBtnPrivate').className = `privacy-btn${p === 'private' ? ' active' : ''}`;
    document.getElementById('privBtnPublic').className  = `privacy-btn${p === 'public'  ? ' active' : ''}`;
};

window.confirmCreateFolder = async () => {
    const name = document.getElementById('newFolderNameInput').value.trim();
    if (!name || !currentUser) return;
    const safeName  = name.replace(/\//g, '_');
    const folderRef = doc(db, 'users', currentUser.uid, 'folders', safeName);
    try {
        await setDoc(folderRef, {
            name, privacy: savePrivacy, savedRecipes: [],
            coverImage: null, createdAt: new Date().toISOString()
        });
        document.getElementById('newFolderNameInput').value = '';
        await renderSaveFolders();
        console.log('✅ Folder created:', name);
    } catch (err) { console.error('Create folder error:', err); }
};

window.confirmSaveToFolder = async () => {
    if (!selectedFolder || !currentUser || !currentMeal) return;

    const saveBtn  = document.getElementById('spSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const mealId    = String(currentMeal.idMeal);
    const safeName  = selectedFolder.name.replace(/\//g, '_');
    const folderRef = doc(db, 'users', currentUser.uid, 'folders', safeName);
    const mealObj   = {
        idMeal:       currentMeal.idMeal,
        strMeal:      currentMeal.strMeal,
        strMealThumb: currentMeal.strMealThumb,
        savedAt:      new Date().toISOString(),
    };

    try {
        const snap     = await getDoc(folderRef);
        const existing = snap.exists() ? (snap.data().savedRecipes || []) : [];
        const already  = existing.some(r => String(r.idMeal || r.id) === mealId);

        if (!already) {
            await setDoc(folderRef, {
                savedRecipes: [...existing, mealObj],
                coverImage:   snap.exists() && snap.data().coverImage
                                ? snap.data().coverImage
                                : currentMeal.strMealThumb
            }, { merge: true });
            console.log('✅ Saved to', selectedFolder.name);
        }

        document.getElementById('savePopupOverlay').classList.remove('active');
    } catch (err) {
        console.error('Save to folder error:', err);

        saveBtn.disabled = false;

// ── Share to users ──────────────────────────────────────────────────────────
function buildShareRecipePayload() {
    if (!currentMeal) return null;
    return {
        id: String(currentMeal.idMeal || ''),
        name: currentMeal.strMeal || 'Recipe',
        img: currentMeal.strMealThumb || PLACEHOLDER_IMAGES[0]
    };
}

async function getSuggestedUsers() {
    if (!currentUser) return [];
    try {
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        const snap = await getDocs(q);
        const ids = new Set();
        snap.docs.forEach((d) => (d.data().participants || []).forEach((id) => { if (id !== currentUser.uid) ids.add(id); }));
        const suggested = await Promise.all(Array.from(ids).slice(0, 10).map(async (id) => {
            const u = await getDoc(doc(db, 'users', id));
            return u.exists() ? { uid: id, ...u.data() } : null;
        }));
        return dedupeUsersByEmail(suggested.filter(Boolean));
    } catch (_) { return []; }
}

async function ensureShareUsersCache() {
    if (shareUsersCache) return shareUsersCache;
    const snap = await getDocs(collection(db, 'users'));
    const raw = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
    shareUsersCache = dedupeUsersByEmail(raw);
    return shareUsersCache;
}

function renderShareUsers(users) {
    const box = document.getElementById('shareUserResults');
    if (!users.length) {
        box.innerHTML = '<div class="share-empty">No users found.</div>';
        return;
    }
    box.innerHTML = '';
    users.forEach((u) => {
        const item = document.createElement('div');
        item.className = 'share-user';
        const name = u.displayName || 'Unknown';
        const initial = (name || 'U').charAt(0).toUpperCase();
        item.innerHTML = `
            <div class="share-avatar" style="background:${avatarColor(name)}">${initial}</div>
            <div>
                <div class="share-name">${escapeHtml(name)}</div>
                <div class="share-sub">${escapeHtml(u.email || '')}</div>
            </div>`;
        item.addEventListener('click', () => sendRecipeShareToUser(u));
        box.appendChild(item);
    });
}

async function sendRecipeShareToUser(user) {
    if (!currentUser) return;
    const payload = buildShareRecipePayload();
    if (!payload) return;
    const myName = currentUser.displayName || localStorage.getItem('userDisplayName') || 'User';
    const otherName = user.displayName || 'User';
    const convId = [currentUser.uid, user.uid].sort().join('_');
    const convRef = doc(db, 'conversations', convId);
    const convSnap = await getDoc(convRef);
    const oldUnread = convSnap.exists() ? (convSnap.data().unreadCount || {}) : {};
    const nextUnread = (oldUnread[user.uid] || 0) + 1;

    await setDoc(convRef, {
        participants: [currentUser.uid, user.uid],
        participantNames: { [currentUser.uid]: myName, [user.uid]: otherName },
        lastMessage: `📷 Shared: ${payload.name}`,
        lastMessageAt: serverTimestamp(),
        unreadCount: { ...oldUnread, [currentUser.uid]: 0, [user.uid]: nextUnread },
        createdAt: convSnap.exists() ? (convSnap.data().createdAt || serverTimestamp()) : serverTimestamp()
    }, { merge: true });

    await addDoc(collection(db, 'conversations', convId, 'messages'), {
        senderId: currentUser.uid,
        senderName: myName,
        text: null,
        recipe: payload,
        createdAt: serverTimestamp()
    });
    closeShareModal();
}

window.openShareModal = async () => {
    if (!currentUser) return;
    document.getElementById('shareModalOverlay').classList.add('active');
    document.getElementById('shareUserSearch').value = '';
    renderShareUsers(await getSuggestedUsers());
};

window.closeShareModal = (e) => {
    const overlay = document.getElementById('shareModalOverlay');
    if (!e || e.target === overlay) overlay.classList.remove('active');
};

document.getElementById('shareUserSearch').addEventListener('input', async function() {
    const q = this.value.trim().toLowerCase();
    if (!q) {
        renderShareUsers(await getSuggestedUsers());
        return;
    }
    const users = (await ensureShareUsersCache())
        .filter((u) => u.uid !== currentUser?.uid)
        .filter((u) => (u.displayName || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q))
        .slice(0, 12);
    renderShareUsers(users);
});

// ── Comments ───────────────────────────────────────────────────────────────
const AVATAR_COLORS = ['#D4A5A5','#9FB19F','#A5B4D4','#D4C4A5','#B4A5D4','#A5D4C4'];
function avatarColor(str) {
    let h = 0;
    for (const c of (str || 'U')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function timeAgo(ts) {
    if (!ts) return '';
    const secs = Math.floor((Date.now() - ts.toMillis()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
}

window.openComments = () => {
    if (!currentMeal) return;
    document.getElementById('commentsOverlay').classList.add('open');
    document.getElementById('commentsDrawer').classList.add('open');
    if (commentsUnsub) commentsUnsub();
    const q = query(collection(db, 'recipes', String(currentMeal.idMeal), 'comments'), orderBy('createdAt', 'asc'));
    commentsUnsub = onSnapshot(q, snap => {
        renderComments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => console.error('Comments snapshot error:', err));
};

window.closeComments = () => {
    document.getElementById('commentsOverlay').classList.remove('open');
    document.getElementById('commentsDrawer').classList.remove('open');
    if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
};

function renderComments(items) {
    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    if (!items.length) {
        list.innerHTML = `<div class="comments-empty"><div class="empty-icon"></div><p>No comments yet</p><span>Be the first to comment!</span></div>`;
        return;
    }
    items.forEach(item => {
        const name  = item.displayName || 'User';
        const isOwn = currentUser && item.uid === currentUser.uid;
        const el    = document.createElement('div');
        el.className = 'comment-item';
        el.innerHTML = `
            <div class="comment-avatar" style="background:${avatarColor(item.uid || name)}">${name.charAt(0).toUpperCase()}</div>
            <div class="comment-body">
                <div class="comment-name">${name}</div>
                <div class="comment-text">${escapeHtml(item.text)}</div>
                <div class="comment-meta">
                    <span>${timeAgo(item.createdAt)}</span>
                    ${isOwn ? `<button class="comment-delete" data-id="${item.id}">Delete</button>` : ''}
                </div>
            </div>`;
        list.appendChild(el);
    });
    list.scrollTop = list.scrollHeight;
    list.querySelectorAll('.comment-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteComment(btn.dataset.id));
    });
}

window.postComment = async () => {
    if (!currentUser) { alert('Please log in to comment.'); return; }
    if (!currentMeal) return;
    const input   = document.getElementById('commentInput');
    const text    = input.value.trim();
    if (!text) return;
    const sendBtn = document.getElementById('commentSendBtn');
    sendBtn.disabled = true;
    try {
        await addDoc(collection(db, 'recipes', String(currentMeal.idMeal), 'comments'), {
            text, uid: currentUser.uid,
            displayName: currentUser.displayName || localStorage.getItem('userDisplayName') || 'User',
            createdAt: serverTimestamp()
        });
        input.value = '';
    } catch (err) {
        console.error('Post comment failed:', err);
        alert('Failed to post comment.');
    } finally { sendBtn.disabled = false; input.focus(); }
};

async function deleteComment(commentId) {
    if (!currentUser || !currentMeal) return;
    try { await deleteDoc(doc(db, 'recipes', String(currentMeal.idMeal), 'comments', commentId)); }
    catch (err) { console.error('Delete comment failed:', err); }
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatCurrency(value) {
    return `$${value.toFixed(2)}`;
}

function estimateIngredientUnitCost(ingredientName) {
    const name = ingredientName.toLowerCase();
    const costTable = [
        { keys: ['beef', 'steak', 'lamb'], cost: 6.2 },
        { keys: ['chicken', 'turkey'], cost: 3.4 },
        { keys: ['salmon', 'prawn', 'shrimp', 'fish', 'tuna'], cost: 5.4 },
        { keys: ['rice', 'pasta', 'noodle', 'potato', 'bread'], cost: 1.2 },
        { keys: ['tomato', 'onion', 'garlic', 'carrot', 'pepper', 'broccoli'], cost: 0.9 },
        { keys: ['cheese', 'cream', 'butter', 'milk', 'yogurt'], cost: 1.8 },
        { keys: ['oil', 'sauce', 'stock', 'vinegar', 'spice', 'salt', 'sugar'], cost: 0.7 },
        { keys: ['egg'], cost: 0.5 }
    ];
    const match = costTable.find(item => item.keys.some(key => name.includes(key)));
    return match ? match.cost : 1.4;
}

function buildCostComparisonCard(ingredients, dishName) {
    const servings = Math.max(2, Math.min(6, Math.round(ingredients.length / 2) || 2));
    const homeTotalCost = ingredients.reduce((sum, item) => sum + estimateIngredientUnitCost(item.ing), 0);
    const homePerServing = homeTotalCost / servings;
    const restaurantPerServing = (homePerServing * 2.6) + 2.25;
    const savingsPerServing = Math.max(0, restaurantPerServing - homePerServing);
    const savingsPercent = restaurantPerServing > 0
        ? Math.round((savingsPerServing / restaurantPerServing) * 100)
        : 0;

    return `
        <div class="card">
            <div class="card-title"> Home vs Restaurant Cost</div>
            <div class="cost-grid">
                <div class="cost-box home">
                    <div class="cost-label">Estimated homemade (per serving)</div>
                    <div class="cost-value">${formatCurrency(homePerServing)}</div>
                    <div class="cost-subvalue">~${formatCurrency(homeTotalCost)} total for ${servings} servings</div>
                </div>
                <div class="cost-box">
                    <div class="cost-label">Estimated restaurant price</div>
                    <div class="cost-value">${formatCurrency(restaurantPerServing)}</div>
                    <div class="cost-subvalue">Average plated price for a similar dish</div>
                </div>
            </div>
            <div class="cost-savings">
                Making <strong>${escapeHtml(dishName)}</strong> at home saves about
                <strong>${formatCurrency(savingsPerServing)}</strong> per serving
                (roughly <strong>${savingsPercent}%</strong> less than dining out).
            </div>
            <p class="cost-note">
                Estimates adjust by ingredient profile and can shift with local food inflation,
                restaurant markups, and shrinkflation in packaged ingredients.
            </p>
        </div>
    `;
}

                <button class="action-btn" title="Comment" onclick="openComments()">

                    </svg>

                <button class="action-btn" title="Share" onclick="openShareModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke="#A5B4D4" stroke-width="2" fill="none"/>
                        <polyline points="16 6 12 2 8 6" stroke="#A5B4D4" stroke-width="2" fill="none"/>
                        <line x1="12" y1="2" x2="12" y2="15" stroke="#A5B4D4" stroke-width="2"/>
                    </svg>
                </button>
                <button class="save-action-btn" onclick="openSavePopup()">Save</button>
            </div>
            <div class="recipe-image-wrap">
                <img src="${image}" alt="${title}">
            </div>
        </div>

        <div class="right-panel">
            <h1 class="recipe-title">${title}</h1>
            ${tag ? `<div><span class="category-tag">📍 ${tag}</span></div>` : ''}
            <div class="card">
                <div class="card-title">🍳 Ingredients</div>
                <div class="ingredient-list">${ingredientRows}</div>
            </div>
            <div class="card">
                <div class="card-title">👨‍🍳 Instructions</div>
                <div class="instructions-list">${stepRows}</div>
            </div>
            ${costComparisonCard || ''}
        </div>
    `;
}

// ── MealDB renderer ────────────────────────────────────────────────────────
function renderMealDB(meal) {
    const ingredients = [];
    for (let i = 1; i <= 20; i++) {
        const ing = meal[`strIngredient${i}`], measure = meal[`strMeasure${i}`];
        if (ing && ing.trim()) ingredients.push({ ing: ing.trim(), measure: (measure || '').trim() });
    }
    const steps = (meal.strInstructions || '').split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 10);
    const ingredientRows = ingredients.map(({ ing, measure }) => `
        <div class="ingredient-row">
            <span class="ingredient-dot"></span>
            <span class="ingredient-measure">${measure || 'To taste'}</span>
            <span class="ingredient-name">${ing}</span>
        </div>`).join('');
    const stepRows = steps.map(s => `<div class="instruction-step">${s}</div>`).join('');
    const tag = [meal.strArea, meal.strCategory].filter(Boolean).join(' · ');
    const costComparisonCard = buildCostComparisonCard(ingredients, meal.strMeal);

    document.getElementById('recipeBody').innerHTML = buildLayout({
        title: meal.strMeal, image: meal.strMealThumb, tag, ingredientRows, stepRows, costComparisonCard
    });
    if (currentUser) applyLikeState(meal.idMeal);
}

// ── Load recipe ────────────────────────────────────────────────────────────
async function loadRecipe() {
    const params = new URLSearchParams(window.location.search);
    const mealId = params.get('id');
    const body   = document.getElementById('recipeBody');
    if (!mealId) { body.innerHTML = '<div class="loading-state">No recipe selected.</div>'; return; }
    try {
        const res  = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`);
        const data = await res.json();
        if (data.meals && data.meals[0]) {
            currentMeal = data.meals[0];
            renderMealDB(data.meals[0]);
        } else {
            body.innerHTML = '<div class="loading-state">Recipe not found.</div>';
        }
    } catch (err) {
        console.error('loadRecipe error:', err);
        body.innerHTML = '<div class="loading-state">Failed to load recipe.</div>';
    }
}

window.openSavePopup = openSavePopup;
document.addEventListener('DOMContentLoaded', loadRecipe);
</script>
<script type="module" src="../messages-unread-nav.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Recipe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app-shell.css">
    <script src="../ui-feedback.js"></script>
    <script src="../auth-session.js"></script>
    <script src="../cuisine-passport.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5EFE7;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; }

        /* Sidebar: ../app-shell.css */

        /* ── Main ── */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .search-container { display: flex; align-items: center; padding: 20px 30px; gap: 15px; flex-shrink: 0; }
        .search-bar {
            flex: 1; display: flex; align-items: center;
            background-color: #9FB19F; border-radius: 15px; padding: 15px 20px; gap: 12px;
        }
        .search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 16px; color: #3A3A3A; font-family: 'Poppins', sans-serif;
        }
        .search-bar input::placeholder { color: #5A5A5A; }
        .profile-pic {
            width: 50px; height: 50px; border-radius: 50%;
            border: 3px solid #E8B4B4; cursor: pointer; transition: transform 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-pic:hover { transform: scale(1.05); }

        .recipe-body {
            flex: 1;
            overflow: hidden;
            padding: 0 30px 30px;
            display: flex;
            gap: 25px;
            align-items: stretch;
            min-height: 0;
        }

        /* Match community-recipe.html: ~⅓ column width + tall portrait image column */
        .left-panel {
            width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
            min-height: 0;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer;
            font-family: 'Poppins', sans-serif; font-size: 15px;
            color: #5A5A5A; padding: 0; transition: color 0.2s;
        }
        .back-btn:hover { color: #D4A5A5; }
        .action-row { display: flex; align-items: center; gap: 14px; }
        .action-btn {
            background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { background: rgba(212,165,165,0.15); transform: scale(1.1); }
        .like-btn .heart-path { transition: fill 0.2s, stroke 0.2s; }
        .like-btn.liked .heart-path { fill: #D4A5A5; stroke: #D4A5A5; }

        .save-action-btn {
            margin-left: auto; background-color: #9FB19F; color: white;
            border: none; padding: 10px 28px; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; transition: background 0.2s, transform 0.2s;
        }
        .save-action-btn:hover { background-color: #8AA08A; transform: scale(1.03); }

        .passport-recipe-strip { width: 100%; margin-top: 10px; }
        .passport-stamp-recipe-btn {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 2px solid #C8DBC8;
            background: linear-gradient(180deg, #F8FBF8, #EFF5EF);
            color: #3A5340;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        .passport-stamp-recipe-btn:hover:not(:disabled) {
            border-color: #9FB19F;
            box-shadow: 0 4px 12px rgba(159, 177, 159, 0.25);
        }
        .passport-stamp-recipe-btn:disabled {
            opacity: 0.95;
            cursor: default;
            border-style: solid;
            border-color: #B8CFB8;
            background: linear-gradient(180deg, #F0F7F0, #E4EFE4);
            color: #4A684A;
        }

        .recipe-image-wrap {
            border-radius: 20px;
            overflow: hidden;
            flex: 1;
            min-height: 420px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .recipe-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; overflow-y: auto; padding-right: 4px; }
        .right-panel::-webkit-scrollbar { width: 8px; }
        .right-panel::-webkit-scrollbar-track { background: #F5EFE7; }
        .right-panel::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 8px; }
        .recipe-title { font-size: 32px; font-weight: 700; color: #2A2A2A; line-height: 1.2; }
        .recipe-tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .recipe-by-tag {
            display: inline-flex; align-items: center;
            background-color: #9FB19F; color: white;
            padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        .category-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background-color: #E8B4B4; color: #5A3A3A;
            padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
        }
        .recipe-feedback-card .recipe-feedback-loading { font-size: 13px; color: #8A7A7A; }
        .recipe-feedback-inner { display: flex; flex-direction: column; gap: 14px; }
        .recipe-feedback-stats {
            display: flex; flex-wrap: wrap; gap: 8px 14px;
            font-size: 13px; color: #5A5A5A; line-height: 1.45;
        }
        .recipe-feedback-stats strong { color: #2A2A2A; font-weight: 600; }
        .recipe-stars-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .recipe-star-btn {
            background: none; border: none; cursor: pointer;
            font-size: 22px; line-height: 1; padding: 2px 3px;
            color: #D4C4C4; transition: color 0.15s, transform 0.12s;
        }
        .recipe-star-btn:hover { transform: scale(1.12); }
        .recipe-star-btn.on { color: #E8A030; }
        .recipe-star-btn.needs-auth:not(:disabled):hover {
            opacity: 0.85;
        }
        .recipe-star-btn:disabled { cursor: wait; opacity: 0.75; }
        .recipe-star-hint { font-size: 12px; color: #8A7A7A; margin-left: 6px; }
        .made-it-btn {
            align-self: flex-start;
            margin-top: 4px;
            padding: 10px 20px;
            border-radius: 14px;
            border: 2px solid #9FB19F;
            background: linear-gradient(180deg, #F8FBF8, #EFF5EF);
            color: #3A5340;
            font-size: 14px; font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s;
        }
        .made-it-btn:hover:not(:disabled) {
            border-color: #7A9B7A;
            box-shadow: 0 4px 14px rgba(159, 177, 159, 0.3);
        }
        .made-it-btn.has-made {
            background: linear-gradient(180deg, #E8F2E8, #DCEADC);
            border-color: #7A9B7A;
            color: #2E4A2E;
        }
        .made-it-btn:disabled { opacity: 0.65; cursor: wait; }
        .made-it-btn.needs-auth { cursor: pointer; opacity: 0.95; }
        @keyframes made-it-btn-pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.07); }
            70% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        .made-it-btn.made-it-celebrate-pulse {
            animation: made-it-btn-pop 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        }
        .made-it-achievement-host {
            position: fixed;
            z-index: 3000;
            pointer-events: none;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .made-it-achievement-badge {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: nowrap;
            width: max-content;
            max-width: min(292px, 94vw);
            white-space: nowrap;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 999px;
            background: linear-gradient(180deg, #FFF8FA, #F5D8E2);
            border: 1px solid #E8B4B4;
            box-shadow: 0 10px 28px rgba(90, 42, 58, 0.16);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            color: #5A3A3A;
            font-family: 'Poppins', sans-serif;
            opacity: 0;
            animation: made-it-badge-enter 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        /* Keeps sparkle emoji visually aligned with the label (avoid wrap / baseline drop). */
        .made-it-achievement-badge .achievement-sparkle {
            flex-shrink: 0;
            line-height: 1;
            font-size: 15px;
        }
        @keyframes made-it-badge-enter {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px) scale(0.7);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
        .made-it-achievement-host.fade-out .made-it-achievement-badge {
            transition: opacity 0.38s ease, transform 0.38s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(-8px);
        }
        .made-it-spark {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #E8A030;
            box-shadow: 0 0 0 2px rgba(232, 160, 48, 0.3);
            animation: made-it-sparkfly 0.62s ease-out forwards;
        }
        .made-it-spark:nth-child(4n + 2) {
            background: #7A9B7A;
            box-shadow: 0 0 0 2px rgba(122, 155, 122, 0.35);
        }
        .made-it-spark:nth-child(4n + 3) {
            background: #E8B4B4;
            box-shadow: 0 0 0 2px rgba(232, 180, 180, 0.35);
        }
        @keyframes made-it-sparkfly {
            to {
                transform: translate(var(--tx), var(--ty)) scale(0.15);
                opacity: 0;
            }
        }

        .card { background: white; border-radius: 20px; padding: 22px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card-title { font-size: 18px; font-weight: 700; color: #2A2A2A; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .ingredient-list { display: flex; flex-direction: column; gap: 10px; }
        .ingredient-row { display: flex; align-items: center; gap: 14px; font-size: 14px; }
        .ingredient-dot { width: 14px; height: 14px; border-radius: 50%; background-color: #E8B4B4; flex-shrink: 0; }
        .ingredient-measure { font-weight: 600; color: #3A3A3A; min-width: 80px; }
        .ingredient-name { color: #5A5A5A; }
        .instructions-list { display: flex; flex-direction: column; gap: 10px; }
        .instruction-step { background-color: #F8E8E8; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; color: #3A3A3A; line-height: 1.6; }
        .loading-state { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 16px; color: #9FB19F; }
        .cost-note { font-size: 12px; color: #8A7A7A; margin-top: 12px; line-height: 1.5; }
        .cost-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .cost-box {
            border-radius: 12px; padding: 12px 14px;
            background: #FDF5F5; border: 1px solid #F3DADA;
        }
        .cost-box.home { background: #F4FAF4; border-color: #D8E9D8; }
        .cost-label { font-size: 12px; color: #7C6A6A; margin-bottom: 4px; }
        .cost-value { font-size: 19px; font-weight: 700; color: #2A2A2A; }
        .cost-subvalue { font-size: 12px; color: #8E7E7E; margin-top: 3px; }
        .cost-savings {
            margin-top: 14px; border-radius: 12px; padding: 12px 14px;
            background: #FFF7EA; border: 1px solid #F2DEC2;
            font-size: 13px; color: #5A4A3A; line-height: 1.55;
        }

        /* ── Save popup ── */
        .save-popup-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 1100;
            align-items: center; justify-content: center;
        }
        .save-popup-overlay.active { display: flex; }

        .save-popup {
            background: #fff; border: 2px solid #E8B4B4;
            border-radius: 24px; padding: 28px 28px 24px;
            width: 420px; max-width: 95vw;
            max-height: 90vh;
            box-shadow: 0 16px 48px rgba(0,0,0,0.18);
            display: flex; flex-direction: column; gap: 18px;
            overflow: hidden;
            overflow-y: auto;
            animation: popIn 0.22s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .save-popup-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .save-popup-title { font-size: 20px; font-weight: 700; color: #2A2A2A; }
        .save-popup-close {
            background: none; border: none; cursor: pointer;
            font-size: 20px; color: #9A9A9A; line-height: 1;
            padding: 2px 6px; border-radius: 6px; transition: color 0.2s;
        }
        .save-popup-close:hover { color: #D4A5A5; }

        /* Folder list */
        .save-folders-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 260px; overflow-y: auto;
        }
        .save-folders-list::-webkit-scrollbar { width: 5px; }
        .save-folders-list::-webkit-scrollbar-thumb { background: #E8B4B4; border-radius: 5px; }

        .save-folder-item {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 12px; border-radius: 14px;
            border: 1.5px solid #F0E4E4;
            cursor: pointer; transition: background 0.18s, border-color 0.18s;
            background: #fff;
        }
        .save-folder-item:hover { background: #FDF5F5; border-color: #E8B4B4; }
        .save-folder-item.selected { background: #FDF5F5; border-color: #D4A5A5; }

        .save-folder-thumb {
            width: 46px; height: 46px; border-radius: 10px;
            overflow: hidden; flex-shrink: 0; background: #F0E4E4;
        }
        .save-folder-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .save-folder-info { flex: 1; }
        .save-folder-name { font-size: 14px; font-weight: 700; color: #2A2A2A; }
        .save-folder-count { font-size: 12px; color: #A08080; margin-top: 1px; }

        /* Radio circle */
        .save-folder-radio {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid #D4A5A5; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.18s;
        }
        .save-folder-item.selected .save-folder-radio {
            background: #D4A5A5;
        }
        .save-folder-item.selected .save-folder-radio::after {
            content: '';
            width: 8px; height: 8px; border-radius: 50%;
            background: white;
        }

        /* New folder row */
        .new-folder-row {
            display: flex; gap: 10px; align-items: center;
            flex-wrap: nowrap;
            width: 100%;
        }
        .new-folder-input {
            flex: 1; min-width: 0; border: 1.5px solid #E8B4B4; border-radius: 12px;
            padding: 11px 14px; font-size: 14px;
            font-family: 'Poppins', sans-serif; color: #2A2A2A;
            outline: none; background: white; transition: border-color 0.2s;
        }
        .new-folder-input:focus { border-color: #D4A5A5; }
        .new-folder-input::placeholder { color: #C4A8A8; }
        .create-folder-btn {
            background: #9FB19F; color: white;
            border: none; border-radius: 12px;
            padding: 11px 18px; font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer;
            white-space: nowrap; transition: background 0.2s;
        }
        .create-folder-btn:hover { background: #8AA08A; }

        /* Privacy toggle */
        .privacy-row { display: flex; gap: 10px; }
        .privacy-btn {
            flex: 1; padding: 10px; border-radius: 12px;
            border: 1.5px solid #E8B4B4; background: white;
            font-size: 13px; font-weight: 600;
            font-family: 'Poppins', sans-serif; color: #9A9A9A;
            cursor: pointer; transition: all 0.18s;
        }
        .privacy-btn.active { background: #9FB19F; border-color: #9FB19F; color: white; }

        /* Bottom actions */
        .save-popup-actions { display: flex; gap: 10px; }
        .sp-cancel-btn, .sp-save-btn {
            flex: 1; padding: 13px; border-radius: 14px; border: none;
            font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: all 0.18s;
        }
        .sp-cancel-btn { background: #F0EAE0; color: #5A5A5A; }
        .sp-cancel-btn:hover { background: #E8E0D4; }
        .sp-save-btn { background: #D4A5A5; color: white; }
        .sp-save-btn:hover { background: #c49090; }
        .sp-save-btn:disabled { background: #E0C8C8; cursor: not-allowed; }

        /* Share modal */
        .share-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 1200;
            align-items: center; justify-content: center;
        }
        .share-modal-overlay.active { display: flex; }
        .share-modal {
            width: 420px; max-width: 92vw;
            background: #FDFBF7; border: 2px solid #E8B4B4; border-radius: 22px;
            padding: 22px;
        }
        .share-title { font-size: 19px; font-weight: 700; color: #2A2A2A; margin-bottom: 12px; }
        .share-search {
            display: flex; align-items: center; gap: 8px;
            background: #F0EBE3; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
        }
        .share-search input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 14px; font-family: 'Poppins', sans-serif; color: #3A3A3A;
        }
        .share-results { max-height: 260px; overflow-y: auto; }
        .share-user {
            display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer;
            transition: background 0.2s;
        }
        .share-user:hover { background: #F0EBE3; }
        .share-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 14px; flex-shrink: 0;
        }
        .share-name { font-size: 14px; font-weight: 600; color: #2A2A2A; }
        .share-sub { font-size: 12px; color: #9A9A9A; }
        .share-empty { text-align: center; font-size: 13px; color: #9A9A9A; padding: 18px 10px; }
        .share-actions { margin-top: 12px; }
        .share-close-btn {
            width: 100%; border: none; border-radius: 12px; padding: 11px;
            background: #F0EBE3; color: #5A5A5A; font-size: 14px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer;
        }

        /* ── Comments drawer ── */
        .comments-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 500; }
        .comments-overlay.open { display: block; }
        .comments-drawer {
            position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
            background: #FDFBF7; border-left: 2px solid #E8B4B4;
            display: flex; flex-direction: column;
            transition: right 0.32s cubic-bezier(0.4,0,0.2,1);
            z-index: 501; box-shadow: -6px 0 28px rgba(0,0,0,0.1);
        }
        .comments-drawer.open { right: 0; }
        .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 18px; border-bottom: 1.5px solid #F0E4E4; flex-shrink: 0; }
        .drawer-title { font-size: 17px; font-weight: 700; color: #2A2A2A; }
        .drawer-close { background: none; border: none; cursor: pointer; color: #9A9A9A; font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 6px; transition: color 0.2s; }
        .drawer-close:hover { color: #D4A5A5; }
        .comments-list { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
        .comments-list::-webkit-scrollbar { width: 6px; }
        .comments-list::-webkit-scrollbar-thumb { background: #E8B4B4; border-radius: 6px; }
        .comment-item { display: flex; gap: 12px; align-items: flex-start; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-name { font-size: 12px; font-weight: 700; color: #3A3A3A; margin-bottom: 3px; }
        .comment-text { font-size: 13px; color: #5A5A5A; line-height: 1.5; word-break: break-word; }
        .comment-meta { font-size: 11px; color: #B0A0A0; margin-top: 4px; display: flex; align-items: center; gap: 10px; }
        .comment-delete { background: none; border: none; cursor: pointer; color: #D4A5A5; font-size: 11px; font-family: 'Poppins', sans-serif; padding: 0; transition: color 0.2s; }
        .comment-delete:hover { color: #b07070; }
        .comments-empty { text-align: center; padding: 48px 20px; color: #C4A0A0; }
        .comments-empty .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
        .comments-empty p { font-size: 14px; font-weight: 600; color: #9a7878; }
        .comment-input-area { padding: 16px 24px; border-top: 1.5px solid #F0E4E4; flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end; }

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getFirestore, doc, getDoc, setDoc, deleteDoc,
    collection, addDoc, getDocs, onSnapshot, query, orderBy, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
    dedupeUsersByEmail,
    submitRating,
    getRecipeEngagement,
    getUserRating,
    toggleMadeRecipe,
    userHasMadeRecipe,
} from '../firebase-functions.js';

const firebaseConfig = {
    apiKey: "AIzaSyACkR3_vUNa7dzD-Y3pWmLeM4Iu-UlxuDw",
    authDomain: "copycook-f596a.firebaseapp.com",
    projectId: "copycook-f596a",
    storageBucket: "copycook-f596a.firebasestorage.app",
    messagingSenderId: "366122548728",
    appId: "1:366122548728:web:b4300be3464e7e07822a0d"
};

const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const PLACEHOLDER_IMAGES = [
    'https://www.themealdb.com/images/media/meals/sytuqu1511553755.jpg',
    'https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg',
    'https://www.themealdb.com/images/media/meals/58oia61564916529.jpg',
    'https://www.themealdb.com/images/media/meals/wyrqqq1468233628.jpg',
];

// ── State ──────────────────────────────────────────────────────────────────
let currentUser     = null;
let currentMeal     = null;
/** Instruction lines parsed for Cook Along Mode (same order as Instructions card). */
let cookAlongSteps  = [];
let cookAlongIndex  = 0;
let commentsUnsub   = null;
let savePrivacy     = 'private';
let selectedFolder  = null; // the folder object the user clicked
let shareUsersCache = null;

// ── Auth ───────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
        localStorage.setItem('userUID', user.uid);
        if (currentMeal) applyLikeState(currentMeal.idMeal);
        if (currentMeal) hydrateRecipeFeedback(currentMeal);
    } else if (currentMeal) {
        hydrateRecipeFeedback(currentMeal);
    }
});

// ── Avatar ─────────────────────────────────────────────────────────────────
(function loadAvatar() {
    const el = document.getElementById('profileAvatar');
    if (!el) return;
    const initial = localStorage.getItem('userInitial');
    const color   = localStorage.getItem('userAvatarColor');
    const name    = localStorage.getItem('userDisplayName');
    if (initial && color) {
        el.innerHTML = initial;
        el.style.cssText = `background-color:${color};display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700;width:50px;height:50px;border-radius:50%;border:3px solid #E8B4B4;`;
        el.title = name || '';
    }
})();

// ── Logout ─────────────────────────────────────────────────────────────────
window.toggleLogoutPopup = (e) => { if (e && typeof e.preventDefault === 'function') e.preventDefault(); document.getElementById('logoutPopup').classList.toggle('active'); };
window.closeLogoutPopup  = ()  => { document.getElementById('logoutPopup').classList.remove('active'); };
window.handleLogout      = ()  => {
    if (typeof logoutClearSessionKeepPassport === 'function') logoutClearSessionKeepPassport('../login.html');
    else { localStorage.clear(); sessionStorage.clear(); window.location.href = '../login.html'; }
};
document.getElementById('logoutPopup').addEventListener('click', e => { if (e.target === e.currentTarget) window.closeLogoutPopup(); });

// ── Like helpers ───────────────────────────────────────────────────────────
function likeRef(uid, mealId) { return doc(db, 'users', uid, 'likes', String(mealId)); }

async function likeRecipe(uid, meal) {
    await setDoc(likeRef(uid, meal.idMeal), {
        idMeal: meal.idMeal, strMeal: meal.strMeal, strMealThumb: meal.strMealThumb,
        likedAt: new Date().toISOString()
    });
}
async function unlikeRecipe(uid, mealId) { await deleteDoc(likeRef(uid, mealId)); }
async function isRecipeLiked(uid, mealId) { return (await getDoc(likeRef(uid, mealId))).exists(); }

window.toggleLike = async (btn) => {
    if (!currentUser || !currentMeal) return;
    const isNowLiked = btn.classList.toggle('liked');
    try {
        if (isNowLiked) await likeRecipe(currentUser.uid, currentMeal);
        else            await unlikeRecipe(currentUser.uid, currentMeal.idMeal);
    } catch (err) { btn.classList.toggle('liked'); console.error('Like failed:', err); }
};

async function applyLikeState(mealId) {
    if (!currentUser) return;
    try {
        if (await isRecipeLiked(currentUser.uid, mealId)) {
            const btn = document.getElementById('likeBtn');
            if (btn) btn.classList.add('liked');
        }
    } catch (err) { console.error('applyLikeState error:', err); }
}

// ── Save popup ─────────────────────────────────────────────────────────────
async function loadFolders() {
    if (!currentUser) return [];
    try {
        const snap = await getDocs(collection(db, 'users', currentUser.uid, 'folders'));
        return snap.docs.map(d => ({
            id:         d.id,
            name:       d.data().name,
            privacy:    d.data().privacy || 'private',
            recipes:    d.data().savedRecipes || [],
            coverImage: d.data().coverImage || null,
        }));
    } catch (err) { console.error('loadFolders:', err); return []; }
}

window.confirmSaveToFolder = async () => {
    if (!selectedFolder || !currentUser || !currentMeal) return;

    const saveBtn  = document.getElementById('spSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const mealId    = String(currentMeal.idMeal);
    const folderRef = doc(db, 'users', currentUser.uid, 'folders', selectedFolder.id);
    const mealObj   = {
        idMeal:       currentMeal.idMeal,
        strMeal:      currentMeal.strMeal,
        strMealThumb: currentMeal.strMealThumb,
        savedAt:      new Date().toISOString(),
    };

    try {
        const snap     = await getDoc(folderRef);
        const existing = snap.exists() ? (snap.data().savedRecipes || []) : [];
        const already  = existing.some(r => String(r.idMeal || r.id) === mealId);

        if (!already) {
            await setDoc(folderRef, {
                savedRecipes: [...existing, mealObj],
                coverImage:   snap.exists() && snap.data().coverImage

            const au = ((currentMeal.strArea || '').trim());
            if (au && !/^unknown$/i.test(au) && typeof window.recordCuisinePassportStamp === 'function') {
                if (window.recordCuisinePassportStamp(au, {
                    idMeal: mealObj.idMeal,

        try {
            if (!already && window.UIFeedback) {
                window.UIFeedback.success();
                window.UIFeedback.hapticSuccess();

    } catch (err) {
        console.error('Save to folder error:', err);
        try { if (window.UIFeedback) window.UIFeedback.error(); } catch (_) {}

function buildShareRecipePayload() {
    if (!currentMeal) return null;
    return {
        id: String(currentMeal.idMeal || ''),

        img: currentMeal.strMealThumb || PLACEHOLDER_IMAGES[0]

}

async function getSuggestedUsers() {
    if (!currentUser) return [];
    try {
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        const snap = await getDocs(q);
        const ids = new Set();
        snap.docs.forEach((d) => (d.data().participants || []).forEach((id) => { if (id !== currentUser.uid) ids.add(id); }));
        const suggested = await Promise.all(Array.from(ids).slice(0, 10).map(async (id) => {
            const u = await getDoc(doc(db, 'users', id));
            return u.exists() ? { uid: id, ...u.data() } : null;
        }));
        return dedupeUsersByEmail(suggested.filter(Boolean));
    } catch (_) { return []; }
}

async function ensureShareUsersCache() {
    if (shareUsersCache) return shareUsersCache;
    const snap = await getDocs(collection(db, 'users'));
    const raw = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
    shareUsersCache = dedupeUsersByEmail(raw);
    return shareUsersCache;
}

function renderShareUsers(users) {
    const box = document.getElementById('shareUserResults');
    if (!users.length) {
        box.innerHTML = '<div class="share-empty">No users found.</div>';

    }
    box.innerHTML = '';
    users.forEach((u) => {
        const item = document.createElement('div');
        item.className = 'share-user';
        const name = u.displayName || 'Unknown';
        const initial = (name || 'U').charAt(0).toUpperCase();
        item.innerHTML = `
            <div class="share-avatar" style="background:${avatarColor(name)}">${initial}</div>
            <div>
                <div class="share-name">${escapeHtml(name)}</div>
                <div class="share-sub">${escapeHtml(u.email || '')}</div>
            </div>`;
        item.addEventListener('click', () => sendRecipeShareToUser(u));
        box.appendChild(item);
    });
}

async function sendRecipeShareToUser(user) {
    if (!currentUser) return;
    const payload = buildShareRecipePayload();
    if (!payload) return;
    const myName = currentUser.displayName || localStorage.getItem('userDisplayName') || 'User';
    const otherName = user.displayName || 'User';
    const convId = [currentUser.uid, user.uid].sort().join('_');
    const convRef = doc(db, 'conversations', convId);
    const convSnap = await getDoc(convRef);
    const oldUnread = convSnap.exists() ? (convSnap.data().unreadCount || {}) : {};
    const nextUnread = (oldUnread[user.uid] || 0) + 1;

    await setDoc(convRef, {
        participants: [currentUser.uid, user.uid],
        participantNames: { [currentUser.uid]: myName, [user.uid]: otherName },
        lastMessage: `📷 Shared: ${payload.name}`,
        lastMessageAt: serverTimestamp(),
        unreadCount: { ...oldUnread, [currentUser.uid]: 0, [user.uid]: nextUnread },
        createdAt: convSnap.exists() ? (convSnap.data().createdAt || serverTimestamp()) : serverTimestamp()
    }, { merge: true });

    await addDoc(collection(db, 'conversations', convId, 'messages'), {
        senderId: currentUser.uid,
        senderName: myName,
        text: null,
        recipe: payload,
        createdAt: serverTimestamp()
    });
    closeShareModal();
}

const AVATAR_COLORS = ['#D4A5A5','#9FB19F','#A5B4D4','#D4C4A5','#B4A5D4','#A5D4C4'];
function avatarColor(str) {
    let h = 0;
    for (const c of (str || 'U')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function timeAgo(ts) {
    if (!ts) return '';
    const secs = Math.floor((Date.now() - ts.toMillis()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
}

function playMadeItAchievementSound() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const ding = () => {
            const now = ctx.currentTime;
            const freqs = [523.25, 659.25, 783.99];
            freqs.forEach((f, i) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.value = f;
                g.gain.setValueAtTime(0.0001, now);
                g.gain.exponentialRampToValueAtTime(0.09, now + 0.02 + i * 0.05);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.26 + i * 0.06);
                o.connect(g);
                g.connect(ctx.destination);
                o.start(now + i * 0.07);
                o.stop(now + 0.4 + i * 0.08);
            });
        };
        if (ctx.state === 'suspended' && typeof ctx.resume === 'function') {
            ctx.resume().then(ding).catch(() => {});
        } else {
            ding();
        }
    } catch (_) { /* no audio */ }
}

function celebrateMadeItAchievement(madeBtn) {
    if (!madeBtn || !madeBtn.getBoundingClientRect) return;
    try {
        if (window.UIFeedback) window.UIFeedback.hapticSuccess();

    playMadeItAchievementSound();
    madeBtn.classList.remove('made-it-celebrate-pulse');
    void madeBtn.offsetWidth;
    madeBtn.classList.add('made-it-celebrate-pulse');
    window.setTimeout(() => madeBtn.classList.remove('made-it-celebrate-pulse'), 600);

    const prev = document.getElementById('madeItAchievementHost');
    if (prev) prev.remove();

    const host = document.createElement('div');
    host.id = 'madeItAchievementHost';
    host.setAttribute('aria-hidden', 'true');
    host.className = 'made-it-achievement-host';
    const r = madeBtn.getBoundingClientRect();
    host.style.left = `${r.left + r.width / 2}px`;
    host.style.top = `${r.top + r.height / 2}px`;

    const sparkCount = 12;
    const sparksHtml = Array.from({ length: sparkCount }, (_, i) => {
        const angle = (Math.PI * 2 * i) / sparkCount + Math.random() * 0.35;
        const dist = 32 + Math.random() * 40;
        const tx = Math.round(Math.cos(angle) * dist);
        const ty = Math.round(Math.sin(angle) * dist);
        const delay = (Math.random() * 0.06).toFixed(3);
        return `<span class="made-it-spark" style="--tx:${tx}px;--ty:${ty}px;animation-delay:${delay}s"></span>`;
    }).join('');

    host.innerHTML =
        `<div class="made-it-achievement-badge"><span>You made it!</span><span class="achievement-sparkle" aria-hidden="true">✨</span></div>${sparksHtml}`;
    document.body.appendChild(host);
    window.setTimeout(() => { host.classList.add('fade-out'); }, 1000);
    window.setTimeout(() => { host.remove(); }, 1550);
}

function formatCurrency(value) {
    return `$${value.toFixed(2)}`;
}

function estimateIngredientUnitCost(ingredientName) {
    const name = ingredientName.toLowerCase();
    const costTable = [
        { keys: ['beef', 'steak', 'lamb'], cost: 6.2 },
        { keys: ['chicken', 'turkey'], cost: 3.4 },
        { keys: ['salmon', 'prawn', 'shrimp', 'fish', 'tuna'], cost: 5.4 },
        { keys: ['rice', 'pasta', 'noodle', 'potato', 'bread'], cost: 1.2 },
        { keys: ['tomato', 'onion', 'garlic', 'carrot', 'pepper', 'broccoli'], cost: 0.9 },
        { keys: ['cheese', 'cream', 'butter', 'milk', 'yogurt'], cost: 1.8 },
        { keys: ['oil', 'sauce', 'stock', 'vinegar', 'spice', 'salt', 'sugar'], cost: 0.7 },
        { keys: ['egg'], cost: 0.5 }
    ];
    const match = costTable.find(item => item.keys.some(key => name.includes(key)));
    return match ? match.cost : 1.4;
}

function buildCostComparisonCard(ingredients, dishName) {
    const servings = Math.max(2, Math.min(6, Math.round(ingredients.length / 2) || 2));
    const homeTotalCost = ingredients.reduce((sum, item) => sum + estimateIngredientUnitCost(item.ing), 0);
    const homePerServing = homeTotalCost / servings;
    const restaurantPerServing = (homePerServing * 2.6) + 2.25;
    const savingsPerServing = Math.max(0, restaurantPerServing - homePerServing);
    const savingsPercent = restaurantPerServing > 0
        ? Math.round((savingsPerServing / restaurantPerServing) * 100)
        : 0;

    return `
        <div class="card">
            <div class="card-title"> Home vs Restaurant Cost</div>
            <div class="cost-grid">
                <div class="cost-box home">
                    <div class="cost-label">Estimated homemade (per serving)</div>
                    <div class="cost-value">${formatCurrency(homePerServing)}</div>
                    <div class="cost-subvalue">~${formatCurrency(homeTotalCost)} total for ${servings} servings</div>
                </div>
                <div class="cost-box">
                    <div class="cost-label">Estimated restaurant price</div>
                    <div class="cost-value">${formatCurrency(restaurantPerServing)}</div>
                    <div class="cost-subvalue">Average plated price for a similar dish</div>
                </div>
            </div>
            <div class="cost-savings">
                Making <strong>${escapeHtml(dishName)}</strong> at home saves about
                <strong>${formatCurrency(savingsPerServing)}</strong> per serving
                (roughly <strong>${savingsPercent}%</strong> less than dining out).
            </div>
            <p class="cost-note">
                Estimates adjust by ingredient profile and can shift with local food inflation,
                restaurant markups, and shrinkflation in packaged ingredients.
            </p>
        </div>
    `;
}

}

async function hydrateRecipeFeedback(meal) {
    const wrap = document.getElementById('recipeFeedbackCard');
    if (!wrap) return;
    const mealId = String(meal?.idMeal ?? meal?.id ?? '').trim();
    if (!mealId) {
        mountPassportStripIfMadeIt(meal, false);
        wrap.innerHTML = '';
        wrap.style.display = 'none';
        return;
    }
    wrap.style.display = '';

    wrap.innerHTML = '<div class="recipe-feedback-loading">Loading community stats…</div>';

    try {
        const uid = auth.currentUser?.uid || null;
        const [eng, myStars, made] = await Promise.all([
            getRecipeEngagement(mealId),
            uid ? getUserRating(mealId, uid) : Promise.resolve(null),
            uid ? userHasMadeRecipe(mealId, uid) : Promise.resolve(false),
        ]);

        const avgStr = eng.ratingCount > 0 ? eng.averageRating.toFixed(1) : '—';
        const signInHint = uid
            ? ''
            : '<span class="recipe-star-hint">Sign in to rate or mark Made It!</span>';

        wrap.innerHTML = `
            <div class="recipe-feedback-inner">
                <div class="card-heading-row recipe-feedback-heading">
                    <span class="card-title">Ratings &amp; cooks</span>
                    ${signInHint}
                </div>
                <div class="recipe-feedback-stats">
                    <span>Avg <strong>${escapeHtml(String(avgStr))}</strong> · <strong>${eng.ratingCount}</strong> rating${eng.ratingCount !== 1 ? 's' : ''} · <strong>${eng.madeCount}</strong> made</span>
                </div>
                <div class="recipe-stars-row" role="group" aria-label="Your rating" id="recipeStarsRow"></div>
                <button type="button" class="made-it-btn${made ? ' has-made' : ''}${uid ? '' : ' needs-auth'}" id="madeItBtn">${made ? 'Marked as cooked' : 'Made It!'}</button>
            </div>`;

        const row = wrap.querySelector('#recipeStarsRow');
        if (row) {
            for (let v = 1; v <= 5; v++) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className =
                    'recipe-star-btn'
                    + ((myStars != null && myStars >= v) ? ' on' : '')
                    + (!uid ? ' needs-auth' : '');
                b.dataset.star = String(v);
                b.setAttribute('aria-label', `${v} star${v !== 1 ? 's' : ''}`);
                b.textContent = '★';
                row.appendChild(b);
            }
        }

        row?.querySelectorAll('.recipe-star-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const u = auth.currentUser;
                if (!mealId) return;
                if (!u) {
                    window.alert('Please sign in to rate recipes.');
                    return;
                }
                const v = parseInt(btn.getAttribute('data-star'), 10);
                if (!Number.isFinite(v)) return;
                btn.disabled = true;
                wrap.querySelectorAll('.recipe-star-btn').forEach((x) => { x.disabled = true; });
                try {
                    await submitRating(mealId, u.uid, v);
                    const next = await getUserRating(mealId, u.uid);
                    const refreshed = await getRecipeEngagement(mealId);
                    const avg2 = refreshed.ratingCount > 0 ? refreshed.averageRating.toFixed(1) : '—';
                    const stats = wrap.querySelector('.recipe-feedback-stats span');
                    if (stats) {
                        stats.innerHTML =
                            `Avg <strong>${escapeHtml(String(avg2))}</strong> · <strong>${refreshed.ratingCount}</strong> rating${refreshed.ratingCount !== 1 ? 's' : ''} · <strong>${refreshed.madeCount}</strong> made`;
                    }
                    row?.querySelectorAll('.recipe-star-btn').forEach((el) => {
                        const sx = parseInt(el.dataset.star, 10);
                        el.classList.toggle('on', next != null && next >= sx);
                        el.disabled = false;
                    });
                } catch (e) {
                    console.error(e);
                    window.alert('Could not save your rating. Please try again.');
                    row?.querySelectorAll('.recipe-star-btn').forEach((el) => { el.disabled = false; });
                }
            });
        });

        const madeBtn = wrap.querySelector('#madeItBtn');
        if (madeBtn) {
            if (!uid) {
                madeBtn.title = 'Sign in to log recipes you have cooked.';
            }
            madeBtn.addEventListener('click', async () => {
                const u = auth.currentUser;
                if (!mealId) return;
                if (!u) {
                    window.alert('Please sign in to mark a recipe as cooked.');
                    return;
                }
                madeBtn.disabled = true;
                try {
                    const nowMade = await toggleMadeRecipe(mealId, u.uid);
                    madeBtn.classList.toggle('has-made', nowMade);
                    madeBtn.textContent = nowMade ? 'Marked as cooked' : 'Made It!';
                    if (nowMade) celebrateMadeItAchievement(madeBtn);
                    mountPassportStripIfMadeIt(meal, nowMade);
                    const refreshed = await getRecipeEngagement(mealId);
                    const stats = wrap.querySelector('.recipe-feedback-stats span');
                    if (stats) {
                        const avg2 = refreshed.ratingCount > 0 ? refreshed.averageRating.toFixed(1) : '—';
                        stats.innerHTML =
                            `Avg <strong>${escapeHtml(String(avg2))}</strong> · <strong>${refreshed.ratingCount}</strong> rating${refreshed.ratingCount !== 1 ? 's' : ''} · <strong>${refreshed.madeCount}</strong> made`;
                    }
                } catch (e) {
                    console.error('toggleMadeRecipe:', e);
                    let msg = (e && e.message) ? e.message : 'Please try again.';
                    if (e && e.code === 'permission-denied') {
                        msg = 'Permission denied saving Made It. Deploy the latest Firestore rules (including recipes/.../mades), then try again.';
                    }
                    window.alert(msg);
                } finally {
                    madeBtn.disabled = false;
                }
            });
        }

        mountPassportStripIfMadeIt(meal, made);
    } catch (e) {
        console.error('Recipe feedback:', e);
        mountPassportStripIfMadeIt(meal, false);
        wrap.innerHTML =
            `<div class="recipe-feedback-loading">Could not load this section (${e && e.code ? e.code : 'error'}). Check your connection, then refresh.</div>`;
    }
}

// ── MealDB renderer ────────────────────────────────────────────────────────
function isCopycatMeal(meal) {
    if (!meal) return false;
    if (meal.isCopycat === true) return true;
    const id = parseInt(String(meal.idMeal || ''), 10);
    return Number.isFinite(id) && id >= 99001;
}

function formatRecipeByAuthorLine(meal) {
    const raw = ((meal.strAuthor || 'Stephanie Manley').trim()) || 'Stephanie Manley';
    const name = raw.split(/\s+/).map((w) => {
        if (!w) return '';
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).filter(Boolean).join(' ');
    return `Recipe by ${name}`;
}

function renderMealDB(meal) {
    const ingredients = [];
    for (let i = 1; i <= 20; i++) {
        const ing = meal[`strIngredient${i}`], measure = meal[`strMeasure${i}`];
        if (ing && ing.trim()) ingredients.push({ ing: ing.trim(), measure: (measure || '').trim() });
    }
    const steps = (meal.strInstructions || '').split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 10);
    cookAlongSteps = steps.slice();
    const cookAlongLaunchHtml = steps.length
        ? `<button type="button" class="cook-along-trigger" onclick="openCookAlongMode()" title="Fullscreen step-by-step with voice & timer">Cook Along Mode</button>`
        : '';

    const ingredientRows = ingredients.map(({ ing, measure }) => `
        <div class="ingredient-row">
            <span class="ingredient-dot"></span>
            <span class="ingredient-measure">${measure || 'To taste'}</span>
            <span class="ingredient-name">${ing}</span>
        </div>`).join('');
    const stepRows = steps.map(s => `<div class="instruction-step">${s}</div>`).join('');
    const tag = [meal.strArea, meal.strCategory].filter(Boolean).join(' · ');
    const costComparisonCard = buildCostComparisonCard(ingredients, meal.strMeal);
    const authorTagHtml = isCopycatMeal(meal)
        ? `<div class="recipe-tag-row"><span class="recipe-by-tag">${escapeHtml(formatRecipeByAuthorLine(meal))}</span></div>`
        : '';

    document.getElementById('recipeBody').innerHTML = buildLayout({
        title: meal.strMeal,
        image: meal.strMealThumb,
        tag,
        authorTagHtml,
        ingredientRows,
        stepRows,
        costComparisonCard,
        cookAlongLaunchHtml
    });
    if (currentUser) applyLikeState(meal.idMeal);
    hydrateRecipeFeedback(meal);
}

window.stampPassportFromCurrentRecipe = function (btnEl) {
    if (!currentMeal || !(currentMeal.strArea || '').trim()) return;
    var area = (currentMeal.strArea || '').trim();
    if (typeof window.recordCuisinePassportStamp !== 'function') return;
    var ok = window.recordCuisinePassportStamp(area, {
        idMeal: currentMeal.idMeal,
        strMeal: currentMeal.strMeal,
        strMealThumb: currentMeal.strMealThumb
    });
    var btn = btnEl || document.getElementById('passportRecipeBtn');
    if (ok && btn) {
        btn.disabled = true;
        btn.textContent = 'This recipe is in your ' + area + ' passport ✓';
    }
};

// ── Cook Along Mode (speechSynthesis + per-step timer) ─────────────────────────
let calTimerRemainSec = 0;
let calTimerInterval  = null;
let calTimerRunning   = false;

function calFormatTimer(sec) {
    if (sec == null || sec <= 0) return '—:—';
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
}

function calStopTimerTick() {
    if (calTimerInterval) {
        clearInterval(calTimerInterval);
        calTimerInterval = null;
    }
    calTimerRunning = false;
}

function calUpdateTimerDisplay() {
    const el = document.getElementById('cookAlongTimerDisplay');
    if (el) el.textContent = calFormatTimer(calTimerRemainSec);
}

function calOnTimerDone() {
    calStopTimerTick();
    const toggle = document.getElementById('cookAlongTimerToggle');
    if (toggle) toggle.textContent = 'Start';
    if (typeof window.speechSynthesis !== 'undefined') {
        try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance('Timer finished.');
            u.lang = 'en-US';
            u.rate = 1;
            window.speechSynthesis.speak(u);
        } catch (_) { /* ignore */ }
    }
    try {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    } catch (_) { /* ignore */ }
}

function calTick() {
    calTimerRemainSec--;
    calUpdateTimerDisplay();
    if (calTimerRemainSec <= 0) {
        calTimerRemainSec = 0;
        calOnTimerDone();
    }
}

function calStartOrResumeCountdown() {
    if (calTimerRemainSec <= 0) return;
    calStopTimerTick();
    calTimerRunning = true;
    const toggle = document.getElementById('cookAlongTimerToggle');
    if (toggle) toggle.textContent = 'Pause';
    calTimerInterval = setInterval(calTick, 1000);
}

function calPauseTimer() {
    calStopTimerTick();
    const toggle = document.getElementById('cookAlongTimerToggle');
    if (toggle) toggle.textContent = calTimerRemainSec > 0 ? 'Resume' : 'Start';
}

function calSetPresetSeconds(sec) {
    calPauseTimer();
    calTimerRemainSec = sec;
    calUpdateTimerDisplay();
    const toggle = document.getElementById('cookAlongTimerToggle');
    if (toggle) toggle.textContent = 'Start';
    calStartOrResumeCountdown();
}

function calClearTimer() {
    calPauseTimer();
    calTimerRemainSec = 0;
    calUpdateTimerDisplay();
    const toggle = document.getElementById('cookAlongTimerToggle');
    if (toggle) toggle.textContent = 'Start';
}

function calToggleTimerButton() {
    if (calTimerRemainSec <= 0) return;
    if (calTimerRunning) calPauseTimer();
    else calStartOrResumeCountdown();
}

function cookAlongSpeechSupported() {
    return typeof window.speechSynthesis !== 'undefined';
}

/** Plain text for current step — safe for speech + textContent display */
function cookAlongPlainText(txt) {
    if (!txt) return '';
    return String(txt).replace(/\s+/g, ' ').trim();
}

function cookAlongSpeakUtter(text) {
    if (!text || !cookAlongSpeechSupported()) return;
    try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.93;
        window.speechSynthesis.speak(u);
    } catch (e) {
        console.warn('Speech:', e);
    }
}

function cookAlongSyncCookingUI() {
    const steps = cookAlongSteps;
    const n = steps.length;
    const body = document.getElementById('cookAlongStepBody');
    const cur = document.getElementById('cookAlongStepCur');
    const tot = document.getElementById('cookAlongStepTot');
    const prev = document.getElementById('cookAlongPrev');
    const next = document.getElementById('cookAlongNext');

    const idx = Math.max(0, Math.min(cookAlongIndex, Math.max(0, n - 1)));
    cookAlongIndex = idx;

    if (cur) cur.textContent = n ? String(idx + 1) : '0';
    if (tot) tot.textContent = String(n || 0);
    if (body) body.textContent = n ? cookAlongPlainText(steps[idx]) : '';
    if (prev) prev.disabled = idx <= 0;
    if (next) next.disabled = idx >= n - 1;
}

/** If auto-read is on and speech works, narrate current step when step index changes */
function cookAlongMaybeAutoRead() {
    const cb = document.getElementById('cookAlongAutoRead');
    if (!cb || !cb.checked || !cookAlongSpeechSupported()) return;
    const t = cookAlongSteps[cookAlongIndex];
    if (!t) return;
    cookAlongSpeakUtter(`Step ${cookAlongIndex + 1}. ${cookAlongPlainText(t)}`);
}

window.openCookAlongMode = function () {
    if (!cookAlongSteps.length) {
        window.alert('This recipe does not have enough instruction lines for Cook Along Mode.');
        return;
    }
    cookAlongIndex = 0;
    const overlay = document.getElementById('cookAlongOverlay');
    if (!overlay) return;
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    const auto = document.getElementById('cookAlongAutoRead');
    if (auto) {
        const saved = sessionStorage.getItem('cookAlongAutoRead');
        auto.checked = saved !== '0';
        auto.onchange = () => {
            sessionStorage.setItem('cookAlongAutoRead', auto.checked ? '1' : '0');
        };
    }

    const speakBtn = document.getElementById('cookAlongSpeak');
    if (speakBtn) {
        speakBtn.disabled = !cookAlongSpeechSupported();
        speakBtn.title = cookAlongSpeechSupported()
            ? 'Read this step with your browser’s voice'
            : 'Speech is not supported in this browser.';
    }

    calClearTimer();
    cookAlongSyncCookingUI();

    cookAlongMaybeAutoRead();
};

window.closeCookAlongMode = function () {
    try {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (_) { /* ignore */ }
    calClearTimer();
    const overlay = document.getElementById('cookAlongOverlay');
    if (overlay) {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
    }
    document.body.style.overflow = '';
};

window.cookAlongGoPrev = function () {
    if (cookAlongIndex <= 0) return;
    try {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (_) { /* ignore */ }
    cookAlongIndex--;
    cookAlongSyncCookingUI();
    cookAlongMaybeAutoRead();
};

window.cookAlongGoNext = function () {
    if (cookAlongIndex >= cookAlongSteps.length - 1) return;
    try {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (_) { /* ignore */ }
    cookAlongIndex++;
    cookAlongSyncCookingUI();
    cookAlongMaybeAutoRead();
};

window.cookAlongReadAloud = function () {
    const t = cookAlongSteps[cookAlongIndex];
    if (!t) return;
    cookAlongSpeakUtter(`Step ${cookAlongIndex + 1}. ${cookAlongPlainText(t)}`);
};

document.addEventListener('keydown', (e) => {
    const overlay = document.getElementById('cookAlongOverlay');
    if (e.key === 'Escape' && overlay && overlay.classList.contains('is-open')) {
        e.preventDefault();
        window.closeCookAlongMode();
    }
});

// ── Load recipe ────────────────────────────────────────────────────────────
async function loadRecipe() {
    const params = new URLSearchParams(window.location.search);
    const mealId = params.get('id');
    const body   = document.getElementById('recipeBody');

    if (!mealId) {
        body.innerHTML = '<div class="loading-state">No recipe selected.</div>';
        return;
    }

    try {
        await auth.authStateReady();
    } catch (_) { /* SDK without authStateReady — continue */ }

    // Copycat IDs start at 99001 — load from local JSON instead of MealDB
    if (parseInt(mealId, 10) >= 99001) {
        try {
            const res  = await fetch('copycat-recipes.json');
            const data = await res.json();
            const meal = (data.meals || []).find(m => m.idMeal === mealId);
            if (meal) {
                currentMeal = meal;
                renderMealDB(meal);
            } else {
                body.innerHTML = '<div class="loading-state">Recipe not found.</div>';
            }
        } catch {
            body.innerHTML = '<div class="loading-state">Failed to load recipe.</div>';
        }
        return;
    }

    // Regular MealDB lookup
    try {
        const res  = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`);
        const data = await res.json();
        if (data.meals && data.meals[0]) {
            currentMeal = data.meals[0];
            renderMealDB(data.meals[0]);
        } else {
            body.innerHTML = '<div class="loading-state">Recipe not found.</div>';
        }
    } catch {
        body.innerHTML = '<div class="loading-state">Failed to load recipe.</div>';
    }
}

window.openSavePopup = openSavePopup;
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.cook-along-timer-presets [data-cal-sec]').forEach((btn) => {
        btn.addEventListener('click', () => {
            const sec = parseInt(btn.getAttribute('data-cal-sec'), 10);
            if (Number.isFinite(sec) && sec > 0) calSetPresetSeconds(sec);
        });
    });
    const tToggle = document.getElementById('cookAlongTimerToggle');
    const tClear = document.getElementById('cookAlongTimerClear');
    if (tToggle) tToggle.addEventListener('click', calToggleTimerButton);
    if (tClear) tClear.addEventListener('click', () => calClearTimer());
    loadRecipe();
});

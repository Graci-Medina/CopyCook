<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Community Recipe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #F5EFE7; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 75px; background-color: #f5efe7;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 0; border-right: 2px solid #E8B4B4; flex-shrink: 0;
        }
        .logo { margin-bottom: 40px; }
        .logo img { height: 50px; width: auto; cursor: pointer; }
        .nav-icons { display: flex; flex-direction: column; gap: 30px; flex: 1; margin-top: 150px; }
        .nav-icon {
            position: relative; width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.3s; text-decoration: none;
        }
        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon img { width: 100%; height: 100%; border-radius: 50%; }
        .nav-icon.active { box-shadow: 0 0 0 3px #E8B4B4; }
        .notification-badge {
            position: absolute; top: -5px; right: -5px;
            background-color: #D4A5A5; color: white;
            font-size: 10px; font-weight: bold; padding: 2px 6px;
            border-radius: 10px; min-width: 18px; text-align: center;
        }
        .nav-bottom { margin-top: auto; padding-bottom: 20px; }

        /* ── Main ── */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* ── Search bar ── */
        .search-container {
            display: flex; align-items: center;
            padding: 20px 30px; gap: 15px; flex-shrink: 0;
        }
        .search-bar {
            flex: 1; display: flex; align-items: center;
            background-color: #9FB19F; border-radius: 15px; padding: 15px 20px; gap: 12px;
        }
        .search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 16px; color: #3A3A3A; font-family: 'Poppins', sans-serif; cursor: pointer;
        }
        .search-bar input::placeholder { color: #5A5A5A; }
        .profile-pic {
            width: 50px; height: 50px; border-radius: 50%; overflow: hidden;
            border: 3px solid #E8B4B4; cursor: pointer; transition: transform 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-pic:hover { transform: scale(1.05); }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }

        /* ── Recipe body ── */
        .recipe-body {
            flex: 1; overflow: hidden; padding: 0 30px 30px;
            display: flex; gap: 25px;
        }

        /* ── Left panel ── */
        .left-panel {
            width: 420px; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 16px; overflow: hidden;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer;
            font-family: 'Poppins', sans-serif; font-size: 15px;
            color: #5A5A5A; padding: 0; transition: color 0.2s;
        }
        .back-btn:hover { color: #D4A5A5; }
        .action-row { display: flex; align-items: center; gap: 14px; }
        .action-btn {
            background: none; border: none; cursor: pointer; padding: 6px;
            border-radius: 50%; transition: background 0.2s, transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { background: rgba(212,165,165,0.15); transform: scale(1.1); }
        .recipe-image-wrap {
            border-radius: 20px; overflow: hidden;
            flex: 1; min-height: 420px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .recipe-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .recipe-image-placeholder {
            width: 100%; height: 100%; min-height: 420px;
            background: linear-gradient(135deg, #F5EFE7, #EDE0D4);
            display: flex; align-items: center; justify-content: center; font-size: 5rem;
        }

        /* ── Right panel ── */
        .right-panel {
            flex: 1; display: flex; flex-direction: column; gap: 20px;
            min-width: 0; overflow-y: auto; padding-right: 4px;
        }
        .right-panel::-webkit-scrollbar { width: 8px; }
        .right-panel::-webkit-scrollbar-track { background: #F5EFE7; }
        .right-panel::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 8px; }

        .recipe-title { font-size: 32px; font-weight: 700; color: #2A2A2A; line-height: 1.2; }

        .author-tag {
            display: inline-flex; align-items: center; gap: 10px;
            background: white; border-radius: 20px; padding: 8px 16px;
            box-shadow: 0 2px 8px rgba(212,165,165,0.15);
        }
        .author-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
        }
        .author-name { font-size: 14px; font-weight: 600; color: #5A3A3A; }

        .card {
            background: white; border-radius: 20px; padding: 22px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 18px; font-weight: 700; color: #2A2A2A;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .ingredient-list { display: flex; flex-direction: column; gap: 10px; }
        .ingredient-row { display: flex; align-items: center; gap: 14px; font-size: 14px; }
        .ingredient-dot { width: 14px; height: 14px; border-radius: 50%; background-color: #E8B4B4; flex-shrink: 0; }
        .ingredient-name { color: #3A3A3A; }
        .instructions-list { display: flex; flex-direction: column; gap: 10px; }
        .instruction-step {
            background-color: #F8E8E8; border-radius: 10px;
            padding: 12px 16px; font-size: 13.5px; color: #3A3A3A; line-height: 1.6;
            display: flex; align-items: flex-start; gap: 10px;
        }
        .step-number {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 50%;
            background: #D4A5A5; color: white;
            font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
        }
        .loading-state {
            display: flex; align-items: center; justify-content: center;
            flex: 1; font-size: 16px; color: #9FB19F;
        }

        /* ── Comment drawer ── */
        .comment-drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 400; }
        .comment-drawer-overlay.active { display: block; }
        .comment-drawer {
            position: fixed; top: 0; right: -480px; height: 100%;
            width: 460px; max-width: 95vw;
            background: #FDFBF7; border-left: 2px solid #E8B4B4;
            display: flex; flex-direction: column;
            transition: right 0.32s cubic-bezier(0.4,0,0.2,1); z-index: 401;
        }
        .comment-drawer.open { right: 0; }
        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 22px 26px 16px; border-bottom: 2px solid #F0EDE8; flex-shrink: 0;
        }
        .drawer-title { font-size: 20px; font-weight: 700; color: #2A2A2A; }
        .drawer-close { background: none; border: none; cursor: pointer; color: #9A9A9A; font-size: 22px; line-height: 1; padding: 4px; transition: color 0.2s; }
        .drawer-close:hover { color: #D4A5A5; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 20px 26px; }
        .drawer-body::-webkit-scrollbar { width: 6px; }
        .drawer-body::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 6px; }
        .drawer-footer { padding: 16px 26px 24px; border-top: 2px solid #F0EDE8; flex-shrink: 0; background: #FDFBF7; }
        .drawer-input-row { display: flex; gap: 10px; align-items: flex-start; }
        .drawer-textarea {
            flex: 1; background: #F5F2EE; border: 2px solid transparent;
            border-radius: 14px; padding: 11px 14px; font-size: 13.5px;
            font-family: 'Poppins', sans-serif; color: #3A3A3A; resize: none; outline: none;
            min-height: 44px; line-height: 1.5; transition: border-color 0.2s, min-height 0.2s;
        }
        .drawer-textarea:focus { border-color: #9FB19F; background: #EFF5EF; min-height: 72px; }
        .drawer-textarea::placeholder { color: #ABABAB; }
        .drawer-post-btn {
            background: #9FB19F; color: white; border: none;
            padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; align-self: flex-end; transition: background 0.2s;
        }
        .drawer-post-btn:hover { background: #8AA08A; }
        .drawer-post-btn:disabled { background: #CCC; cursor: not-allowed; }
        .drawer-login-notice { font-size: 13px; color: #9A9A9A; font-style: italic; padding: 10px 0; }

        /* Comment items */
        .comment-item { display: flex; gap: 12px; margin-bottom: 14px; }
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white; }
        .comment-body { flex: 1; min-width: 0; }
        .comment-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .comment-name { font-size: 13.5px; font-weight: 600; color: #2A2A2A; }
        .comment-time { font-size: 11px; color: #ABABAB; }
        .comment-text { font-size: 13.5px; color: #4A4A4A; line-height: 1.55; word-break: break-word; }
        .comment-delete { background: none; border: none; cursor: pointer; color: #D4A5A5; font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-left: 4px; transition: background 0.15s; display: none; }
        .comment-delete:hover { background: #F8E8E8; }
        .comment-delete.visible { display: inline; }
        .no-comments { text-align: center; color: #ABABAB; font-size: 14px; padding: 20px 0; }
        .comments-loading { text-align: center; color: #9FB19F; font-size: 13px; padding: 16px 0; }

        /* ── Logout popup ── */
        .logout-popup {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .logout-popup.active { display: flex; }
        .logout-content {
            background: #FDFBF7; border: 3px solid #E8B4B4;
            border-radius: 20px; padding: 40px 50px; text-align: center;
        }
        .logout-content h3 { color: #3A3A3A; font-size: 24px; margin-bottom: 30px; font-weight: 500; }
        .logout-btn, .cancel-btn {
            width: 100%; padding: 15px 30px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; margin: 8px 0;
        }
        .logout-btn { background-color: #D4A5A5; color: white; }
        .cancel-btn { background-color: #9FB19F; color: white; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #3A3A3A; color: white; padding: 12px 24px;
            border-radius: 30px; font-size: 14px; font-weight: 500;
            font-family: 'Poppins', sans-serif; opacity: 0;
            transition: opacity 0.3s, transform 0.3s; z-index: 9999; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #9FB19F; }
        .toast.error { background: #D4A5A5; }

        /* ── Delete post button ── */
        .delete-post-btn {
            margin-left: auto;
            background: none;
            border: 2px solid #E8B4B4;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #C47C7C;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .delete-post-btn:hover { background: #FDF0F0; border-color: #D4A5A5; }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="CopyCook Logo" onclick="window.location.href='home.html'">
        </div>
        <nav class="nav-icons">
            <a href="home.html" class="nav-icon active">
                <img src="home-icon.png" alt="Home">
            </a>
            <a href="../Explore/explore.html" class="nav-icon">
                <img src="explore-icon.png" alt="Explore">
            </a>
            <a href="../post page/post.html" class="nav-icon">
                <img src="plus-icon.png" alt="Post">
            </a>
            <a href="../Saved page/saved.html" class="nav-icon">
                <img src="save-icon.png" alt="Saved">
            </a>
            <a href="../Messages page/Messages.html" class="nav-icon">
                <img src="message.png" alt="Messages">
                <span class="notification-badge">10</span>
            </a>
        </nav>
        <div class="nav-bottom">
            <a href="#" class="nav-icon" onclick="toggleLogoutPopup(event)">
                <img src="settings-icon.png" alt="Settings">
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="search-container">
            <div class="search-bar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="7" stroke="#5A5A5A" stroke-width="2"/>
                    <path d="M16 16L20 20" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" placeholder="Search restaurants or dishes"
                       onclick="window.location.href='home.html'" readonly style="cursor:pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="10" y="5" width="4" height="10" rx="2" fill="#D4A5A5"/>
                    <path d="M7 12C7 14.7614 9.23858 17 12 17C14.7614 17 17 14.7614 17 12" stroke="#D4A5A5" stroke-width="2"/>
                    <line x1="12" y1="17" x2="12" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                    <line x1="9" y1="20" x2="15" y2="20" stroke="#D4A5A5" stroke-width="2"/>
                </svg>
            </div>
            <div class="profile-pic" id="profileAvatar">
                <img src="drakepfp.png" alt="Profile">
            </div>
        </div>

        <div class="recipe-body" id="recipeBody">
            <div class="loading-state">Loading recipe...</div>
        </div>
    </main>
</div>

<!-- Logout Popup -->
<div id="logoutPopup" class="logout-popup">
    <div class="logout-content">
        <h3>Account Settings</h3>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        <button class="cancel-btn" onclick="closeLogoutPopup()">Cancel</button>
    </div>
</div>

<!-- Comment Drawer -->
<div class="comment-drawer-overlay" id="commentDrawerOverlay" onclick="closeCommentDrawer()"></div>
<div class="comment-drawer" id="commentDrawer">
    <div class="drawer-header">
        <span class="drawer-title">💬 Comments <span id="drawerCommentCount" style="font-size:14px;color:#9A9A9A;font-weight:500"></span></span>
        <button class="drawer-close" onclick="closeCommentDrawer()">&#x2715;</button>
    </div>
    <div class="drawer-body" id="drawerBody">
        <div class="comments-loading">Loading comments…</div>
    </div>
    <div class="drawer-footer">
        <div id="drawerInputArea"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module">
import { db, auth } from '../firebase-config.js';
import {
    doc, getDoc, collection, addDoc, getDocs, deleteDoc,
    query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ── User state ────────────────────────────────────────────────────────────────
const uid         = localStorage.getItem('userUID');
const displayName = localStorage.getItem('userDisplayName') || 'You';
const avatarColor = localStorage.getItem('userAvatarColor') || '#9FB19F';
const userInitial = localStorage.getItem('userInitial') || displayName[0]?.toUpperCase() || '?';

let currentPostId = null;

// ── Avatar ────────────────────────────────────────────────────────────────────
(function() {
    const el      = document.getElementById('profileAvatar');
    const initial = localStorage.getItem('userInitial');
    const color   = localStorage.getItem('userAvatarColor');
    const name    = localStorage.getItem('userDisplayName');
    if (initial && color) {
        el.innerHTML = initial;
        el.style.cssText = `background:${color};display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700;`;
        el.title = name || '';
    }
})();

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}
window.showToast = showToast;

// ── Logout ────────────────────────────────────────────────────────────────────
window.toggleLogoutPopup = (e) => { e.preventDefault(); document.getElementById('logoutPopup').classList.toggle('active'); };
window.closeLogoutPopup  = ()  => { document.getElementById('logoutPopup').classList.remove('active'); };
window.handleLogout      = ()  => { localStorage.clear(); sessionStorage.clear(); window.location.href = '../login.html'; };

// ── Like ──────────────────────────────────────────────────────────────────────
window.toggleLike = function(btn) {
    const path  = btn.querySelector('#likePathEl');
    const liked = path.getAttribute('fill') === '#D4A5A5';
    path.setAttribute('fill', liked ? 'none' : '#D4A5A5');
};

// ── Share ─────────────────────────────────────────────────────────────────────
window.shareRecipe = function() {
    if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href });
    } else {
        navigator.clipboard.writeText(window.location.href).then(() => showToast('Link copied ✓'));
    }
};

// ── Comment helpers ───────────────────────────────────────────────────────────
function timeAgo(date) {
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secs < 60)    return 'just now';
    if (secs < 3600)  return `${Math.floor(secs/60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
    return `${Math.floor(secs/86400)}d ago`;
}

function updateCommentCount(delta) {
    const badge = document.getElementById('drawerCommentCount');
    if (!badge) return;
    const cur = parseInt(badge.dataset.count || '0') + delta;
    badge.dataset.count = cur;
    badge.textContent = cur > 0 ? `(${cur})` : '';
}

function renderCommentItem(c) {
    const wrap = document.createElement('div');
    wrap.className = 'comment-item';
    wrap.dataset.id = c.id;

    const av = document.createElement('div');
    av.className = 'comment-avatar';
    av.style.background = c.avatarColor || '#9FB19F';
    av.textContent = c.displayName?.[0]?.toUpperCase() || '?';

    const body = document.createElement('div');
    body.className = 'comment-body';

    const meta = document.createElement('div');
    meta.className = 'comment-meta';
    meta.innerHTML = `<span class="comment-name">${c.displayName}</span>
                      <span class="comment-time">${timeAgo(c.createdAt)}</span>`;

    if (uid && uid === c.uid) {
        const del = document.createElement('button');
        del.className = 'comment-delete visible';
        del.textContent = 'Delete';
        del.onclick = async () => {
            try {
                await deleteDoc(doc(db, 'posts', currentPostId, 'comments', c.id));
                wrap.remove();
                updateCommentCount(-1);
                showToast('Comment deleted.');
            } catch { showToast('Could not delete.', 'error'); }
        };
        meta.appendChild(del);
    }

    const text = document.createElement('div');
    text.className = 'comment-text';
    text.textContent = c.text;

    body.appendChild(meta);
    body.appendChild(text);
    wrap.appendChild(av);
    wrap.appendChild(body);
    return wrap;
}

async function loadComments() {
    const body = document.getElementById('drawerBody');
    body.innerHTML = '<div class="comments-loading">Loading comments…</div>';
    try {
        const q    = query(collection(db, 'posts', currentPostId, 'comments'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        const comments = snap.docs.map(d => ({
            id: d.id, uid: d.data().uid, displayName: d.data().displayName,
            avatarColor: d.data().avatarColor || '#9FB19F', text: d.data().text,
            createdAt: d.data().createdAt?.toDate?.() || new Date()
        }));

        body.innerHTML = '';
        const badge = document.getElementById('drawerCommentCount');
        if (badge) { badge.dataset.count = comments.length; badge.textContent = comments.length > 0 ? `(${comments.length})` : ''; }

        if (comments.length === 0) {
            body.innerHTML = '<div class="no-comments">No comments yet. Be the first!</div>';
        } else {
            comments.forEach(c => body.appendChild(renderCommentItem(c)));
        }
    } catch (err) {
        console.error(err);
        body.innerHTML = '<div class="no-comments" style="color:#D4A5A5">Could not load comments.</div>';
    }
}

function buildDrawerInput() {
    const area = document.getElementById('drawerInputArea');
    if (!uid) {
        area.innerHTML = '<div class="drawer-login-notice">Log in to leave a comment.</div>';
        return;
    }
    area.innerHTML = `
        <div class="drawer-input-row">
            <div class="comment-avatar" style="background:${avatarColor}">${userInitial}</div>
            <textarea class="drawer-textarea" id="drawerTextarea" placeholder="Write a comment…" rows="1"></textarea>
            <button class="drawer-post-btn" id="drawerPostBtn" disabled>Post</button>
        </div>`;

    const textarea = document.getElementById('drawerTextarea');
    const postBtn  = document.getElementById('drawerPostBtn');

    textarea.addEventListener('input', () => { postBtn.disabled = textarea.value.trim().length === 0; });
    textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!postBtn.disabled) postBtn.click(); }
    });
    postBtn.addEventListener('click', async () => {
        const text = textarea.value.trim();
        if (!text) return;
        postBtn.disabled = true; postBtn.textContent = '…';
        try {
            await addDoc(collection(db, 'posts', currentPostId, 'comments'), {
                uid, displayName, avatarColor, text, createdAt: serverTimestamp()
            });
            textarea.value = ''; postBtn.textContent = 'Post';
            const drawerBody = document.getElementById('drawerBody');
            const noMsg = drawerBody.querySelector('.no-comments');
            if (noMsg) noMsg.remove();
            const fake = { id: '_' + Date.now(), uid, displayName, avatarColor, text, createdAt: new Date() };
            drawerBody.insertBefore(renderCommentItem(fake), drawerBody.firstChild);
            updateCommentCount(1);
            showToast('Comment posted ✓');
        } catch (err) {
            console.error(err);
            showToast('Could not post comment.', 'error');
            postBtn.textContent = 'Post';
        }
    });
}

// ── Delete post ──────────────────────────────────────────────────────────────
window.deletePost = async function() {
    if (!confirm('Delete this recipe? This cannot be undone.')) return;
    try {
        await deleteDoc(doc(db, 'posts', currentPostId));
        showToast('Recipe deleted.', 'success');
        setTimeout(() => window.location.href = 'home.html', 1200);
    } catch (err) {
        console.error(err);
        showToast('Could not delete recipe.', 'error');
    }
};

window.openCommentDrawer = function() {
    document.getElementById('commentDrawerOverlay').classList.add('active');
    document.getElementById('commentDrawer').classList.add('open');
    buildDrawerInput();
    loadComments();
};
window.closeCommentDrawer = function() {
    document.getElementById('commentDrawerOverlay').classList.remove('active');
    document.getElementById('commentDrawer').classList.remove('open');
};

// ── Render post ───────────────────────────────────────────────────────────────
function renderPost(post) {
    currentPostId = post.id;
    const initials = (post.displayName || 'C').charAt(0).toUpperCase();

    const ingredientRows = (post.ingredients || []).map(ing => `
        <div class="ingredient-row">
            <span class="ingredient-dot"></span>
            <span class="ingredient-name">${ing}</span>
        </div>`).join('');

    let steps = (post.instructions || '').split(/\n+/).map(s => s.trim()).filter(s => s.length > 3);
    if (steps.length <= 1) {
        steps = (post.instructions || '').match(/[^.!?]+[.!?]+/g)
            ?.map(s => s.trim()).filter(s => s.length > 3) || [post.instructions];
    }

    const stepRows = steps.map((s, i) => `
        <div class="instruction-step">
            <span class="step-number">${i + 1}</span>
            <span>${s}</span>
        </div>`).join('');

    const imageHtml = post.postImg
        ? `<img src="${post.postImg}" alt="${post.mealName}">`
        : `<div class="recipe-image-placeholder">🍽️</div>`;

    document.getElementById('recipeBody').innerHTML = `
        <div class="left-panel">
            <button class="back-btn" onclick="history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back
            </button>
            <div class="action-row">
                <button class="action-btn" id="likeBtn" title="Like" onclick="toggleLike(this)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path id="likePathEl"
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                            stroke="#D4A5A5" stroke-width="2" fill="none"/>
                    </svg>
                </button>
                <button class="action-btn" title="Comments" onclick="openCommentDrawer()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                            stroke="#9FB19F" stroke-width="2" fill="none"/>
                    </svg>
                </button>
                <button class="action-btn" title="Share" onclick="shareRecipe()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke="#A5B4D4" stroke-width="2" fill="none"/>
                        <polyline points="16 6 12 2 8 6" stroke="#A5B4D4" stroke-width="2" fill="none"/>
                        <line x1="12" y1="2" x2="12" y2="15" stroke="#A5B4D4" stroke-width="2"/>
                    </svg>
                </button>
                ${uid === post.uid ? `
                <button class="delete-post-btn" onclick="deletePost()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M9 6V4h6v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Delete
                </button>` : ''}
            </div>
            <div class="recipe-image-wrap">
                ${imageHtml}
            </div>
        </div>

        <div class="right-panel">
            <h1 class="recipe-title">${post.mealName}</h1>
            <div>
                <div class="author-tag">
                    <div class="author-avatar" style="background:${post.avatarColor || '#9FB19F'}">${initials}</div>
                    <span class="author-name">by ${post.displayName || 'Anonymous'}</span>
                </div>
            </div>
            <div class="card">
                <div class="card-title">🍳 Ingredients</div>
                <div class="ingredient-list">${ingredientRows}</div>
            </div>
            <div class="card">
                <div class="card-title">👨‍🍳 Instructions</div>
                <div class="instructions-list">${stepRows}</div>
            </div>
        </div>
    `;

    document.title = `CopyCook - ${post.mealName}`;
}

// ── Load from Firestore ───────────────────────────────────────────────────────
async function loadPost() {
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    const body   = document.getElementById('recipeBody');

    if (!postId) {
        body.innerHTML = `<div class="loading-state" style="flex-direction:column;gap:16px;">
            <span>No recipe selected.</span>
            <button onclick="history.back()" style="background:#9FB19F;color:white;border:none;padding:10px 24px;border-radius:12px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;cursor:pointer;">← Go Back</button>
        </div>`;
        return;
    }

    try {
        const snap = await getDoc(doc(db, 'posts', postId));
        if (snap.exists()) {
            renderPost({ id: snap.id, ...snap.data() });
        } else {
            body.innerHTML = '<div class="loading-state">Recipe not found.</div>';
        }
    } catch (err) {
        console.error('loadPost error:', err);
        body.innerHTML = '<div class="loading-state">Failed to load recipe.</div>';
    }
}

document.addEventListener('DOMContentLoaded', loadPost);
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CopyCook - Sign Up</title>
<link rel="stylesheet" href="styles.css">
<style>
.floaters {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.floater {
    position: absolute;
    font-size: 26px;
    animation: float 7s ease-in-out infinite;
    opacity: 0.45;
}
.floater:nth-child(1)  { top: 8%;  left: 4%;   font-size: 32px; animation-delay: 0s;   }
.floater:nth-child(2)  { top: 20%; left: 90%;  font-size: 24px; animation-delay: 1.2s; }
.floater:nth-child(3)  { top: 40%; left: 6%;   font-size: 28px; animation-delay: 0.7s; }
.floater:nth-child(4)  { top: 60%; left: 92%;  font-size: 22px; animation-delay: 2.1s; }
.floater:nth-child(5)  { top: 75%; left: 3%;   font-size: 20px; animation-delay: 1.5s; }
.floater:nth-child(6)  { top: 85%; left: 88%;  font-size: 28px; animation-delay: 3s;   }
.floater:nth-child(7)  { top: 50%; left: 95%;  font-size: 20px; animation-delay: 0.4s; }
.floater:nth-child(8)  { top: 92%; left: 20%;  font-size: 24px; animation-delay: 2.5s; }
.floater:nth-child(9)  { top: 5%;  left: 75%;  font-size: 22px; animation-delay: 1.8s; }
.floater:nth-child(10) { top: 30%; left: 2%;   font-size: 18px; animation-delay: 3.5s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-16px) rotate(4deg); }
}

main { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="floaters">
    <span class="floater">🍳</span>
    <span class="floater">🌿</span>
    <span class="floater">🍰</span>
    <span class="floater">🥗</span>
    <span class="floater">🫕</span>
    <span class="floater">🍜</span>
    <span class="floater">🍕</span>
    <span class="floater">🥐</span>
    <span class="floater">🍣</span>
    <span class="floater">🧁</span>
</div>
<nav class="navbar">
<div class="logo">
<img src="logo.png" alt="CopyCook Logo">
</div>
<div class="nav-links">
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<button class="login-btn" onclick="window.location.href='login.html'">Login</button>
</div>
</nav>
<main>
<div class="login-container">
<div class="chef-hat-icon">
<img src="logo.png" alt="CopyCook Logo">
</div>
<h1>Welcome to CopyCook</h1>
<p style="text-align:center;font-size:14px;color:#7A7A7A;max-width:340px;margin:-8px auto 18px;line-height:1.5;">Create your account, then answer a short survey so we can match your home feed to your tastes.</p>
<form id="signupForm">
<input type="text" id="name" placeholder="Full name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
<p class="password-warning" id="passwordWarning">Passwords do not match</p>
<button type="submit" class="submit-btn signup-btn" id="submitBtn">Sign Up</button>
<p class="signup-link">
                    Already have an account? <a href="login.html">Log in</a>
</p>
<div id="message" class="message"></div>
</form>
</div>
</main>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="signup.js"></script>
</body>
</html>

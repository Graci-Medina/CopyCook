<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5EFE7;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 75px;
            background-color: #F5EFE7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 2px solid #E8B4B4;
            flex-shrink: 0;
        }

        .logo { margin-bottom: 40px; }
        .logo img { height: 50px; width: auto; cursor: pointer; }

        .nav-icons {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
            margin-top: 150px;
        }

        .nav-icon {
            position: relative;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon img { width: 100%; height: 100%; border-radius: 50%; }
        .nav-icon.active { box-shadow: 0 0 0 3px #E8B4B4; }

        .messages-unread-dot {
            position: absolute; top: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: #F06292; border: 2px solid #F5EFE7; box-sizing: border-box;
            display: none; pointer-events: none;
        }
        .messages-unread-dot.is-visible { display: block; }

        .nav-bottom { margin-top: auto; padding-bottom: 20px; }

        /* ── Main ── */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; background-color: #F5EFE7;
        }

        /* ── Top bar ── */
        .top-bar {
            display: flex; align-items: center;
            padding: 18px 30px; gap: 15px; flex-shrink: 0;
        }

        .back-btn {
            display: flex; align-items: center; gap: 5px;
            background: none; border: none;
            font-size: 14px; font-weight: 500; color: #5A5A5A;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            transition: color 0.2s; flex-shrink: 0; padding: 0;
        }

        .back-btn:hover { color: #D4A5A5; }

        .search-bar {
            flex: 1; display: flex; align-items: center;
            background-color: #9FB19F; border-radius: 15px;
            padding: 13px 20px; gap: 12px;
            transition: background-color 0.3s; cursor: pointer;
        }

        .search-bar:hover { background-color: #8AA08A; }

        .search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 15px; color: #3A3A3A;
            font-family: 'Poppins', sans-serif; cursor: pointer;
        }

        .search-bar input::placeholder { color: #5A5A5A; }

        .profile-avatar {
            width: 50px; height: 50px;
            border-radius: 50%; border: 3px solid #E8B4B4;
            cursor: pointer; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: white;
            flex-shrink: 0; transition: transform 0.3s;
        }

        .profile-avatar:hover { transform: scale(1.05); }

        /* ── Scrollable body ── */
        .page-body {
            flex: 1; overflow-y: auto;
            padding: 0 40px 40px;
        }

        .page-body::-webkit-scrollbar { width: 8px; }
        .page-body::-webkit-scrollbar-track { background: #F5EFE7; }
        .page-body::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 8px; }

        /* ── Profile hero ── */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 0 28px;
            gap: 12px;
        }

        .big-avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: #D4A5A5;
            border: 4px solid #fff;
            box-shadow: 0 0 0 3px #E8B4B4;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 700; color: #fff;
            overflow: hidden; flex-shrink: 0; user-select: none;
        }

        .hero-name {
            font-size: 22px; font-weight: 700; color: #2A2A2A; line-height: 1.2;
        }

        .hero-handle {
            font-size: 13px; color: #a07878; margin-top: -4px;
        }

        .hero-bio {
            max-width: 520px;
            text-align: center;
            font-size: 13px;
            color: #7f6666;
            line-height: 1.5;
            margin-top: 2px;
        }

        .hero-stats {
            display: flex; gap: 36px; margin-top: 4px;
        }

        .stat { text-align: center; }
        .stat-num { font-size: 17px; font-weight: 700; color: #2A2A2A; }
        .stat-lbl { font-size: 11px; color: #b08888; font-weight: 500; }

        .hero-actions {
            display: flex; gap: 12px; margin-top: 4px;
        }

        .btn-outline {
            padding: 9px 26px; border-radius: 20px;
            border: 1.5px solid #E8B4B4;
            background: transparent; color: #9a7070;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }

        .btn-outline:hover { background: rgba(232,180,180,0.15); }

        .btn-solid {
            padding: 9px 26px; border-radius: 20px; border: none;
            background: #D4A5A5; color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(212,165,165,0.35);
            transition: background 0.2s;
        }

        .btn-solid:hover { background: #c48f8f; }

        /* ── Tabs ── */
        .tabs-bar {
            display: flex;
            border-bottom: 2px solid #e8ddd5;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1; text-align: center; padding: 13px 0;
            font-size: 14px; font-weight: 600; color: #c4a0a0;
            cursor: pointer; position: relative;
            border: none; background: none;
            font-family: 'Poppins', sans-serif;
            transition: color 0.2s;
        }

        .tab::after {
            content: ''; position: absolute;
            bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 0; height: 2.5px;
            background: #D4A5A5; border-radius: 2px;
            transition: width 0.25s ease;
        }

        .tab.active { color: #3a2e2e; }
        .tab.active::after { width: 55%; }

        /* ── Tab panels ── */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Folder grid ── */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .folder-card {
            border-radius: 18px; overflow: hidden; cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            background: white;
            box-shadow: 0 2px 10px rgba(58,46,46,0.07);
        }

        .folder-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(58,46,46,0.13);
        }

        .folder-thumb {
            position: relative; aspect-ratio: 4/3; overflow: hidden;
        }

        .folder-thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.3s;
        }

        .folder-card:hover .folder-thumb img { transform: scale(1.05); }

        .folder-name {
            padding: 10px 12px 13px;
            font-size: 12px; font-weight: 600; color: #3a2e2e; line-height: 1.4;
        }

        .folder-name .folder-subtitle {
            font-size: 11px; font-weight: 400; color: #b08888; margin-top: 2px;
        }

        /* ── Recipe grid ── */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .recipe-card {
            border-radius: 18px; overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 10px rgba(58,46,46,0.07);
            cursor: pointer; position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(58,46,46,0.13);
        }

        .recipe-card img {
            width: 100%; aspect-ratio: 4/3;
            object-fit: cover; display: block;
        }

        .recipe-card-body { padding: 10px 12px 13px; }

        .recipe-card-title {
            font-size: 12px; font-weight: 600; color: #3a2e2e; line-height: 1.4;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .recipe-card-meta { font-size: 11px; color: #b08888; margin-top: 4px; }

        .heart-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(255,255,255,0.92);
            border-radius: 50%; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            pointer-events: none;
        }
        .heart-badge svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        /* ── Empty / loading state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center; padding: 60px 20px; color: #c4a0a0;
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.5; }
        .empty-state p { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #9a7878; }
        .empty-state span { font-size: 12px; }

        /* ── Logout popup ── */
        .logout-popup {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center;
        }

        .logout-popup.active { display: flex; }

        .logout-content {
            background: #FDFBF7; border: 3px solid #E8B4B4;
            border-radius: 20px; padding: 40px 50px; text-align: center;
        }

        .logout-content h3 { color: #3A3A3A; font-size: 22px; margin-bottom: 24px; font-weight: 500; }

        .logout-btn, .cancel-btn {
            width: 100%; padding: 14px 30px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; margin: 6px 0; transition: all 0.2s;
        }

        .logout-btn { background: #D4A5A5; color: white; }
        .logout-btn:hover { background: #C49595; }
        .cancel-btn { background: #9FB19F; color: white; }
        .cancel-btn:hover { background: #8AA08A; }

        /* ── Edit profile modal ── */
        .edit-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 250;
            align-items: center;
            justify-content: center;
        }

        .edit-modal-overlay.active { display: flex; }

        .edit-modal {
            background: #FDFBF7;
            border: 3px solid #E8B4B4;
            border-radius: 24px;
            padding: 30px 34px;
            width: 460px;
            max-width: 92vw;
        }

        .edit-modal h3 {
            font-size: 22px;
            font-weight: 700;
            color: #2A2A2A;
            margin-bottom: 18px;
        }

        .edit-modal label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9a7070;
            margin-bottom: 6px;
        }

        .edit-modal input,
        .edit-modal textarea {
            width: 100%;
            border: 2px solid transparent;
            background: #E8E8E0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #3A3A3A;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .edit-modal textarea {
            resize: vertical;
            min-height: 90px;
            max-height: 180px;
            margin-bottom: 18px;
        }

        .edit-modal input:focus,
        .edit-modal textarea:focus { border-color: #9FB19F; }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
        }

        .edit-modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-cancel-btn { background: #E8E8E0; color: #5A5A5A; }
        .edit-cancel-btn:hover { background: #DDD; }
        .edit-save-btn { background: #D4A5A5; color: #fff; }
        .edit-save-btn:hover { background: #c48f8f; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .page-body { padding: 0 16px 20px; }
            .top-bar { padding: 14px 16px; }
        }
    </style>
</head>
<body>
<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <a href="../Home page/home.html">
                <img src="logo.png" alt="CopyCook Logo">
            </a>
        </div>
        <nav class="nav-icons">
            <a href="../Home page/home.html" class="nav-icon">
                <img src="home-icon.png" alt="Home">
            </a>
            <a href="../Explore/explore.html" class="nav-icon">
                <img src="explore-icon.png" alt="Explore">
            </a>
            <a href="../post page/post.html" class="nav-icon">
                <img src="plus-icon.png" alt="Add">
            </a>
            <a href="saved.html" class="nav-icon active">
                <img src="save-icon.png" alt="Saved">
            </a>
            <a href="../Messages page/Messages.html" class="nav-icon" aria-label="Messages">
                <img src="message.png" alt="">
                <span class="messages-unread-dot" aria-hidden="true"></span>
            </a>
        </nav>
        <div class="nav-bottom">
            <a href="#" class="nav-icon" onclick="toggleLogoutPopup(event)">
                <img src="settings-icon.png" alt="Settings">
            </a>
        </div>
    </aside>

    <main class="main-content">

        <div class="top-bar">
            <button class="back-btn" id="backBtn" onclick="history.back()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back
            </button>
            <div class="search-bar" onclick="window.location.href='../Home page/home.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="7" stroke="#5A5A5A" stroke-width="2"/>
                    <path d="M16 16L20 20" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" placeholder="Search restaurants or dishes" readonly>
            </div>
            <div class="profile-avatar" id="profileAvatar" onclick="window.location.href='profile.html'"></div>
        </div>

        <div class="page-body">

            <!-- Profile hero -->
            <div class="profile-hero">
                <div class="big-avatar" id="bigAvatar"></div>
                <div class="hero-name" id="heroName">Loading…</div>
                <div class="hero-handle" id="heroHandle"></div>
                <div class="hero-bio" id="heroBio">No bio yet.</div>
                <div class="hero-stats">
                    <div class="stat">
                        <div class="stat-num" id="statSaves">—</div>
                        <div class="stat-lbl">saves</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num" id="statLikes">—</div>
                        <div class="stat-lbl">likes</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num" id="statFollowers">—</div>
                        <div class="stat-lbl">followers</div>
                    </div>
                    <div class="stat">
                        <div class="stat-num" id="statFollowing">—</div>
                        <div class="stat-lbl">following</div>
                    </div>
                </div>
                <!-- Only shown when viewing own profile -->
                <div class="hero-actions" id="heroActions">
                    <button class="btn-solid" id="editProfileBtn">Edit Profile</button>
                    <button class="btn-solid" id="followToggleBtn" style="display:none;" type="button" onclick="toggleFollowFromButton()">Follow</button>
                    <!-- Show share profile for all profiles-->
                    <button class="btn-outline" id="shareProfileBtn" onclick="shareProfile()">Share Profile</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs-bar">
                <!-- User posts
                <button class="tab" id="tabPosts" onclick="switchTab('posts')">Posts</button> -->
                <button class="tab active" id="tabSaves" onclick="switchTab('saves')">Saves</button>
                <button class="tab" id="tabLikes" onclick="switchTab('likes')">Likes</button>
            </div>

            <!-- Posts panel
            <div class="tab-panel" id="panel-posts">
                <div class="recipe-grid" id="postsGrid">
                    <div class="empty-state">
                        <div class="empty-icon"></div>
                        <p>Loading posts...</p>
                    </div>
                </div>
            </div> -->

            <!-- Saves panel -->
            <div class="tab-panel active" id="panel-saves">
                <div class="folders-grid" id="foldersGrid">
                    <div class="empty-state">
                        <div class="empty-icon"></div>
                        <p>Loading folders…</p>
                    </div>
                </div>
            </div>

            <!-- Likes panel -->
            <div class="tab-panel" id="panel-likes">
                <div class="recipe-grid" id="likesGrid">
                    <div class="empty-state">
                        <div class="empty-icon"></div>
                        <p>Loading likes…</p>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Edit profile modal -->
<div class="edit-modal-overlay" id="editProfileModal">
    <div class="edit-modal">
        <h3>Edit profile</h3>
        <label for="firstNameInput">First name</label>
        <input id="firstNameInput" type="text" maxlength="40" placeholder="Enter first name">
        <label for="lastNameInput">Last name</label>
        <input id="lastNameInput" type="text" maxlength="40" placeholder="Enter last name">
        <label for="bioInput">Bio</label>
        <textarea id="bioInput" maxlength="220" placeholder="Tell people about yourself"></textarea>
        <div class="edit-modal-actions">
            <button class="edit-cancel-btn" id="cancelEditProfileBtn">Cancel</button>
            <button class="edit-save-btn" id="saveEditProfileBtn">Save</button>
        </div>
    </div>
</div>

<!-- Logout popup -->
<div id="logoutPopup" class="logout-popup">
    <div class="logout-content">
        <h3>Account Settings</h3>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        <button class="cancel-btn" onclick="closeLogoutPopup()">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
        getFirestore, collection, getDocs, doc, getDoc, query, where,
        collectionGroup, setDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyACkR3_vUNa7dzD-Y3pWmLeM4Iu-UlxuDw",
        authDomain: "copycook-f596a.firebaseapp.com",
        projectId: "copycook-f596a",
        storageBucket: "copycook-f596a.firebasestorage.app",
        messagingSenderId: "366122548728",
        appId: "1:366122548728:web:b4300be3464e7e07822a0d"
    };

    const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const PLACEHOLDER_IMAGES = [
        'https://www.themealdb.com/images/media/meals/sytuqu1511553755.jpg',
        'https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg',
        'https://www.themealdb.com/images/media/meals/58oia61564916529.jpg',
        'https://www.themealdb.com/images/media/meals/wyrqqq1468233628.jpg',
        'https://www.themealdb.com/images/media/meals/urzj1d1587670726.jpg',
        'https://www.themealdb.com/images/media/meals/tkxquw1628771028.jpg',
        'https://www.themealdb.com/images/media/meals/sstssx1487349585.jpg',
        'https://www.themealdb.com/images/media/meals/1525876468.jpg',
    ];

    const params  = new URLSearchParams(window.location.search);
    const viewUid = params.get('uid');
    const sourceParam = params.get('source') || '';
    const openConvParam = params.get('openConv') || '';
    const otherUidParam = params.get('otherUid') || '';
    const otherNameParam = params.get('otherName') || '';
    /** Updated in onAuthStateChanged when we know the signed-in uid (handles ?uid=yourOwnUid). */
    let isOwnProfile = !viewUid;
    let signedInUid = null;
    let currentProfileUid = viewUid || null;
    let followBusy = false;
    let profileModel = { firstName: '', lastName: '', bio: '' };

    const AVATAR_COLORS = ['#D4A5A5','#9FB19F','#A5B4D4','#D4C4A5','#B4A5D4','#A5D4C4','#D4A5B4','#C4D4A5'];
    function colorFor(str) {
        let h = 0;
        for (const c of (str || 'X')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
        return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    function initialsFromName(name) {
        const trimmed = (name || '').trim();
        return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
    }

    function fullNameFromModel(model) {
        return `${model.firstName || ''} ${model.lastName || ''}`.trim();
    }

    // ── Load profile info ─────────────────────────────────────────────────────
    async function loadProfile(uid, isOwn) {
        if (isOwn) {
            try {
                const snap = await getDoc(doc(db, 'users', uid));
                const d = snap.exists() ? snap.data() : {};
                const localFirst = localStorage.getItem('profileFirstName') || '';
                const localLast = localStorage.getItem('profileLastName') || '';
                const localBio = localStorage.getItem('profileBio') || '';
                profileModel = {
                    firstName: d.firstName || localFirst,
                    lastName: d.lastName || localLast,
                    bio: d.bio || localBio
                };
                const fullName = fullNameFromModel(profileModel);
                const fallbackName = localStorage.getItem('userDisplayName') || 'Your Name';
                const name = fullName || d.displayName || fallbackName;
                const email = d.email || localStorage.getItem('userEmail') || '';
                const color = d.avatarColor || localStorage.getItem('userAvatarColor') || colorFor(name);
                applyProfileUI(initialsFromName(name), color, name, email, profileModel.bio || '');
            } catch (e) {
                const fallbackName = localStorage.getItem('userDisplayName') || 'Your Name';
                const email = localStorage.getItem('userEmail') || '';
                const color = localStorage.getItem('userAvatarColor') || colorFor(fallbackName);
                profileModel = {
                    firstName: localStorage.getItem('profileFirstName') || '',
                    lastName: localStorage.getItem('profileLastName') || '',
                    bio: localStorage.getItem('profileBio') || ''
                };
                const name = fullNameFromModel(profileModel) || fallbackName;
                applyProfileUI(initialsFromName(name), color, name, email, profileModel.bio || '');
            }
        } else {
            try {
                const snap = await getDoc(doc(db, 'users', uid));
                if (snap.exists()) {
                    const d = snap.data();
                    const name    = d.displayName || 'Unknown User';
                    const email   = d.email || '';
                    const color   = d.avatarColor || colorFor(name);
                    const initial = name.charAt(0).toUpperCase();
                    applyProfileUI(initial, color, name, email, d.bio || '');
                } else {
                    const name = sessionStorage.getItem('viewProfileName') || 'Unknown User';
                    applyProfileUI(name.charAt(0).toUpperCase(), colorFor(name), name, '', '');
                }
            } catch(e) {
                const name = sessionStorage.getItem('viewProfileName') || 'Unknown User';
                applyProfileUI(name.charAt(0).toUpperCase(), colorFor(name), name, '', '');
            }
        }
    }

    function applyProfileUI(initial, color, name, email, bio = '') {
        const handle = email ? '@' + email.split('@')[0] : '@' + name.toLowerCase().replace(/\s+/g, '');

        const topAv = document.getElementById('profileAvatar');
        const myInitial = localStorage.getItem('userInitial') || initial;
        const myColor   = localStorage.getItem('userAvatarColor') || color;
        topAv.textContent = myInitial;
        topAv.style.backgroundColor = myColor;

        const bigAv = document.getElementById('bigAvatar');
        bigAv.textContent = initial;
        bigAv.style.backgroundColor = color;

        document.getElementById('heroName').textContent   = name;
        document.getElementById('heroHandle').textContent = handle;
        document.getElementById('heroBio').textContent = (bio || '').trim() || 'No bio yet.';
        document.title = isOwnProfile ? 'CopyCook - Profile' : name + ' - CopyCook';

        if (isOwnProfile) {
            localStorage.setItem('userDisplayName', name);
            localStorage.setItem('userInitial', initial);
            localStorage.setItem('userAvatarColor', color);
            localStorage.setItem('profileFirstName', profileModel.firstName || '');
            localStorage.setItem('profileLastName', profileModel.lastName || '');
            localStorage.setItem('profileBio', bio || '');
        }
    }

    function openEditProfileModal() {
        document.getElementById('firstNameInput').value = profileModel.firstName || '';
        document.getElementById('lastNameInput').value = profileModel.lastName || '';
        document.getElementById('bioInput').value = profileModel.bio || '';
        document.getElementById('editProfileModal').classList.add('active');
    }

    function closeEditProfileModal() {
        document.getElementById('editProfileModal').classList.remove('active');
    }

    async function saveEditedProfile() {
        const me = getSignedInUid();
        if (!me) {
            closeEditProfileModal();
            return;
        }
        const firstName = document.getElementById('firstNameInput').value.trim();
        const lastName = document.getElementById('lastNameInput').value.trim();
        const bio = document.getElementById('bioInput').value.trim();
        const nextModel = { firstName, lastName, bio };
        const fullName = fullNameFromModel(nextModel) || localStorage.getItem('userDisplayName') || 'Your Name';
        const email = localStorage.getItem('userEmail') || '';
        const color = localStorage.getItem('userAvatarColor') || colorFor(fullName);

        profileModel = nextModel;
        applyProfileUI(initialsFromName(fullName), color, fullName, email, bio);
        closeEditProfileModal();

        try {
            await setDoc(doc(db, 'users', me), {
                firstName,
                lastName,
                bio,
                displayName: fullName
            }, { merge: true });
        } catch (e) {
            console.warn('Could not save profile to Firestore:', e);
        }
    }

    function followingRef(userUid, targetUid) {
        return doc(db, 'users', userUid, 'following', targetUid);
    }

    function updateFollowButton(isFollowing) {
        const btn = document.getElementById('followToggleBtn');
        if (!btn) return;
        btn.textContent = isFollowing ? 'Following' : 'Follow';
        btn.dataset.following = isFollowing ? 'true' : 'false';
        btn.classList.toggle('btn-outline', isFollowing);
        btn.classList.toggle('btn-solid', !isFollowing);
    }

    function applyFollowActionVisibility() {
        const shareBtn = document.getElementById('shareProfileBtn');
        const editBtn = document.getElementById('editProfileBtn');
        const followBtn = document.getElementById('followToggleBtn');
        if (shareBtn) shareBtn.style.display = 'inline-block'
;
        if (editBtn) editBtn.style.display = isOwnProfile ? '' : 'none';
        if (followBtn) followBtn.style.display = isOwnProfile ? 'none' : '';
        if (!isOwnProfile) closeEditProfileModal();
    }

    async function loadFollowStats(profileUid) {
        try {
            const [followersSnap, followingSnap] = await Promise.all([
                getDocs(query(collectionGroup(db, 'following'), where('targetUid', '==', profileUid))),
                getDocs(collection(db, 'users', profileUid, 'following'))
            ]);

            const followersCount = followersSnap.size;
            const followingCount = followingSnap.size;
            document.getElementById('statFollowers').textContent = String(followersCount);
            document.getElementById('statFollowing').textContent = String(followingCount);

            if (isOwnProfile) {
                localStorage.setItem('ccFollowers', String(followersCount));
                localStorage.setItem('ccFollowing', String(followingCount));
            }
        } catch (e) {
            console.warn('Could not load follow stats:', e);
            // Fallback when collectionGroup query/index is unavailable:
            // scan users and count who has users/{uid}/following/{profileUid}.
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                const checks = usersSnap.docs.map((u) => getDoc(doc(db, 'users', u.id, 'following', profileUid)));
                const followDocs = await Promise.all(checks);
                const followerCount = followDocs.filter((d) => d.exists()).length;
                document.getElementById('statFollowers').textContent = String(followerCount);
                if (isOwnProfile) localStorage.setItem('ccFollowers', String(followerCount));
            } catch (scanErr) {
                console.warn('Fallback follower scan failed:', scanErr);
                const fallbackFollowers = isOwnProfile ? (localStorage.getItem('ccFollowers') || '0') : '0';
                document.getElementById('statFollowers').textContent = fallbackFollowers;
            }

            try {
                const myFollowingSnap = await getDocs(collection(db, 'users', profileUid, 'following'));
                document.getElementById('statFollowing').textContent = String(myFollowingSnap.size);
                if (isOwnProfile) localStorage.setItem('ccFollowing', String(myFollowingSnap.size));
            } catch (_) {
                const fallbackFollowing = isOwnProfile ? (localStorage.getItem('ccFollowing') || '0') : '0';
                document.getElementById('statFollowing').textContent = fallbackFollowing;
            }
        }
    }

    function getSignedInUid() {
        const authUid = auth.currentUser?.uid || null;
        if (authUid) {
            localStorage.setItem('userUID', authUid);
            return authUid;
        }
        return null;
    }

    async function loadFollowState(viewedUid) {
        const me = getSignedInUid();
        if (isOwnProfile || !me) return;
        const relSnap = await getDoc(followingRef(me, viewedUid));
        updateFollowButton(relSnap.exists());
    }

    async function toggleFollow() {
        const me = getSignedInUid();
        if (followBusy || isOwnProfile || !currentProfileUid) return;
        if (!me) {
            window.alert('Please log in again to follow users.');
            return;
        }
        const btn = document.getElementById('followToggleBtn');
        followBusy = true;

        try {
            const currentlyFollowing = btn?.dataset.following === 'true';
            const myUserSnap = await getDoc(doc(db, 'users', me));
            const myData = myUserSnap.exists() ? myUserSnap.data() : {};
            const myName = myData.displayName || localStorage.getItem('userDisplayName') || 'User';
            const myEmail = myData.email || localStorage.getItem('userEmail') || '';
            const myColor = myData.avatarColor || localStorage.getItem('userAvatarColor') || colorFor(myName);

            const payload = {
                uid: me,
                displayName: myName,
                email: myEmail,
                avatarColor: myColor,
                targetUid: currentProfileUid,
                followedAt: serverTimestamp()
            };
            const followingDoc = followingRef(me, currentProfileUid);

            if (currentlyFollowing) {
                await deleteDoc(followingDoc);
            } else {
                await setDoc(followingDoc, payload, { merge: true });
            }
            updateFollowButton(!currentlyFollowing);
            const followersEl = document.getElementById('statFollowers');
            const currentFollowers = parseInt(followersEl?.textContent || '0', 10) || 0;
            if (followersEl) followersEl.textContent = String(currentlyFollowing ? Math.max(0, currentFollowers - 1) : currentFollowers + 1);

            const nextFollowing = currentlyFollowing
                ? Math.max(0, parseInt(localStorage.getItem('ccFollowing') || '0', 10) - 1)
                : parseInt(localStorage.getItem('ccFollowing') || '0', 10) + 1;
            localStorage.setItem('ccFollowing', String(nextFollowing));

            await loadFollowStats(currentProfileUid);
            if (me) {
                try {
                    const myFollowingSnap = await getDocs(collection(db, 'users', me, 'following'));
                    localStorage.setItem('ccFollowing', String(myFollowingSnap.size));
                } catch (_) {
                    // Keep optimistic count in localStorage.
                }
            }
        } catch (e) {
            console.warn('Could not update follow relationship:', e);
            const authUid = auth.currentUser?.uid || 'none';
            const localUid = localStorage.getItem('userUID') || 'none';
            const msg = (e && e.code)
                ? `Follow failed: ${e.code} (auth:${authUid}, local:${localUid})`
                : 'Follow failed. Please try again.';
            window.alert(msg);
        } finally {
            followBusy = false;
        }
    }

    function mapFolderDoc(d) {
        const data = d.data();
        const raw = data.savedRecipes || data.recipes || [];
        const privacy = (data.privacy || 'private').toString().toLowerCase().trim();
        return {
            id:         d.id,
            name:       data.name || 'Folder',
            privacy,
            recipes:    Array.isArray(raw) ? raw : [],
            coverImage: data.coverImage || null,
        };
    }

    function isPublicFolder(f) {
        return f.privacy === 'public';
    }

    /**
     * Load another user's public folders. Must use where('privacy' == 'public') so Firestore
     * can prove the query only returns readable docs (plain collection reads often fail with
     * permission-denied when rules allow owner OR public per document).
     */
    async function fetchPublicFoldersForOtherUser(uid) {
        const mergeSnaps = (snaps) => {
            const seen = new Set();
            const out = [];
            snaps.forEach((snap) => {
                snap.docs.forEach((d) => {
                    if (seen.has(d.id)) return;
                    seen.add(d.id);
                    out.push(mapFolderDoc(d));
                });
            });
            return out.filter(isPublicFolder);
        };
        try {
            const q = query(
                collection(db, 'users', uid, 'folders'),
                where('privacy', 'in', ['public', 'Public'])
            );
            const snap = await getDocs(q);
            return mergeSnaps([snap]);
        } catch (e) {
            if (e && e.code !== 'failed-precondition') throw e;
            const out = [];
            for (const p of ['public', 'Public']) {
                const q = query(collection(db, 'users', uid, 'folders'), where('privacy', '==', p));
                out.push(await getDocs(q));
            }
            return mergeSnaps(out);
        }
    }

     // -- Load user posts -----------------------------


    // ── Load saves (public folders) ───────────────────────────────────────────
    async function loadSaves(uid) {
        const grid = document.getElementById('foldersGrid');
        try {
            let publicFolders;
            if (isOwnProfile) {
                const snap = await getDocs(collection(db, 'users', uid, 'folders'));
                publicFolders = snap.docs.map(mapFolderDoc).filter(isPublicFolder);
            } else {
                publicFolders = await fetchPublicFoldersForOtherUser(uid);
            }

            const totalRecipes = publicFolders.reduce((sum, f) => sum + (f.recipes || []).length, 0);
            document.getElementById('statSaves').textContent = totalRecipes;

            grid.innerHTML = '';

            if (!publicFolders.length) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔖</div>
                        <p>No public folders yet</p>
                        <span>${isOwnProfile ? 'Make a folder public in your saved page' : 'This user has no public folders'}</span>
                    </div>`;
                return;
            }

            publicFolders.forEach((folder, idx) => {
                const thumb       = folder.coverImage || PLACEHOLDER_IMAGES[idx % PLACEHOLDER_IMAGES.length];
                const recipeCount = (folder.recipes || []).length;
                const subtitle    = recipeCount === 0 ? 'Empty' : `${recipeCount} recipe${recipeCount !== 1 ? 's' : ''}`;

                const card = document.createElement('div');
                card.className = 'folder-card';
                card.onclick = () => {
                    const q = new URLSearchParams();
                    q.set('id', folder.id);
                    if (!isOwnProfile) q.set('uid', uid);
                    if (!isOwnProfile && sourceParam === 'messages') {
                        q.set('source', 'messages');
                        if (openConvParam) q.set('openConv', openConvParam);
                        if (otherUidParam) q.set('otherUid', otherUidParam);
                        if (otherNameParam) q.set('otherName', otherNameParam);
                    }
                    if (isOwnProfile) {
                        q.set('source', 'ownProfile');
                        if (sourceParam) q.set('profileSource', sourceParam);
                    }
                    window.location.href = `folder.html?${q.toString()}`;
                };
                card.innerHTML = `
                    <div class="folder-thumb">
                        <img src="${thumb}" alt="${folder.name}" loading="lazy"
                             onerror="this.src='${PLACEHOLDER_IMAGES[0]}'">
                    </div>
                    <div class="folder-name">
                        ${folder.name}
                        <div class="folder-subtitle">${subtitle}</div>
                    </div>`;
                grid.appendChild(card);
            });

        } catch (e) {
            console.warn('Could not load saves:', e);
            document.getElementById('statSaves').textContent = '0';
            const code = e && e.code ? String(e.code) : '';
            const extra = code === 'permission-denied'
                ? '<span style="display:block;margin-top:8px;font-size:12px;color:#9A8A80;">Deploy updated <code>firestore.rules</code> (public folder read + <code>public</code> or <code>Public</code>), then run <code>firebase deploy --only firestore:rules</code>.</span>'
                : (code === 'failed-precondition'
                    ? '<span style="display:block;margin-top:8px;font-size:12px;color:#9A8A80;">If this mentions an index, open the link in the browser console to create it in Firebase.</span>'
                    : '');
            grid.innerHTML =
                `<div class="empty-state"><div class="empty-icon">🔖</div><p>Couldn't load folders</p>${extra}</div>`;
        }
    }

    // ── Load likes — reads from users/{uid}/likes subcollection ──────────────
    async function loadLikes(uid) {
        const grid = document.getElementById('likesGrid');
        try {
            const snap  = await getDocs(collection(db, 'users', uid, 'likes'));
            const items = snap.docs.map(d => d.data());

            document.getElementById('statLikes').textContent = items.length;
            renderLikeCards(items);
        } catch (e) {
            console.warn('Could not load likes:', e);
            document.getElementById('statLikes').textContent = '0';
            renderLikeCards([]);
        }
    }

    function renderLikeCards(items) {
        const grid = document.getElementById('likesGrid');
        grid.innerHTML = '';

        if (!items.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🤍</div>
                    <p>Nothing here yet</p>
                    <span>${isOwnProfile ? 'Recipes you like will appear here' : 'No liked recipes yet'}</span>
                </div>`;
            return;
        }

        items.forEach(item => {
            const title = item.strMeal || item.name || 'Recipe';
            const thumb = item.strMealThumb || item.thumb
                || 'https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg';
            const id    = item.idMeal || item.id;

            const card = document.createElement('div');
            card.className = 'recipe-card';
            if (id) {
                const rawId = String(id);
                card.onclick = () => {
                    if (rawId.startsWith('post-')) {
                        const postId = rawId.replace(/^post-/, '');
                        window.location.href = `../Home page/community-recipe.html?id=${encodeURIComponent(postId)}`;
                        return;
                    }
                    window.location.href = `../Home page/recipe.html?id=${encodeURIComponent(rawId)}`;
                };
            }

            card.innerHTML = `
                <div class="heart-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#F06292"/>
                    </svg>
                </div>
                <img src="${thumb}" alt="${title}" loading="lazy"
                     onerror="this.src='https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg'">
                <div class="recipe-card-body">
                    <div class="recipe-card-title">${title}</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        document.getElementById('panel-' + tab).classList.add('active');
    };

    // Share profile

    window.shareProfile = function() {
        // Always include the viewed profile's uid so the link works for everyone
        const uidToShare = currentProfileUid || signedInUid;
        const baseUrl = window.location.origin + window.location.pathname;
        const profileUrl = uidToShare
            ? `${baseUrl}?uid=${encodeURIComponent(uidToShare)}`
            : window.location.href;

        const profileName = document.getElementById('heroName')?.textContent
                            || 'CopyCook Profile';

        if (navigator.share) {
            navigator.share({
                title: profileName,
                url: profileUrl
            }).catch(err => console.warn('Error sharing:', err));
        } else {
            navigator.clipboard.writeText(profileUrl).then(() => {
                alert('Profile link copied to clipboard!');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('Please copy the URL manually: ' + profileUrl);
            });
        }
    };


    // ── Logout ────────────────────────────────────────────────────────────────
    window.toggleLogoutPopup = function(e) {
        e.preventDefault();
        document.getElementById('logoutPopup').classList.toggle('active');
    };
    window.closeLogoutPopup = function() {
        document.getElementById('logoutPopup').classList.remove('active');
    };
    window.handleLogout = function() {
        localStorage.clear(); sessionStorage.clear();
        window.location.href = '../login.html';
    };
    document.getElementById('logoutPopup').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeLogoutPopup();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    onAuthStateChanged(auth, async user => {
        const targetUid = viewUid || (user ? user.uid : null);

        if (!targetUid) {
            window.location.href = '../login.html';
            return;
        }

        if (user) localStorage.setItem('userUID', user.uid);
        signedInUid = user ? user.uid : null;
        currentProfileUid = targetUid;

        isOwnProfile = !viewUid || (user && viewUid === user.uid);
        applyFollowActionVisibility();

        await loadProfile(targetUid, isOwnProfile);
        await loadSaves(targetUid);
        await loadLikes(targetUid);
        await loadFollowStats(targetUid);
        await loadFollowState(targetUid);

    });

    const editBtn = document.getElementById('editProfileBtn');
    const cancelEditBtn = document.getElementById('cancelEditProfileBtn');
    const saveEditBtn = document.getElementById('saveEditProfileBtn');
    const editModal = document.getElementById('editProfileModal');
    if (editBtn) editBtn.addEventListener('click', openEditProfileModal);
    if (cancelEditBtn) cancelEditBtn.addEventListener('click', closeEditProfileModal);
    if (saveEditBtn) {
        saveEditBtn.addEventListener('click', () => {
            void saveEditedProfile();
        });
    }
    if (editModal) {
        editModal.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEditProfileModal();
        });
    }

    const followBtn = document.getElementById('followToggleBtn');
    if (followBtn) {
        followBtn.addEventListener('click', () => {
            void toggleFollow();
        });
    }

    window.toggleFollowFromButton = function() {
        if (followBusy) return;
        void toggleFollow();
    };

    const backBtn = document.getElementById('backBtn');
    if (backBtn && sourceParam === 'messages' && openConvParam) {
        const q = new URLSearchParams({
            openConv: openConvParam,
            otherUid: otherUidParam || '',
            otherName: otherNameParam || ''
        });
        backBtn.onclick = null;
        backBtn.addEventListener('click', () => {
            window.location.href = '../Messages page/Messages.html?' + q.toString();
        });
    }
    if (backBtn && isOwnProfile && sourceParam === 'saved') {
        backBtn.onclick = null;
        backBtn.addEventListener('click', () => {
            window.location.href = 'saved.html';
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCook - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F5EFE7;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 75px;
            background-color: #F5EFE7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 2px solid #E8B4B4;
            flex-shrink: 0;
        }

        .logo { margin-bottom: 40px; }
        .logo img { height: 50px; width: auto; cursor: pointer; }

        .nav-icons {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
            margin-top: 150px;
        }

        .nav-icon {
            position: relative;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon img { width: 100%; height: 100%; border-radius: 50%; }
        .nav-icon.active { box-shadow: 0 0 0 3px #E8B4B4; }

        .notification-badge {
            position: absolute;
            top: -3px; right: -3px;
            background-color: #D4A5A5;
            color: white;
            font-size: 10px; font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 18px; text-align: center;
        }

        .nav-bottom { margin-top: auto; padding-bottom: 20px; }

        /* ── Main ── */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; background-color: #F5EFE7;
        }

        /* ── Top bar ── */
        .top-bar {
            display: flex; align-items: center;
            padding: 18px 30px; gap: 15px; flex-shrink: 0;
        }

        /* ── Back button ── */
        .back-btn {
            display: flex; align-items: center; gap: 5px;
            background: none; border: none;
            font-size: 14px; font-weight: 500; color: #5A5A5A;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            transition: color 0.2s; flex-shrink: 0; padding: 0;
        }

        .back-btn:hover { color: #D4A5A5; }

        .search-bar {
            flex: 1; display: flex; align-items: center;
            background-color: #9FB19F; border-radius: 15px;
            padding: 13px 20px; gap: 12px;
            transition: background-color 0.3s; cursor: pointer;
        }

        .search-bar:hover { background-color: #8AA08A; }

        .search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 15px; color: #3A3A3A;
            font-family: 'Poppins', sans-serif; cursor: pointer;
        }

        .search-bar input::placeholder { color: #5A5A5A; }

        .profile-avatar {
            width: 50px; height: 50px;
            border-radius: 50%; border: 3px solid #E8B4B4;
            cursor: pointer; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: white;
            flex-shrink: 0; transition: transform 0.3s;
        }

        .profile-avatar:hover { transform: scale(1.05); }

        /* ── Scrollable body ── */
        .page-body {
            flex: 1; overflow-y: auto;
            padding: 0 40px 40px;
        }

        .page-body::-webkit-scrollbar { width: 8px; }
        .page-body::-webkit-scrollbar-track { background: #F5EFE7; }
        .page-body::-webkit-scrollbar-thumb { background: #D4A5A5; border-radius: 8px; }

        /* ── Profile hero ── */
        .profile-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 0 28px;
            gap: 12px;
        }

        .big-avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: #D4A5A5;
            border: 4px solid #fff;
            box-shadow: 0 0 0 3px #E8B4B4;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 700; color: #fff;
            overflow: hidden; flex-shrink: 0; user-select: none;
        }

        .hero-name {
            font-size: 22px; font-weight: 700; color: #2A2A2A; line-height: 1.2;
        }

        .hero-handle {
            font-size: 13px; color: #a07878; margin-top: -4px;
        }

        .hero-bio {
            max-width: 520px;
            text-align: center;
            font-size: 13px;
            color: #7f6666;
            line-height: 1.5;
            margin-top: 2px;
        }

        .hero-stats {
            display: flex; gap: 36px; margin-top: 4px;
        }

        .stat { text-align: center; }
        .stat-num { font-size: 17px; font-weight: 700; color: #2A2A2A; }
        .stat-lbl { font-size: 11px; color: #b08888; font-weight: 500; }

        .hero-actions {
            display: flex; gap: 12px; margin-top: 4px;
        }

        .btn-outline {
            padding: 9px 26px; border-radius: 20px;
            border: 1.5px solid #E8B4B4;
            background: transparent; color: #9a7070;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }

        .btn-outline:hover { background: rgba(232,180,180,0.15); }

        .btn-solid {
            padding: 9px 26px; border-radius: 20px; border: none;
            background: #D4A5A5; color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(212,165,165,0.35);
            transition: background 0.2s;
        }

        .btn-solid:hover { background: #c48f8f; }

        /* ── Tabs ── */
        .tabs-bar {
            display: flex;
            border-bottom: 2px solid #e8ddd5;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1; text-align: center; padding: 13px 0;
            font-size: 14px; font-weight: 600; color: #c4a0a0;
            cursor: pointer; position: relative;
            border: none; background: none;
            font-family: 'Poppins', sans-serif;
            transition: color 0.2s;
        }

        .tab::after {
            content: ''; position: absolute;
            bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 0; height: 2.5px;
            background: #D4A5A5; border-radius: 2px;
            transition: width 0.25s ease;
        }

        .tab.active { color: #3a2e2e; }
        .tab.active::after { width: 55%; }

        /* ── Tab panels ── */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Folder grid (public folders in Saves panel) ── */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .folder-card {
            border-radius: 18px; overflow: hidden; cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            background: white;
            box-shadow: 0 2px 10px rgba(58,46,46,0.07);
        }

        .folder-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(58,46,46,0.13);
        }

        .folder-thumb {
            position: relative; aspect-ratio: 4/3; overflow: hidden;
        }

        .folder-thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.3s;
        }

        .folder-card:hover .folder-thumb img { transform: scale(1.05); }

        .folder-name {
            padding: 10px 12px 13px;
            font-size: 12px; font-weight: 600; color: #3a2e2e; line-height: 1.4;
        }

        .folder-name .folder-subtitle {
            font-size: 11px; font-weight: 400; color: #b08888; margin-top: 2px;
        }

        /* ── Recipe grid ── */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .recipe-card {
            border-radius: 18px; overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 10px rgba(58,46,46,0.07);
            cursor: pointer; position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(58,46,46,0.13);
        }

        .recipe-card img {
            width: 100%; aspect-ratio: 4/3;
            object-fit: cover; display: block;
        }

        .recipe-card-body { padding: 10px 12px 13px; }

        .recipe-card-title {
            font-size: 12px; font-weight: 600; color: #3a2e2e; line-height: 1.4;
            display: -webkit-box;
            line-clamp: 2;                 /* standard property */
            -webkit-line-clamp: 2;         /* WebKit fallback */
            -webkit-box-orient: vertical;
            overflow: hidden;
    }


        .recipe-card-meta { font-size: 11px; color: #b08888; margin-top: 4px; }

        .heart-badge {
            position: absolute; top: 8px; right: 8px;
            width: 30px; height: 30px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            pointer-events: none;
        }

        .heart-badge svg {
            width: 20px; height: 20px;
            display: block;
        }

        /* ── Empty / loading state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center; padding: 60px 20px; color: #c4a0a0;
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.5; }
        .empty-state p { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #9a7878; }
        .empty-state span { font-size: 12px; }

        /* ── Logout popup ── */
        .logout-popup {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center;
        }

        .logout-popup.active { display: flex; }

        .logout-content {
            background: #FDFBF7; border: 3px solid #E8B4B4;
            border-radius: 20px; padding: 40px 50px; text-align: center;
        }

        .logout-content h3 { color: #3A3A3A; font-size: 22px; margin-bottom: 24px; font-weight: 500; }

        .logout-btn, .cancel-btn {
            width: 100%; padding: 14px 30px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif; margin: 6px 0; transition: all 0.2s;
        }

        .logout-btn { background: #D4A5A5; color: white; }
        .logout-btn:hover { background: #C49595; }
        .cancel-btn { background: #9FB19F; color: white; }
        .cancel-btn:hover { background: #8AA08A; }

        /* ── Edit profile modal ── */
        .edit-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 250;
            align-items: center;
            justify-content: center;
        }

        .edit-modal-overlay.active { display: flex; }

        .edit-modal {
            background: #FDFBF7;
            border: 3px solid #E8B4B4;
            border-radius: 24px;
            padding: 30px 34px;
            width: 460px;
            max-width: 92vw;
            animation: popIn 0.2s ease-out;
        }

        .edit-modal h3 {
            font-size: 22px;
            font-weight: 700;
            color: #2A2A2A;
            margin-bottom: 18px;
        }

        .edit-modal label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9a7070;
            margin-bottom: 6px;
        }

        .edit-modal input,
        .edit-modal textarea {
            width: 100%;
            border: 2px solid transparent;
            background: #E8E8E0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #3A3A3A;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .edit-modal textarea {
            resize: vertical;
            min-height: 90px;
            max-height: 180px;
            margin-bottom: 18px;
        }

        .edit-modal input:focus,
        .edit-modal textarea:focus { border-color: #9FB19F; }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
        }

        .edit-modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-cancel-btn { background: #E8E8E0; color: #5A5A5A; }
        .edit-cancel-btn:hover { background: #DDD; }
        .edit-save-btn { background: #D4A5A5; color: #fff; }
        .edit-save-btn:hover { background: #c48f8f; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .page-body { padding: 0 16px 20px; }
            .top-bar { padding: 14px 16px; }
        }
    </style>
</head>
<body>

            </a>
            <a href="../Explore/explore.html" class="nav-icon">
                <img src="explore-icon.png" alt="Explore">
            </a>
            <a href="#" class="nav-icon">
                <img src="plus-icon.png" alt="Add">
            </a>
            <a href="saved.html" class="nav-icon active">
                <img src="save-icon.png" alt="Saved">
            </a>

                </svg>
                Back
            </button>
            <div class="search-bar" onclick="window.location.href='../Home page/home.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">

                </svg>

                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect x="10" y="5" width="4" height="10" rx="2" fill="#D4A5A5"/>
                    <path d="M7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12" stroke="#D4A5A5" stroke-width="2"/>
                    <line x1="12" y1="17" x2="12" y2="20" stroke="#D4A5A5" stroke-width="2"/>

<!------ Edit Profile Modal --------------------------------->

        <label for="firstNameInput">First name</label>

<!-- Logout popup -->

        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        <button class="cancel-btn" onclick="closeLogoutPopup()">Cancel</button>
    </div>
</div>

<script type="module">
    import { auth, db } from '../firebase-config.js';
    import { getFolders } from '../firebase-functions.js';
    import { onAuthStateChanged }
        from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { collection, doc, getDoc, getDocs, setDoc }
        from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const PLACEHOLDER_IMAGES = [
        'https://www.themealdb.com/images/media/meals/sytuqu1511553755.jpg',
        'https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg',
        'https://www.themealdb.com/images/media/meals/58oia61564916529.jpg',
        'https://www.themealdb.com/images/media/meals/wyrqqq1468233628.jpg',
        'https://www.themealdb.com/images/media/meals/urzj1d1587670726.jpg',
        'https://www.themealdb.com/images/media/meals/tkxquw1628771028.jpg',
        'https://www.themealdb.com/images/media/meals/sstssx1487349585.jpg',
        'https://www.themealdb.com/images/media/meals/1525876468.jpg',
    ];

    let activeUserId = null;
    let profileModel = {
        firstName: '',
        lastName: '',
        bio: ''
    };

    function initialsFromName(name) {
        const trimmed = (name || '').trim();
        return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
    }

    function fullNameFromModel(model) {
        return `${model.firstName || ''} ${model.lastName || ''}`.trim();
    }

    function renderProfile(model) {
        const nameFromStorage = localStorage.getItem('userDisplayName') || 'Your Name';
        const displayName = fullNameFromModel(model) || nameFromStorage;
        const initial = initialsFromName(displayName);
        const color = localStorage.getItem('userAvatarColor') || '#D4A5A5';
        const email = localStorage.getItem('userEmail') || '';
        const handle = email ? '@' + email.split('@')[0] : '@user';
        const bio = (model.bio || '').trim();

        const topAv = document.getElementById('profileAvatar');
        topAv.textContent = initial;
        topAv.style.backgroundColor = color;

        const bigAv = document.getElementById('bigAvatar');
        bigAv.textContent = initial;
        bigAv.style.backgroundColor = color;

        document.getElementById('heroName').textContent = displayName;
        document.getElementById('heroHandle').textContent = handle;
        document.getElementById('heroBio').textContent = bio || 'No bio yet.';

        localStorage.setItem('userDisplayName', displayName);
        localStorage.setItem('userInitial', initial);
        localStorage.setItem('profileFirstName', model.firstName || '');
        localStorage.setItem('profileLastName', model.lastName || '');
        localStorage.setItem('profileBio', model.bio || '');
    }

    // ── Profile info ─────────────────────────────────────────────────────────
    function loadProfile() {
        profileModel = {
            firstName: localStorage.getItem('profileFirstName') || '',
            lastName: localStorage.getItem('profileLastName') || '',
            bio: localStorage.getItem('profileBio') || ''
        };
        renderProfile(profileModel);
    }

    function openEditProfileModal() {
        document.getElementById('firstNameInput').value = profileModel.firstName || '';
        document.getElementById('lastNameInput').value = profileModel.lastName || '';
        document.getElementById('bioInput').value = profileModel.bio || '';
        document.getElementById('editProfileModal').classList.add('active');
        setTimeout(() => document.getElementById('firstNameInput').focus(), 0);
    }

    function closeEditProfileModal() {
        document.getElementById('editProfileModal').classList.remove('active');
    }

    async function saveEditedProfile() {
        const firstName = document.getElementById('firstNameInput').value.trim();
        const lastName = document.getElementById('lastNameInput').value.trim();
        const bio = document.getElementById('bioInput').value.trim();
        const nextModel = { firstName, lastName, bio };

        profileModel = nextModel;
        renderProfile(profileModel);
        closeEditProfileModal();

        if (!activeUserId) return;

        try {
            await setDoc(doc(db, 'users', activeUserId), {
                firstName,
                lastName,
                bio,
                displayName: fullNameFromModel(nextModel)
            }, { merge: true });
        } catch (e) {
            console.warn('Could not save profile to Firestore:', e);
        }
    }

    // ── Load saves: public folders + total recipe count ───────────────────────
    async function loadSaves(uid) {
        const grid = document.getElementById('foldersGrid');

        // Only loads public folders 

        try {
            const allFolders    = await getFolders(uid);
            const publicFolders = allFolders.filter(f => f.privacy === 'public');
            // const privateFolders = allFolders.filter(f => f.privacy === 'private');
            const totalRecipes = publicFolders.reduce((sum, f) => sum + (f.recipes || []).length, 0);
            document.getElementById('statSaves').textContent = totalRecipes;

            grid.innerHTML = '';

            if (!publicFolders.length) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔖</div>
                        <p>No public folders yet</p>
                        <span>Make a folder public in your saved page to show it here</span>
                    </div>`;
                return;
            }

            publicFolders.forEach((folder, idx) => {
                const thumb       = folder.coverImage || PLACEHOLDER_IMAGES[idx % PLACEHOLDER_IMAGES.length];
                const recipeCount = (folder.recipes || []).length;
                const subtitle    = recipeCount === 0 ? 'Empty' : `${recipeCount} recipe${recipeCount !== 1 ? 's' : ''}`;

                const card = document.createElement('div');
                card.className = 'folder-card';
                card.onclick = () => window.location.href = `folder.html?id=${folder.id}`;

                card.innerHTML = `
                    <div class="folder-thumb">
                        <img src="${thumb}" alt="${folder.name}" loading="lazy"
                             onerror="this.src='${PLACEHOLDER_IMAGES[0]}'">
                    </div>
                    <div class="folder-name">
                        ${folder.name}
                        <div class="folder-subtitle">${subtitle}</div>
                    </div>`;

                grid.appendChild(card);
            });

        } catch (e) {
            console.warn('Could not load saves:', e);
            document.getElementById('statSaves').textContent = '0';
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔖</div>
                    <p>Couldn't load folders</p>
                    <span>Try refreshing the page</span>
                </div>`;
        }
    }
    

    // ── Load likes ────────────────────────────────────────────────────────────
    async function loadLikes(uid) {
        try {
            const userSnap = await getDoc(doc(db, 'users', uid));
            let items = [];

            if (userSnap.exists()) {
                const fromUserDoc = userSnap.data().likedRecipes;
                if (Array.isArray(fromUserDoc)) items = fromUserDoc;
            }

            // Backward-compatible fallback for older data model.
            if (!items.length) {
                try {
                    const snap = await getDocs(collection(db, 'users', uid, 'likedRecipes'));
                    snap.forEach(d => items.push(d.data()));
                } catch {
                    // Ignore fallback failures; primary path is users/{uid}.likedRecipes.
                }
            }

            document.getElementById('statLikes').textContent = items.length;
            renderLikeCards(items);
        } catch (e) {
            console.warn('Could not load likes:', e);
            document.getElementById('statLikes').textContent = '0';
            renderLikeCards([]);
        }
    }

    function renderLikeCards(items) {
        const grid = document.getElementById('likesGrid');
        grid.innerHTML = '';

        if (!items.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🤍</div>
                    <p>Nothing here yet</p>
                    <span>Recipes you like will appear here</span>
                </div>`;
            return;
        }

        items.forEach(item => {
            const title = item.strMeal || item.name || item.title || 'Recipe';
            const thumb = item.strMealThumb || item.thumb || item.image
                || 'https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg';
            const cat   = item.strCategory || item.category || '';
            const id    = item.idMeal || item.id;

            const card = document.createElement('div');
            card.className = 'recipe-card';
            if (id) card.onclick = () => window.location.href = `../Home page/recipe.html?id=${id}`;

            card.innerHTML = `
                <div class="heart-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                              stroke="#D4A5A5" stroke-width="2" fill="#D4A5A5"/>
                    </svg>
                </div>
                <img src="${thumb}" alt="${title}" loading="lazy"
                     onerror="this.src='https://www.themealdb.com/images/media/meals/llcbn01574260722.jpg'">
                <div class="recipe-card-body">
                    <div class="recipe-card-title">${title}</div>
                    ${cat ? `<div class="recipe-card-meta">${cat}</div>` : ''}
                </div>`;

            grid.appendChild(card);
        });
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        document.getElementById('panel-' + tab).classList.add('active');
    };

    // ── Logout ────────────────────────────────────────────────────────────────
    window.toggleLogoutPopup = function(e) {
        e.preventDefault();
        document.getElementById('logoutPopup').classList.toggle('active');
    };
    window.closeLogoutPopup = function() {
        document.getElementById('logoutPopup').classList.remove('active');
    };
    window.handleLogout = function() {
        localStorage.clear(); sessionStorage.clear();
        window.location.href = '../login.html';
    };
    document.getElementById('logoutPopup').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeLogoutPopup();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    loadProfile();

    document.getElementById('editProfileBtn').addEventListener('click', openEditProfileModal);
    document.getElementById('cancelEditProfileBtn').addEventListener('click', closeEditProfileModal);
    document.getElementById('saveEditProfileBtn').addEventListener('click', saveEditedProfile);
    document.getElementById('editProfileModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeEditProfileModal();
    });

    onAuthStateChanged(auth, user => {
        if (user) {
            activeUserId = user.uid;

            getDoc(doc(db, 'users', user.uid)).then(userDoc => {
                const data = userDoc.exists() ? userDoc.data() : {};
                profileModel = {
                    firstName: data.firstName || profileModel.firstName,
                    lastName: data.lastName || profileModel.lastName,
                    bio: data.bio || profileModel.bio
                };
                renderProfile(profileModel);
            }).catch(err => {
                console.warn('Could not load profile details:', err);
            });

            loadSaves(user.uid);
            loadLikes(user.uid);
        } else {
            activeUserId = null;
            document.getElementById('statSaves').textContent = '0';
            document.getElementById('statLikes').textContent = '0';
            document.getElementById('foldersGrid').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔖</div>
                    <p>No public folders yet</p>
                    <span>Log in to see your folders</span>
                </div>`;
            renderLikeCards([]);
        }
    });
</script>
</body>
</html>
